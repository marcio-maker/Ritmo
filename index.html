<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teste Siri Voz 1 vs Voz 2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100dvh; padding: 18px;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  h1 { font-size: 1rem; color: #f1f5f9; text-align: center; margin-bottom: 4px; }
  .sub { font-size: .75rem; color: #64748b; text-align: center; margin-bottom: 16px; }

  .diag {
    background: #1e293b; border-radius: 12px; padding: 12px;
    font-size: .72rem; line-height: 1.6; color: #94a3b8;
    margin-bottom: 16px;
  }
  .diag b { color: #22d3ee; }
  .diag .ok { color: #22d3ee; }
  .diag .aviso { color: #f87171; }
  .diag .lista { color: #fbbf24; font-size: .68rem; margin-top: 8px; }

  .bloco {
    background: #1e293b; border-radius: 12px; padding: 14px;
    margin-bottom: 12px;
  }
  .bloco h2 {
    font-size: .85rem; color: #93c5fd; margin-bottom: 6px;
  }
  .voz-label {
    font-size: .7rem; color: #fbbf24; font-weight: 700;
    margin-bottom: 10px;
  }
  .texto {
    font-size: .9rem; color: #cbd5e1; line-height: 1.6;
    margin-bottom: 12px;
  }
  .frase {
    padding: 4px 6px; border-radius: 5px; margin-bottom: 2px;
    transition: background .15s, color .15s;
  }
  .frase.falando { background: rgba(59,130,246,.25); color: #fff; }
  .frase.falada { color: #475569; }

  .btn {
    width: 100%; min-height: 48px; border: none; border-radius: 10px;
    font-size: .9rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #2563eb; color: #fff;
  }
  .btn.tocando { background: #dc2626; }
  .btn:active { opacity: .8; }
</style>
</head>
<body>

<h1>🎙 Teste Siri Voz 1 vs Voz 2</h1>
<p class="sub">Bloco 1 = Siri Voz 1 · Bloco 2 = Siri Voz 2</p>

<div class="diag" id="diag">🔍 Carregando vozes...</div>

<div class="bloco" id="bloco-1">
  <h2>Bloco 1</h2>
  <div class="voz-label" id="voz-1">🎙 Siri Voz 1</div>
  <div class="texto" id="texto-1"></div>
  <button class="btn" onclick="tocar('b1')">🔊 Ouvir Bloco 1</button>
</div>

<div class="bloco" id="bloco-2">
  <h2>Bloco 2</h2>
  <div class="voz-label" id="voz-2">🎙 Siri Voz 2</div>
  <div class="texto" id="texto-2"></div>
  <button class="btn" onclick="tocar('b2')">🔊 Ouvir Bloco 2</button>
</div>

<script>
/* =====================================================
   CONTEÚDO — 2 blocos curtos
   ===================================================== */
const BLOCOS = {
  b1: {
    vozIndex: 0,
    frases: [
      "Gestão de pessoas é a área responsável pelo ser humano no trabalho.",
      "Ela atrai, desenvolve, motiva e mantém as pessoas na empresa.",
      "Guarde isto: gestão de pessoas cuida do ser humano no trabalho."
    ]
  },
  b2: {
    vozIndex: 1,
    frases: [
      "A gestão estratégica de pessoas alinha as políticas de pessoal aos objetivos do negócio.",
      "Se a empresa quer crescer, precisa preparar a equipe.",
      "Guarde isto: gestão estratégica é alinhar gente e negócio."
    ]
  }
};

/* =====================================================
   CONEXÃO COM AS VOZES — resolve bugs do Safari iOS
   ===================================================== */
let todasAsVozes = [];
let vozesResolvidas = [];
let carregado = false;

function carregarVozes(callback) {
  let tentativas = 0;
  function tentar() {
    tentativas++;
    const vozes = window.speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      carregado = true;
      callback();
      return;
    }
    if (tentativas < 50) setTimeout(tentar, 100);
    else callback();
  }
  // iOS 15 bug: addEventListener pode não existir
  if (window.speechSynthesis.addEventListener) {
    try { window.speechSynthesis.addEventListener('voiceschanged', tentar); }
    catch (e) { window.speechSynthesis.onvoiceschanged = tentar; }
  } else {
    window.speechSynthesis.onvoiceschanged = tentar;
  }
  tentar();
}

function buscarVozSiri(indice) {
  // Estratégia em cascata: tenta vários nomes possíveis
  const candidatos = [
    `Siri Voz ${indice + 1}`,
    `Siri Voice ${indice + 1}`,
    `Siri ${indice + 1}`
  ];
  for (const nome of candidatos) {
    const exata = todasAsVozes.find(v => v.name === nome);
    if (exata) return { voz: exata, nomeEncontrado: exata.name };
  }
  // match parcial
  for (const nome of candidatos) {
    const parcial = todasAsVozes.find(v => v.name.includes(nome));
    if (parcial) return { voz: parcial, nomeEncontrado: parcial.name };
  }
  // fallback: qualquer "Siri"
  const siri = todasAsVozes.find(v => v.name.toLowerCase().includes('siri'));
  if (siri) return { voz: siri, nomeEncontrado: siri.name };
  return null;
}

function resolverVozes() {
  const s1 = buscarVozSiri(0);
  const s2 = buscarVozSiri(1);
  vozesResolvidas = [
    { nome: 'Siri Voz 1', ...(s1 || { voz: null, nomeEncontrado: null }) },
    { nome: 'Siri Voz 2', ...(s2 || { voz: null, nomeEncontrado: null }) }
  ];
  mostrarDiagnostico();
}

function mostrarDiagnostico() {
  const diag = document.getElementById('diag');
  const ptBR = todasAsVozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
  let html = `<b>🔍 Diagnóstico</b><br>`;
  html += `Total de vozes: ${todasAsVozes.length} · pt-BR: ${ptBR.length}<br><br>`;

  vozesResolvidas.forEach(r => {
    if (r.voz) {
      html += `<span class="ok">✓ ${r.nome}: ${r.voz.name} (${r.voz.lang})</span><br>`;
    } else {
      html += `<span class="aviso">✗ ${r.nome}: NÃO ENCONTRADA</span><br>`;
    }
  });

  // Lista todas as pt-BR para debug
  if (ptBR.length > 0) {
    html += `<div class="lista"><b>Vozes pt-BR disponíveis:</b><br>`;
    ptBR.forEach(v => { html += `· ${v.name}<br>`; });
    html += `</div>`;
  }

  diag.innerHTML = html;

  // Atualiza rótulos
  document.getElementById('voz-1').textContent =
    vozesResolvidas[0].voz ? `🎙 ${vozesResolvidas[0].voz.name}` : '🎙 Siri Voz 1 (não encontrada)';
  document.getElementById('voz-2').textContent =
    vozesResolvidas[1].voz ? `🎙 ${vozesResolvidas[1].voz.name}` : '🎙 Siri Voz 2 (não encontrada)';
}

/* ── Render das frases ── */
function renderBlocos() {
  ['b1', 'b2'].forEach(id => {
    const el = document.getElementById('texto-' + (id === 'b1' ? '1' : '2'));
    el.innerHTML = '';
    BLOCOS[id].frases.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'frase';
      div.id = id + '-f-' + i;
      div.textContent = f;
      el.appendChild(div);
    });
  });
}
renderBlocos();

/* ── Player ── */
let tocando = null;
let cancelar = false;

function tocar(id) {
  if (tocando === id) { parar(); return; }
  if (tocando) parar();

  const bloco = BLOCOS[id];
  const r = vozesResolvidas[bloco.vozIndex];
  const voz = r ? r.voz : null;

  cancelar = false;
  tocando = id;

  const btn = document.querySelector(`#bloco-${id === 'b1' ? '1' : '2'} .btn`);
  if (btn) { btn.classList.add('tocando'); btn.textContent = '⏹ Parar'; }

  // Marca a voz que está tocando
  const vozLabel = document.getElementById('voz-' + (id === 'b1' ? '1' : '2'));
  if (vozLabel && voz) vozLabel.textContent = `🎙 Tocando: ${voz.name}`;

  falarBloco(id, bloco, voz);
}

async function falarBloco(id, bloco, voz) {
  // ── WORKAROUND iOS ──
  // Fala um espaço vazio com a voz nova para "forçar" o Safari a registrá-la
  await falar(' ', 1.0, 1.0, 1.0, voz);
  await esperar(250);

  for (let i = 0; i < bloco.frases.length; i++) {
    if (cancelar) break;
    highlight(id, i);
    await falar(bloco.frases[i], 0.92, 0.96, 1.0, voz);
    await esperar(200);
  }

  if (!cancelar) {
    reset(id);
    setTimeout(() => {
      const btn = document.querySelector(`#bloco-${id === 'b1' ? '1' : '2'} .btn`);
      if (btn) { btn.classList.remove('tocando'); btn.textContent = `🔊 Ouvir Bloco ${id === 'b1' ? '1' : '2'}`; }
      tocando = null;
      mostrarDiagnostico();
    }, 600);
  }
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume;
    if (voz) u.voice = voz;
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

function highlight(id, idx) {
  document.querySelectorAll('#' + id + '-f-' + idx).forEach(() => {});
  const prefixo = id === 'b1' ? 'b1' : 'b2';
  for (let i = 0; i < 10; i++) {
    const el = document.getElementById(prefixo + '-f-' + i);
    if (!el) continue;
    el.classList.remove('falando');
    if (i < idx) el.classList.add('falada');
  }
  const atual = document.getElementById(prefixo + '-f-' + idx);
  if (atual) { atual.classList.add('falando'); atual.classList.remove('falada'); }
}

function reset(id) {
  const prefixo = id === 'b1' ? 'b1' : 'b2';
  for (let i = 0; i < 10; i++) {
    const el = document.getElementById(prefixo + '-f-' + i);
    if (el) el.classList.remove('falando', 'falada');
  }
}

function parar() {
  cancelar = true;
  window.speechSynthesis.cancel();
  if (tocando) reset(tocando);
  tocando = null;
  document.querySelectorAll('.btn').forEach(b => {
    b.classList.remove('tocando');
    b.textContent = b.textContent.includes('Bloco 1') ? '🔊 Ouvir Bloco 1' : '🔊 Ouvir Bloco 2';
  });
  mostrarDiagnostico();
}

/* ── Init ── */
carregarVozes(() => {
  resolverVozes();
});
</script>
</body>
</html>
