<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sala de Aula — Gestão de Pessoas | Concurso</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    :root {
      --bg: #0a0e1a;
      --bg-elev: #131a2b;
      --surface: rgba(148, 163, 184, .05);
      --surface-hover: rgba(148, 163, 184, .09);
      --border: rgba(148, 163, 184, .12);
      --border-strong: rgba(148, 163, 184, .22);
      --text: #cbd5e1;
      --text-dim: #94a3b8;
      --text-faint: #64748b;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, .15);
      --accent-glow: rgba(139, 92, 246, .35);
      --page-bg: rgba(148, 163, 184, .04);
      --page-border: rgba(148, 163, 184, .14);
      --page-text: #cbd5e1;
      --page-text-strong: #e2e8f0;
      --enfase: #fbbf24;
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, .35);
      --shadow-xl: 0 24px 64px rgba(0, 0, 0, .5);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-xl: 24px;
      --font-tamanho: 1.02rem;
      --transition: cubic-bezier(.2, .8, .3, 1);
    }

    body[data-tema="claro"] {
      --bg: #f1f5f9;
      --bg-elev: #fff;
      --surface: rgba(15, 23, 42, .03);
      --surface-hover: rgba(15, 23, 42, .06);
      --border: rgba(15, 23, 42, .08);
      --border-strong: rgba(15, 23, 42, .15);
      --text: #334155;
      --text-dim: #64748b;
      --text-faint: #94a3b8;
      --accent: #7c3aed;
      --accent-soft: rgba(124, 58, 237, .12);
      --page-bg: #fff;
      --page-border: rgba(15, 23, 42, .06);
      --page-text: #1e293b;
      --page-text-strong: #0f172a;
      --enfase: #b45309;
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, .08);
      --shadow-xl: 0 24px 64px rgba(15, 23, 42, .12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background .4s var(--transition), color .4s var(--transition);
      padding-bottom: calc(env(safe-area-inset-bottom) + 140px);
      -webkit-font-smoothing: antialiased;
    }

    .app-titulo,
    .folha-titulo,
    .drawer-titulo,
    .secao-titulo {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .22em;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(env(safe-area-inset-top) + 12px) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, var(--bg) 0%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .app-titulo {
      font-size: .68rem;
      color: var(--text-dim);
      opacity: .8
    }

    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s var(--transition), background .2s;
      touch-action: manipulation;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-icon:hover {
      background: var(--surface-hover)
    }

    .btn-icon:active {
      transform: scale(.92)
    }

    .btn-icon.sm {
      width: 36px;
      height: 36px
    }

    .conteudo {
      flex: 1;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      max-width: 720px;
      margin: 0 auto;
      width: 100%
    }

    .folha {
      background: var(--page-bg);
      border: 1px solid var(--page-border);
      border-radius: var(--r-lg);
      padding: 22px 22px 26px;
      position: relative;
      box-shadow: var(--shadow-lg);
      transition: background .4s var(--transition), border-color .4s var(--transition), opacity .3s;
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--font-tamanho);
      line-height: 1.75;
      color: var(--page-text);
      text-align: justify;
      hyphens: auto;
      -webkit-hyphens: auto;
      animation: fadeInUp .5s var(--transition);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .folha::before {
      content: '';
      position: absolute;
      top: 0;
      left: 28px;
      right: 28px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #2563eb);
      border-radius: 0 0 3px 3px;
      opacity: .9;
    }

    .folha-header {
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--page-border)
    }

    .folha-titulo {
      font-size: .62rem;
      letter-spacing: .24em;
      color: var(--text-dim);
      margin-bottom: 10px
    }

    .folha-bolinhas {
      display: flex;
      justify-content: center;
      gap: 6px
    }

    .bolinha {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-strong);
      transition: background .3s var(--transition), transform .3s var(--transition);
    }

    .bolinha.ativa {
      background: var(--accent);
      transform: scale(1.5);
      box-shadow: 0 0 8px var(--accent-glow)
    }

    .fala {
      display: inline;
      margin: 0;
      padding: 0;
      transition: background .3s, color .3s;
      cursor: pointer;
      border-radius: 3px;
    }

    .fala::after {
      content: ' '
    }

    .simbolo {
      font-weight: 700;
      margin-right: 3px;
      font-size: 1em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: .9;
    }

    .fala.professor .simbolo {
      color: #a78bfa;
      font-size: 1.1em;
      letter-spacing: .04em
    }

    .fala.aluno1 .simbolo {
      color: #60a5fa
    }

    .fala.aluno2 .simbolo {
      color: #fbbf24
    }

    .fala.aluno3 .simbolo {
      color: #34d399
    }

    .fala.aluno4 .simbolo {
      color: #f472b6
    }

    .fala.aluno5 .simbolo {
      color: #22d3ee
    }

    .fala.aluno6 .simbolo {
      color: #fb923c
    }

    .fala.aluno7 .simbolo {
      color: #c084fc
    }

    .fala.falando {
      background: var(--accent-soft);
      padding: 1px 4px;
      margin: 0 -4px;
      color: var(--page-text-strong);
      font-weight: 500
    }

    .fala.falando .simbolo {
      opacity: 1
    }

    .fala.falada {
      opacity: .35
    }

    .fala.futura {
      opacity: .92
    }

    .fala:hover {
      background: var(--accent-soft)
    }

    .enfase {
      color: var(--enfase);
      font-weight: 700;
      font-style: italic;
      letter-spacing: .01em
    }

    .quebra {
      display: block;
      height: 14px
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s var(--transition);
      z-index: 9998;
    }

    .overlay.ativo {
      opacity: 1;
      pointer-events: auto
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(340px, 88vw);
      background: var(--bg-elev);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-xl);
      z-index: 9999;
      transform: translateX(100%);
      transition: transform .4s var(--transition);
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .drawer.ativo {
      transform: translateX(0)
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px
    }

    .drawer-titulo {
      font-size: .72rem;
      color: var(--text-dim)
    }

    .secao {
      margin-bottom: 26px
    }

    .secao-titulo {
      font-size: .58rem;
      letter-spacing: .2em;
      color: var(--text-faint);
      margin-bottom: 12px;
      padding-left: 2px
    }

    .toggle-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: background .2s, border-color .2s;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .toggle-linha:hover {
      background: var(--surface-hover)
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: .86rem;
      font-weight: 500;
      color: var(--text);
    }

    .toggle-label .emoji {
      font-size: 1.1rem
    }

    .switch {
      position: relative;
      width: 44px;
      height: 26px;
      background: var(--border-strong);
      border-radius: 13px;
      transition: background .3s var(--transition);
      flex-shrink: 0;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform .3s var(--transition);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    }

    .switch.ativo {
      background: var(--accent)
    }

    .switch.ativo::after {
      transform: translateX(18px)
    }

    .fonte-controle {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }

    .btn-fonte {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: .82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .15s, border-color .2s;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .btn-fonte:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong)
    }

    .btn-fonte:active {
      transform: scale(.9)
    }

    .btn-fonte:disabled {
      opacity: .3;
      cursor: not-allowed
    }

    .fonte-barra {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      position: relative;
      overflow: hidden
    }

    .fonte-barra-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: linear-gradient(90deg, var(--accent), #2563eb);
      border-radius: 2px;
      transition: width .3s var(--transition);
    }

    .blocos-lista {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .bloco-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: left;
      color: var(--text);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .bloco-item:hover {
      background: var(--surface-hover)
    }

    .bloco-item:active {
      transform: scale(.98)
    }

    .bloco-item.ativo {
      background: var(--accent-soft);
      border-color: var(--accent)
    }

    .bloco-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background .2s, color .2s;
    }

    .bloco-item.ativo .bloco-num {
      background: var(--accent);
      color: #fff
    }

    .bloco-info {
      flex: 1;
      min-width: 0
    }

    .bloco-nome {
      font-size: .86rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px
    }

    .bloco-item.ativo .bloco-nome {
      color: var(--accent)
    }

    .bloco-desc {
      font-size: .68rem;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bloco-check {
      color: var(--accent);
      font-size: 1rem;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity .2s
    }

    .bloco-item.ativo .bloco-check {
      opacity: 1
    }

    #player {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 20px);
      left: 50%;
      transform: translateX(-50%);
      width: min(340px, calc(100vw - 32px));
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-xl);
      padding: 8px 8px 10px;
      z-index: 500;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      animation: fadeInUp .5s var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .player-handle {
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      margin-bottom: 2px
    }

    .player-handle::before {
      content: '';
      width: 32px;
      height: 3px;
      background: var(--border-strong);
      border-radius: 2px
    }

    .player-controles {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 0 4px
    }

    .btn-ctrl {
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background .2s, transform .15s, color .2s;
      touch-action: manipulation;
      font-family: inherit;
    }

    .btn-ctrl:hover:not(:disabled) {
      background: var(--surface-hover)
    }

    .btn-ctrl:active:not(:disabled) {
      transform: scale(.9)
    }

    .btn-ctrl:disabled {
      opacity: .25;
      cursor: not-allowed
    }

    .btn-sec {
      width: 40px;
      height: 40px
    }

    .btn-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #fff;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: transform .2s var(--transition), background .3s, box-shadow .3s;
    }

    .btn-play:hover {
      transform: scale(1.05)
    }

    .btn-play:active {
      transform: scale(.95)
    }

    .btn-play.tocando {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 6px 20px rgba(220, 38, 38, .4);
    }

    .player-rodape {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 0;
      gap: 8px
    }

    .btn-vel {
      padding: 5px 10px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: .7rem;
      font-weight: 700;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      touch-action: manipulation;
      letter-spacing: .02em;
    }

    .btn-vel:hover {
      background: var(--surface-hover)
    }

    .btn-vel.ativa {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .player-progresso {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: .66rem;
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: .05em;
    }

    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 120px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elev);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 99px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: .78rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s var(--transition), transform .3s var(--transition);
      z-index: 9997;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.ativo {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    #debugPanel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0, 0, 0, .95);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      color: #cbd5e1;
      font-family: ui-monospace, Menlo, monospace;
      font-size: .68rem;
      line-height: 1.5;
      z-index: 10000;
      max-height: 70vh;
      overflow-y: auto;
      display: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    #debugPanel.ativo {
      display: block
    }

    #debugPanel h3 {
      font-size: .72rem;
      color: #fbbf24;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #debugPanel h3 button {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: .65rem;
      font-family: inherit;
      cursor: pointer;
      font-weight: 700;
    }

    #debugPanel .linha {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid rgba(148, 163, 184, .1);
    }

    #debugPanel .linha.ativa {
      color: #fbbf24;
      font-weight: 700
    }

    #debugPanel .voz {
      color: #93c5fd
    }

    #debugPanel .info {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, .15);
      color: #94a3b8;
      font-size: .62rem;
    }

    #debugPanel .aviso {
      margin-top: 8px;
      padding: 8px;
      background: rgba(220, 38, 38, .15);
      border-radius: 6px;
      color: #fca5a5;
      font-size: .65rem;
    }

    #debugPanel .sucesso {
      margin-top: 8px;
      padding: 8px;
      background: rgba(34, 197, 94, .15);
      border-radius: 6px;
      color: #86efac;
      font-size: .65rem;
    }

    @media(max-width:380px) {
      .folha {
        padding: 18px 16px 22px;
        font-size: .95rem
      }

      .conteudo {
        padding: 0 14px
      }

      #player {
        width: calc(100vw - 24px)
      }

      .btn-sec {
        width: 36px;
        height: 36px
      }

      .btn-play {
        width: 50px;
        height: 50px
      }
    }

    @media(min-width:600px) {
      .conteudo {
        padding: 0 32px
      }

      .folha {
        padding: 28px 32px 32px
      }

      #player {
        width: 360px
      }
    }

    @media(min-width:900px) {
      .folha {
        padding: 32px 40px 36px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body data-tema="escuro">

  <header class="app-header">
    <div class="app-titulo">Sala de Aula · Gestão de Pessoas</div>
    <button class="btn-icon" id="btnMenu" aria-label="Abrir menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7" />

  <div id="player" role="region" aria-label="Controles de áudio">
    <div class="player-handle" id="handle"></div>
    <div class="player-controles">
      <button class="btn-ctrl btn-sec" id="btnCapAnterior" aria-label="Bloco anterior">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">

    <div class="player-rodape">
      <button class="btn-vel" id="btnVel" aria-label="Velocidade">1.0×</button>
      <span class="player-progresso" id="playerProgresso">Bloco 1 / 3</span>

  <script>
    'use strict';

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const synth = window.speechSynthesis || null;
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* ══════════ PREFS ══════════ */
    const FONTES = [0.80, 0.88, 0.95, 1.02, 1.10, 1.20, 1.30, 1.45];
    let prefTema = 'escuro', prefTamanho = 1.02, prefVelocidade = 1.0;
    try {
      const t = localStorage.getItem('pref-tema');
      if (t === 'claro' || t === 'escuro') prefTema = t;
      const s = parseFloat(localStorage.getItem('pref-tamanho'));
      if (isFinite(s) && s >= 0.5 && s <= 2.0) prefTamanho = s;
      const v = parseFloat(localStorage.getItem('pref-velocidade'));
      if (isFinite(v) && v >= 0.5 && v <= 3.0) prefVelocidade = v;
    } catch (e) { }
    const salvarPrefs = () => {
      try {
        localStorage.setItem('pref-tema', prefTema);
        localStorage.setItem('pref-tamanho', String(prefTamanho));
        localStorage.setItem('pref-velocidade', String(prefVelocidade));
      } catch (e) { }
    };

    /* ══════════ TEMA ══════════ */
    function aplicarTema() {
      document.body.setAttribute('data-tema', prefTema);
      $('temaEmoji').textContent = prefTema === 'claro' ? '☀️' : '🌙';
      $('temaLabel').textContent = prefTema === 'claro' ? 'Modo claro' : 'Modo escuro';
      $('temaSwitch').classList.toggle('ativo', prefTema === 'claro');
    }
    function alternarTema() {
      prefTema = prefTema === 'claro' ? 'escuro' : 'claro';
      salvarPrefs(); aplicarTema();
    }

    /* ══════════ FONTE ══════════ */
    function indiceFonte() {
      let melhor = 0, menor = Math.abs(FONTES[0] - prefTamanho);
      for (let i = 1; i < FONTES.length; i++) {
        const d = Math.abs(FONTES[i] - prefTamanho);
        if (d < menor) { menor = d; melhor = i; }
      }
      return melhor;
    }
    function aplicarFonte() {
      const tam = (isFinite(prefTamanho) && prefTamanho > 0.3 && prefTamanho < 2.5) ? prefTamanho : 1.02;
      document.documentElement.style.setProperty('--font-tamanho', tam + 'rem');
      const i = indiceFonte();
      $('fonteBarraFill').style.width = ((i + 1) / FONTES.length) * 100 + '%';
      $('btnFonteMenos').disabled = i <= 0;
      $('btnFonteMais').disabled = i >= FONTES.length - 1;
    }
    function ajustarFonte(dir) {
      const i = indiceFonte();
      const novo = Math.max(0, Math.min(FONTES.length - 1, i + dir));
      if (novo === i) return;
      prefTamanho = FONTES[novo];
      salvarPrefs(); aplicarFonte();
    }

    /* ══════════ TOAST ══════════ */
    let toastTimer = null;
    function mostrarToast(txt) {
      const el = $('toast');
      el.textContent = txt;
      el.classList.add('ativo');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('ativo'), 1800);
    }

    /* ══════════ MENU ══════════ */
    function abrirMenu() {
      $('drawer').classList.add('ativo');
      $('overlay').classList.add('ativo');
      $('btnMenu').setAttribute('aria-expanded', 'true');
      $('drawer').setAttribute('aria-hidden', 'false');
    }
    function fecharMenu() {
      $('drawer').classList.remove('ativo');
      $('overlay').classList.remove('ativo');
      $('btnMenu').setAttribute('aria-expanded', 'false');
      $('drawer').setAttribute('aria-hidden', 'true');
    }

    /* ══════════ VOZES ══════════ */
    let todasAsVozes = [], elenco = null, felipeEncontrado = false, iosDesbloqueado = false;

    function carregarVozes(cb) {
      if (!synth) return cb();
      let jaChamou = false;
      const fim = () => { if (!jaChamou) { jaChamou = true; cb(); } };

      let v = speechSynthesis.getVoices();
      if (v.length) { todasAsVozes = v; return fim(); }

      const handler = () => {
        v = speechSynthesis.getVoices();
        if (v.length) {
          todasAsVozes = v;
          if (speechSynthesis.removeEventListener) speechSynthesis.removeEventListener('voiceschanged', handler);
          fim();
        }
      };
      if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', handler);
      else speechSynthesis.onvoiceschanged = handler;

      let t = 0;
      const poll = () => {
        t++;
        v = speechSynthesis.getVoices();
        if (v.length) { todasAsVozes = v; return fim(); }
        if (t < 30) setTimeout(poll, 200);
        else fim();
      };
      setTimeout(poll, 200);
    }

    const vozesPtBR = () => todasAsVozes.filter(v => {
      const l = (v.lang || '').toLowerCase().replace('_', '-');
      return l === 'pt-br' || l.startsWith('pt-br');
    });

    /* ══════════ PERFIS ══════════ */
    const PAPEIS_ALUNO = ['aluno1', 'aluno2', 'aluno3', 'aluno4', 'aluno5', 'aluno6', 'aluno7'];
    const SIMBOLOS = {
      professor: '§', aluno1: '▸', aluno2: '◂', aluno3: '›',
      aluno4: '‹', aluno5: '▴', aluno6: '●', aluno7: '▾'
    };

    const VOZ_BASE = {
      professor: [0.90, 0.75, 180, 300],
      aluno1: [1.22, 1.38, 55, 110],
      aluno2: [0.88, 0.96, 155, 230],
      aluno3: [1.15, 1.28, 75, 140],
      aluno4: [0.94, 1.02, 135, 210],
      aluno5: [1.28, 1.45, 45, 100],
      aluno6: [1.05, 1.12, 100, 180],
      aluno7: [0.82, 0.92, 175, 260]
    };

    const PERFIS = {};
    for (const [papel, [rate, pitch, mc, ml]] of Object.entries(VOZ_BASE)) {
      PERFIS[papel] = {
        rate, pitch, volume: papel === 'professor' ? 1.0 : 0.93,
        microCurta: mc, microLonga: ml,
        rateEnfase: rate * 0.93, pitchEnfase: pitch * 0.95,
        pausas: {
          abertura: Math.round(mc * 5.0),
          definicao: Math.round(mc * 2.5),
          pergunta: Math.round(mc * 1.8),
          confirmacao: Math.round(mc * 2.2),
          guarde: Math.round(mc * 5.8),
          conclusao: Math.round(mc * 4.5),
          atencao_banca: Math.round(mc * 4.0),
          pausa: Math.round(ml * 2.0)
        }
      };
    }
    Object.assign(PERFIS.professor.pausas, {
      abertura: 900, definicao: 460, pergunta: 300, confirmacao: 400,
      guarde: 1050, conclusao: 820, atencao_banca: 700, pausa: 640
    });

    /* ══════════ CONTEÚDO ══════════ */
    const CAPITULOS = [
      {
        titulo: "Bloco 1",
        subtitulo: "Fundamentos da gestão de pessoas",
        aula: [
          { papel: "professor", tipo: "abertura", texto: "Bom dia, turma. Hoje vamos compreender a gestão de pessoas de forma mais completa. Muita gente ainda enxerga essa área só como o setor que contrata e resolve documentos. Vamos entender por que ela vai muito além disso e como influencia a experiência, o desenvolvimento e os resultados das pessoas dentro da organização." },
          { papel: "aluno1", tipo: "pergunta", texto: "Professor, a gente usa RH e gestão de pessoas como se fosse a mesma coisa. Tem diferença mesmo?" },
          { papel: "professor", tipo: "definicao", texto: "Os dois nomes costumam se referir à mesma área, mas a expressão *gestão de pessoas* carrega uma mudança de olhar. Quando falamos apenas em recursos humanos, ainda parece que a pessoa é um recurso que a empresa utiliza. Já a gestão de pessoas reforça que estamos falando de profissionais que pensam, aprendem, colaboram e influenciam resultados." },
          { papel: "aluno2", tipo: "pergunta", texto: "E como essa mudança aconteceu historicamente?" },
          { papel: "professor", tipo: "definicao", texto: "Podemos pensar em três grandes momentos. Na Era Industrial, o foco era o departamento pessoal, que cuidava de admissão, folha e cumprimento da legislação. Na Era Neoclássica, surge a administração de recursos humanos, com preocupação em selecionar, treinar e integrar. E na Era da Informação, a área passa a ser vista como gestão de pessoas, com foco em competências, desenvolvimento e alinhamento à estratégia." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* é comum a prova afirmar que a expressão gestão de pessoas surgiu como simples sinônimo de administração de recursos humanos. Não é. Ela representa uma mudança de enfoque, do recurso para a pessoa como agente ativo." },
          { papel: "aluno3", tipo: "pergunta", texto: "Então qual é o conceito formal de gestão de pessoas?" },
          { papel: "professor", tipo: "definicao", texto: "Gestão de pessoas é o conjunto de políticas e práticas que orientam a relação entre a organização e as pessoas que nela trabalham, com o objetivo de alinhar expectativas, desenvolver capacidades e alcançar resultados de forma ética e sustentável." },
          { papel: "aluno4", tipo: "pergunta", texto: "E quais são os objetivos da gestão de pessoas?" },
          { papel: "professor", tipo: "definicao", texto: "Ajudar a organização a alcançar seus objetivos, proporcionar competitividade, desenvolver pessoas, aumentar satisfação no trabalho, manter um ambiente ético e garantir que as políticas sejam coerentes com os valores da organização." },
          { papel: "aluno5", tipo: "pergunta", texto: "Quais são os principais processos dessa área?" },
          { papel: "professor", tipo: "definicao", texto: "Podemos pensar em seis processos clássicos. *Agregar* pessoas: recrutamento e seleção. *Aplicar* pessoas: análise e descrição de cargos e alocação. *Recompensar*: remuneração e benefícios. *Desenvolver*: treinamento e avaliação. *Manter*: qualidade de vida, higiene e segurança. E *monitorar*: sistemas de informação e indicadores." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* decore a sequência: agregar, aplicar, recompensar, desenvolver, manter e monitorar. É comum a banca trocar a ordem ou trocar um processo por outro que não pertence à lista. Por exemplo, colocar selecionar como processo separado quando ele faz parte de agregar." },
          { papel: "aluno6", tipo: "pergunta", texto: "E como entra o planejamento de pessoas nesse ciclo?" },
          { papel: "professor", tipo: "definicao", texto: "O planejamento de pessoas é o que antecede o agregar. Ele estima quantas pessoas e quais competências a organização vai precisar, em determinado período, para atingir seus objetivos. Pode ser quantitativo, quando olha número de vagas, ou qualitativo, quando olha competências e perfis." },
          { papel: "aluno1", tipo: "pergunta", texto: "E o que é análise e descrição de cargos?" },
          { papel: "professor", tipo: "definicao", texto: "Análise de cargo é o estudo do que o cargo exige, quais tarefas, responsabilidades e condições estão envolvidas. Descrição de cargo é o registro escrito desse estudo: título, atividades, requisitos, subordinação. É a base para recrutar, selecionar, treinar, avaliar e remunerar com justiça." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* análise de cargo é o estudo; descrição de cargo é o registro. A banca costuma tratar os dois como sinônimos." },
          { papel: "aluno5", tipo: "pergunta", texto: "Qual é a diferença entre treinamento e desenvolvimento?" },
          { papel: "professor", tipo: "definicao", texto: "Treinamento normalmente responde a uma necessidade mais imediata. Por exemplo: ensinar alguém a usar um sistema novo. Já o desenvolvimento é mais amplo. Ele prepara a pessoa para desafios futuros, novas responsabilidades e crescimento profissional." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* treinamento tem foco no presente e no cargo atual; desenvolvimento tem foco no futuro e na carreira. A banca costuma inverter esses focos." },
          { papel: "aluno2", tipo: "pergunta", texto: "E a avaliação de desempenho? Como ela funciona?" },
          { papel: "professor", tipo: "definicao", texto: "A avaliação de desempenho compara o que foi esperado com o que foi entregue. Ela serve para orientar melhorias, reconhecer contribuições e planejar desenvolvimento. Não deve ser apenas uma nota nem um instrumento de punição." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* avaliação de desempenho não é sinônimo de avaliação de potencial. Desempenho olha o passado e o presente; potencial olha o futuro." },
          { papel: "aluno3", tipo: "pergunta", texto: "E o feedback? Ele entra onde?" },
          { papel: "professor", tipo: "definicao", texto: "O feedback é a devolutiva contínua sobre o trabalho. Pode ser formal ou informal. Ele só faz sentido quando é específico, respeitoso e orientado para a melhoria." },
          { papel: "aluno4", tipo: "pergunta", texto: "E a avaliação 360 graus?" },
          { papel: "professor", tipo: "definicao", texto: "A avaliação 360 graus reúne percepções de várias fontes: o próprio profissional, colegas, liderança e, às vezes, clientes. Ela amplia o olhar, mas não substitui a avaliação formal. O cuidado é usá-la para desenvolvimento, não para punição." },
          { papel: "aluno1", tipo: "pergunta", texto: "E remuneração e benefícios? Como a banca costuma cobrar?" },
          { papel: "professor", tipo: "definicao", texto: "Remuneração é o que a pessoa recebe pelo trabalho: salário base, variáveis, comissões, prêmios. Benefícios são vantagens adicionais, como vale-transporte, plano de saúde, alimentação. A remuneração pode ser fixa ou variável." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* remuneração total é o somatório de salário base mais variáveis mais benefícios. A banca costuma tratar salário base como sinônimo de remuneração total." },
          { papel: "aluno7", tipo: "pergunta", texto: "E qualidade de vida no trabalho?" },
          { papel: "professor", tipo: "definicao", texto: "Qualidade de vida no trabalho é o conjunto de condições que tornam o ambiente saudável, seguro e respeitoso. Envolve desde ergonomia e jornada até relações interpessoais e equilíbrio entre vida pessoal e profissional. Não é só benefício, é condição de trabalho." },
          { papel: "aluno6", tipo: "pergunta", texto: "E turnover e absenteísmo? Como a prova cobra isso?" },
          { papel: "professor", tipo: "definicao", texto: "Turnover é a rotatividade: entrada e saída de pessoas. Absenteísmo é a ausência ao trabalho, justificada ou não. Os dois são indicadores. Turnover alto pode indicar problemas de gestão, clima, salário ou mercado. Absenteísmo alto pode indicar desmotivação, doença ou falta de condições." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* turnover não é sinônimo de absenteísmo. Turnover é saída; absenteísmo é ausência. A banca costuma trocar os dois." },
          { papel: "aluno3", tipo: "pergunta", texto: "E os indicadores de RH?" },
          { papel: "professor", tipo: "definicao", texto: "Indicadores são medidas que ajudam a acompanhar a gestão. Os mais cobrados são: rotatividade, absenteísmo, tempo de preenchimento de vaga, custo por contratação, participação em treinamentos, desempenho das equipes e percepção das pessoas sobre o ambiente." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* indicador isolado não explica tudo. A banca costuma afirmar que rotatividade alta sempre significa problema. Não é verdade: pode ser uma mudança planejada." },
          { papel: "aluno4", tipo: "pergunta", texto: "E ética na gestão de pessoas?" },
          { papel: "professor", tipo: "definicao", texto: "Ética na gestão de pessoas é agir com respeito, transparência, justiça e responsabilidade. Envolve evitar discriminação, proteger dados, dar retorno adequado, cumprir acordos e tratar as pessoas com dignidade em todos os momentos, inclusive no desligamento." },
          { papel: "professor", tipo: "definicao", texto: "Agora, como isso pode aparecer na prova. Primeira situação: a banca afirma que a gestão de pessoas se limita a recrutar, selecionar e demitir. Está correta ou incorreta?" },
          { papel: "professor", tipo: "definicao", texto: "Segunda: a banca diz que treinamento e desenvolvimento são sinônimos. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Terceira: a banca afirma que turnover e absenteísmo medem a mesma coisa. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Quarta: a banca diz que a avaliação 360 graus substitui a avaliação formal. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Quinta: a banca afirma que descrição de cargos é a mesma coisa que análise de cargos. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Pegadinhas da banca neste bloco: primeira, confundir RH com gestão de pessoas como se fossem sinônimos puros. Segunda, trocar a ordem dos seis processos. Terceira, inverter treinamento e desenvolvimento. Quarta, tratar turnover como absenteísmo. Quinta, dizer que a avaliação 360 substitui a formal. Sexta, afirmar que indicador isolado explica tudo." },
          { papel: "aluno4", tipo: "guarde", texto: "Então gestão de pessoas não é apenas colocar a pessoa certa na vaga. É acompanhar toda a relação dela com o trabalho." },
          { papel: "professor", tipo: "guarde", texto: "Guarde esta ideia: gestão de pessoas envolve planejar, atrair, integrar, desenvolver, reconhecer, proteger e, quando necessário, conduzir o desligamento das pessoas com responsabilidade." },
          { papel: "professor", tipo: "conclusao", texto: "Por isso, a área não deve ser vista apenas como operacional nem apenas como estratégica. Ela precisa fazer as duas coisas: garantir que os processos funcionem e contribuir para que a organização alcance seus objetivos sem esquecer que seus resultados dependem de pessoas. No próximo bloco, vamos dar um passo adiante e entender como essa visão se conecta ao planejamento do negócio." }
        ]
      },
      {
        titulo: "Bloco 2",
        subtitulo: "Gestão estratégica de pessoas",
        aula: [
          { papel: "professor", tipo: "abertura", texto: "Agora vamos aprofundar a gestão estratégica de pessoas. No bloco anterior, vimos os processos que acompanham a trajetória do profissional. A pergunta central agora é: como transformar os objetivos da organização em decisões concretas sobre pessoas, competências, liderança e trabalho?" },
          { papel: "aluno2", tipo: "pergunta", texto: "Professor, qual é a diferença entre RH tradicional e gestão estratégica de pessoas?" },
          { papel: "professor", tipo: "definicao", texto: "No RH tradicional, a área executa tarefas depois que a decisão já foi tomada: contrata, demite, cumpre a legislação. Na gestão estratégica, ela participa da decisão: antecipa necessidades, avalia competências, propõe alternativas e mede resultados. A diferença não está no nome, está no momento em que a área é chamada." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* gestão estratégica de pessoas não substitui o RH tradicional. Ela incorpora as funções operacionais e acrescenta a dimensão estratégica. A banca costuma afirmar que a área estratégica abandona as funções operacionais." },
          { papel: "aluno5", tipo: "pergunta", texto: "Então a estratégia de pessoas só começa depois que a estratégia da empresa já está pronta?" },
          { papel: "professor", tipo: "definicao", texto: "Não necessariamente. A área de pessoas deve participar da construção e da execução da estratégia. Uma decisão de expansão, por exemplo, só será viável se houver profissionais em quantidade suficiente, com as competências certas e preparados no prazo necessário." },
          { papel: "aluno1", tipo: "pergunta", texto: "Como seria esse planejamento no caso de uma nova filial?" },
          { papel: "professor", tipo: "definicao", texto: "Primeiro, a empresa analisa o projeto e identifica as funções necessárias. Depois estima quantas pessoas serão contratadas, quais profissionais podem ser transferidos, que conhecimentos já existem e quais lacunas precisam ser preenchidas." },
          { papel: "professor", tipo: "definicao", texto: "Em seguida define prazos, orçamento, treinamento e responsáveis. Também precisa pensar na integração da nova equipe, na liderança da filial e na forma de acompanhar os resultados depois da abertura." },
          { papel: "aluno3", tipo: "pergunta", texto: "E o que é planejamento da força de trabalho?" },
          { papel: "professor", tipo: "definicao", texto: "É o processo de estimar quantas pessoas e quais competências a organização vai precisar em determinado período. Ele responde a três perguntas: quantas pessoas, com quais competências e em quanto tempo. Pode ser de curto, médio ou longo prazo." },
          { papel: "aluno6", tipo: "pergunta", texto: "O que são competências nesse contexto?" },
          { papel: "professor", tipo: "definicao", texto: "Competências são a combinação de conhecimentos, habilidades e atitudes que permite realizar um trabalho com qualidade. Essa combinação é conhecida pela sigla CHA: C de conhecimento, H de habilidade e A de atitude." },
          { papel: "aluno3", tipo: "pergunta", texto: "E basta contratar pessoas que já tenham todas essas competências?" },
          { papel: "professor", tipo: "definicao", texto: "Nem sempre. A organização pode contratar algumas competências e desenvolver outras. Essa decisão depende do prazo, do orçamento, da disponibilidade no mercado e da capacidade de aprendizagem das pessoas." },
          { papel: "aluno4", tipo: "pergunta", texto: "E o que é gap de competências?" },
          { papel: "professor", tipo: "definicao", texto: "Gap é a lacuna entre o que a organização precisa e o que ela tem hoje. Identificar o gap é o primeiro passo para decidir entre contratar, treinar, remanejar ou terceirizar. Sem esse diagnóstico, o planejamento vira chute." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* CHA é a sigla de Conhecimentos, Habilidades e Atitudes. A banca costuma trocar atitude por aptidão ou ação. Fique atento." },
          { papel: "aluno4", tipo: "pergunta", texto: "Qual é a relação entre estratégia de pessoas e cultura organizacional?" },
          { papel: "professor", tipo: "definicao", texto: "A cultura é formada pelos valores e comportamentos que se repetem e são reconhecidos dentro da organização. Se uma empresa diz que valoriza colaboração, mas recompensa apenas resultados individuais, existe uma contradição entre o discurso e a prática." },
          { papel: "aluno7", tipo: "pergunta", texto: "E qual é a diferença entre cultura e clima organizacional?" },
          { papel: "professor", tipo: "definicao", texto: "Cultura é o conjunto de valores, crenças e comportamentos que a organização carrega ao longo do tempo. É mais profunda e mais estável. Clima é a percepção momentânea que as pessoas têm do ambiente de trabalho. É mais superficial e muda com mais facilidade." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* cultura é duradoura, clima é passageiro. A banca costuma inverter: dizer que clima é duradouro e cultura é momentânea. Está errado." },
          { papel: "aluno1", tipo: "pergunta", texto: "Como medir se a estratégia de pessoas está dando resultado?" },
          { papel: "professor", tipo: "definicao", texto: "A empresa pode acompanhar indicadores. O tempo para preencher uma vaga mostra a eficiência do recrutamento. A rotatividade indica quantas pessoas deixam a organização. O absenteísmo mostra faltas e afastamentos. Também podemos acompanhar desempenho, conclusão de treinamentos e percepção das equipes." },
          { papel: "aluno2", tipo: "pergunta", texto: "Um indicador alto ou baixo já mostra que existe um problema?" },
          { papel: "professor", tipo: "definicao", texto: "Não automaticamente. O indicador é um sinal que precisa ser interpretado. Uma rotatividade alta pode ocorrer por salários pouco competitivos, liderança inadequada, mercado aquecido ou uma mudança planejada." },
          { papel: "aluno5", tipo: "pergunta", texto: "Ouvi falar em People Analytics. É isso que estamos discutindo?" },
          { papel: "professor", tipo: "definicao", texto: "People Analytics é o uso de dados para apoiar decisões sobre pessoas. Ele não substitui a escuta e o julgamento humano, mas ajuda a identificar padrões. Por exemplo: cruzar desempenho, tempo de casa e participação em treinamentos pode revelar quem está pronto para assumir uma nova função." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* People Analytics é ferramenta de apoio à decisão, não substituto do julgamento humano. A banca costuma afirmar que ele elimina a subjetividade. Não elimina." },
          { papel: "aluno6", tipo: "pergunta", texto: "E como a área de pessoas se conecta a metodologias como OKR?" },
          { papel: "professor", tipo: "definicao", texto: "Os OKRs traduzem objetivos em resultados-chave mensuráveis. A área de pessoas pode ter seus próprios OKRs, alinhados aos da organização. Por exemplo: reduzir em vinte por cento o tempo de preenchimento de vagas sem perder qualidade. Mas atenção: OKR é ferramenta de gestão, não substitui os conceitos clássicos de planejamento e avaliação." },
          { papel: "aluno5", tipo: "pergunta", texto: "Qual seria a diferença entre o modelo tradicional e o estratégico em uma situação de crise?" },
          { papel: "professor", tipo: "definicao", texto: "No modelo tradicional, o setor pode apenas executar a decisão depois que ela foi tomada. No modelo estratégico, participa da análise: avalia competências críticas, alternativas de treinamento, reorganização do trabalho, comunicação com a equipe e impactos sobre a saúde e o desempenho." },
          { papel: "professor", tipo: "definicao", texto: "Imagine uma empresa que precisa reduzir custos. No modelo tradicional, o RH só cumpre a ordem de demitir. No modelo estratégico, ajuda a avaliar se é possível realocar pessoas, treinar para novas funções ou redistribuir o trabalho antes de tomar a decisão final." },
          { papel: "aluno3", tipo: "pergunta", texto: "Então qual é o papel estratégico da área de gestão de pessoas?" },
          { papel: "professor", tipo: "definicao", texto: "É antecipar necessidades, propor alternativas, medir resultados e ajustar o plano. A área deixa de ser apenas executora e passa a ser parceira da estratégia, sem abandonar as funções operacionais que garantem o funcionamento da organização." },
          { papel: "professor", tipo: "definicao", texto: "Como isso pode aparecer na prova. Primeira: a banca afirma que a gestão estratégica de pessoas elimina as funções operacionais. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Segunda: a banca diz que cultura e clima organizacional são sinônimos. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Terceira: a banca afirma que CHA significa Conhecimentos, Habilidades e Atitudes. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Quarta: a banca diz que gap de competências é a diferença entre o que a empresa precisa e o que ela tem. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Quinta: a banca afirma que People Analytics elimina a subjetividade nas decisões. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Pegadinhas da banca neste bloco: primeira, dizer que gestão estratégica abandona o operacional. Segunda, inverter cultura e clima. Terceira, trocar atitude por aptidão no CHA. Quarta, afirmar que People Analytics elimina a subjetividade. Quinta, dizer que OKR substitui o planejamento clássico. Sexta, afirmar que indicador isolado explica tudo." },
          { papel: "aluno6", tipo: "guarde", texto: "Então estratégia não é fazer um documento bonito. É tomar decisões de pessoas conectadas a um objetivo e acompanhar se funcionaram." },
          { papel: "professor", tipo: "guarde", texto: "Perfeito. O ciclo estratégico é diagnosticar, planejar, executar, medir e ajustar. Se a realidade mudar, o plano também precisa ser revisto." },
          { papel: "professor", tipo: "conclusao", texto: "Gestão estratégica de pessoas é, portanto, antecipar necessidades e transformar objetivos organizacionais em ações responsáveis sobre trabalho, competências e desenvolvimento. Ela aproxima a gestão de pessoas das decisões importantes sem reduzir o ser humano a um número ou indicador. No próximo bloco, vamos aplicar esse planejamento a uma etapa concreta: o recrutamento e a seleção." }
        ]
      },
      {
        titulo: "Bloco 3",
        subtitulo: "Recrutamento e seleção",
        aula: [
          { papel: "professor", tipo: "abertura", texto: "Neste bloco, vamos aplicar o que estudamos. No primeiro bloco, vimos que o recrutamento faz parte do ciclo de gestão de pessoas. No segundo, entendemos que ele precisa responder à estratégia da organização. Agora vamos aprofundar o processo inteiro, desde a identificação da necessidade até a decisão final da seleção." },
          { papel: "aluno7", tipo: "pergunta", texto: "Professor, o recrutamento começa quando a empresa publica a vaga?" },
          { papel: "professor", tipo: "definicao", texto: "Não. Antes de publicar, a empresa precisa confirmar que existe uma necessidade real, entender por que a vaga surgiu e analisar se o trabalho pode ser reorganizado ou desenvolvido internamente. Publicar uma vaga sem esse cuidado é um dos erros mais comuns." },
          { papel: "aluno1", tipo: "pergunta", texto: "E depois dessa confirmação, qual é o próximo passo?" },
          { papel: "professor", tipo: "definicao", texto: "É analisar o cargo. A empresa deve descrever as responsabilidades, as atividades principais, a quem a pessoa responderá, quais resultados serão esperados e quais condições de trabalho existirão. Sem essa clareza, a vaga fica confusa e atrai candidatos inadequados." },
          { papel: "aluno3", tipo: "pergunta", texto: "Qual é a diferença entre requisito e competência?" },
          { papel: "professor", tipo: "definicao", texto: "Requisito é uma condição necessária ou desejável para a vaga, como determinada formação ou experiência. Competência é a capacidade de aplicar conhecimentos, habilidades e atitudes no trabalho. Os dois devem estar relacionados às atividades reais do cargo." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* requisito é o que se exige; competência é o que se aplica. A banca costuma tratar os dois como sinônimos." },
          { papel: "aluno5", tipo: "pergunta", texto: "E como a empresa decide se fará recrutamento interno ou externo?" },
          { papel: "professor", tipo: "definicao", texto: "No recrutamento interno, a organização procura entre seus próprios profissionais. Pode promover, transferir ou remanejar alguém. Essa opção aproveita conhecimento da cultura, pode motivar a equipe e costuma ser mais rápida, mas reduz a entrada de perspectivas novas." },
          { papel: "aluno2", tipo: "pergunta", texto: "E quando o externo é mais indicado?" },
          { papel: "professor", tipo: "definicao", texto: "Quando a organização precisa de competências que não possui, quer ampliar a diversidade de experiências ou não encontrou um profissional adequado internamente. O processo externo pode alcançar mais candidatos, mas costuma exigir mais tempo de divulgação, análise e integração." },
          { papel: "aluno4", tipo: "confirmacao", texto: "Então o recrutamento misto permite olhar para dentro e para fora ao mesmo tempo." },
          { papel: "professor", tipo: "confirmacao", texto: "Sim. Ele combina as duas fontes. A escolha depende da urgência, da estratégia, do perfil da vaga, das possibilidades de desenvolvimento e das condições do mercado de trabalho." },
          { papel: "aluno6", tipo: "pergunta", texto: "Professor, dá para resumir as vantagens e desvantagens de cada modalidade?" },
          { papel: "professor", tipo: "definicao", texto: "Vamos lá. *Interno:* vantagens são o conhecimento da cultura, a motivação da equipe, o custo menor e a rapidez. Desvantagens são a redução de novas ideias e o risco de conflito quando a promoção não acontece. *Externo:* vantagens são a renovação, a entrada de novas experiências e o alcance maior de candidatos. Desvantagens são o custo mais alto, o tempo maior e a necessidade de integração. *Misto:* combina as duas fontes e costuma ser o mais equilibrado." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* não existe modalidade sempre melhor. A escolha depende do contexto. A banca costuma afirmar que o recrutamento interno é sempre preferível. Não é." },
          { papel: "aluno6", tipo: "pergunta", texto: "E quais são as fontes e técnicas de recrutamento?" },
          { papel: "professor", tipo: "definicao", texto: "As fontes podem ser internas, como banco de talentos e indicação de colaboradores, ou externas, como site da empresa, redes profissionais, sites de emprego, instituições de ensino, agências e programas de indicação. As técnicas incluem anúncio, cartaz, palestra em escolas, contato com associações e uso de redes sociais profissionais." },
          { papel: "aluno7", tipo: "pergunta", texto: "Uma boa divulgação é suficiente para garantir bons candidatos?" },
          { papel: "professor", tipo: "definicao", texto: "Não. A descrição da vaga precisa ser clara e realista. Deve informar atividades, requisitos, local ou modalidade de trabalho, faixa de horário quando necessário e etapas do processo. É importante diferenciar a descrição do cargo do perfil profissional: a descrição mostra o que será feito; o perfil mostra quais conhecimentos, habilidades e atitudes são necessários para realizar o trabalho." },
          { papel: "professor", tipo: "definicao", texto: "Compare duas vagas. Uma diz apenas: precisa de pessoa jovem, dinâmica e com boa aparência. Outra descreve: atender clientes com clareza, registrar informações com organização e cumprir o horário comercial. A segunda atrai candidatos mais adequados e evita discriminação." },
          { papel: "aluno1", tipo: "pergunta", texto: "E o que é employer branding? Tem a ver com isso?" },
          { papel: "professor", tipo: "definicao", texto: "Tem. Employer branding é a forma como a organização é percebida por quem trabalha nela e por quem poderia trabalhar. Uma boa reputação ajuda a atrair candidatos alinhados à cultura. Uma reputação ruim espanta gente qualificada, mesmo quando o salário é competitivo." },
          { papel: "aluno1", tipo: "pergunta", texto: "O que há de errado em pedir uma pessoa jovem, com boa aparência e dinâmica?" },
          { papel: "professor", tipo: "definicao", texto: "Esses critérios podem ser subjetivos, discriminatórios ou não ter relação com o trabalho. É melhor descrever a competência necessária. Por exemplo: capacidade de atender o público com clareza, organização para registrar informações e disponibilidade para o horário informado." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* critérios subjetivos e discriminatórios são vedados. A banca costuma cobrar isso na forma de vaga que pede aparência, idade ou estado civil." },
          { papel: "aluno3", tipo: "pergunta", texto: "Como a empresa deve tratar os dados e as informações dos candidatos?" },
          { papel: "professor", tipo: "definicao", texto: "Deve coletar apenas informações necessárias, explicar a finalidade do uso, restringir o acesso e proteger os dados. Também precisa comunicar o processo com respeito, evitar promessas que não poderá cumprir e dar retorno sempre que possível. Isso dialoga com a Lei Geral de Proteção de Dados, a LGPD." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* a LGPD se aplica ao recrutamento. A banca costuma cobrar que dados sensíveis não podem ser exigidos sem necessidade. Idade, estado civil, religião e aparência não são requisitos válidos por si." },
          { papel: "aluno5", tipo: "pergunta", texto: "Depois que os currículos chegam, a empresa já está fazendo seleção?" },
          { papel: "professor", tipo: "definicao", texto: "A triagem inicial começa a aproximar o recrutamento da seleção, mas os conceitos continuam diferentes. Recrutamento é o esforço para atrair e formar um conjunto de candidatos. Seleção é a comparação dos candidatos com critérios definidos para escolher quem melhor atende à vaga." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* recrutamento atrai; seleção escolhe. A banca costuma inverter as definições." },
          { papel: "aluno2", tipo: "confirmacao", texto: "Então recrutar é trazer pessoas qualificadas para o processo, e selecionar é avaliar e decidir." },
          { papel: "professor", tipo: "confirmacao", texto: "Exatamente. Uma seleção bem feita depende de um recrutamento bem planejado, porque não é possível escolher adequadamente se a empresa não atrai candidatos suficientes ou se divulga a vaga para o público errado." },
          { papel: "aluno6", tipo: "pergunta", texto: "E quais são as principais técnicas de seleção?" },
          { papel: "professor", tipo: "definicao", texto: "As mais cobradas são: entrevista, prova escrita ou prática, testes psicológicos, testes de personalidade, dinâmicas de grupo, simulações e assessment center. Cada uma tem um propósito. A entrevista é a técnica mais usada, mas não deve ser a única." },
          { papel: "aluno4", tipo: "pergunta", texto: "E como funciona uma entrevista estruturada?" },
          { papel: "professor", tipo: "definicao", texto: "A entrevista estruturada segue um roteiro com perguntas definidas antes, e critérios de avaliação claros. Ela reduz a subjetividade e permite comparar candidatos com mais justiça. É diferente da entrevista livre, em que cada conversa segue um caminho." },
          { papel: "aluno4", tipo: "pergunta", texto: "E a entrevista por competências?" },
          { papel: "professor", tipo: "definicao", texto: "Ela parte de situações concretas. Em vez de perguntar apenas o que a pessoa faria, pede exemplos do que já fez. Por exemplo: conte uma situação em que você precisou resolver um conflito com um cliente. Assim, a empresa avalia comportamento real, não só discurso." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* entrevista estruturada é sobre roteiro; entrevista por competências é sobre comportamento passado. As duas podem ser combinadas, mas não são sinônimos." },
          { papel: "aluno4", tipo: "pergunta", texto: "Como saber se o recrutamento e a seleção foram eficientes?" },
          { papel: "professor", tipo: "definicao", texto: "A empresa pode analisar quantos candidatos aderentes foram atraídos, quanto tempo levou para preencher a vaga, qual foi o custo, quais canais trouxeram melhores resultados e se as pessoas contratadas permaneceram e tiveram bom desempenho." },
          { papel: "aluno6", tipo: "pergunta", texto: "Essas métricas têm nomes específicos?" },
          { papel: "professor", tipo: "definicao", texto: "Sim. O tempo médio entre abrir e fechar a vaga costuma ser chamado de time-to-fill ou time-to-hire. Cuidado: os dois termos podem ter definições diferentes conforme a organização. Em algumas, time-to-fill conta da abertura até a contratação; em outras, time-to-hire conta da abertura até a aceitação da proposta. O importante é a empresa definir claramente o que está medindo." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* a banca pode tratar time-to-fill e time-to-hire como sinônimos. Em sentido estrito, podem ter definições diferentes. O mais seguro é entender o conceito geral de tempo de preenchimento de vaga." },
          { papel: "aluno6", tipo: "guarde", texto: "Então o recrutamento não termina simplesmente quando alguém é contratado. A empresa também precisa avaliar a qualidade do processo." },
          { papel: "professor", tipo: "guarde", texto: "Isso mesmo. Guarde esta sequência: identificar a necessidade, analisar o cargo, definir o perfil, escolher os canais, divulgar, atrair candidatos e encaminhá-los para uma seleção justa e coerente." },
          { papel: "professor", tipo: "definicao", texto: "Como isso pode aparecer na prova. Primeira: a banca afirma que recrutamento e seleção são sinônimos. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Segunda: a banca diz que o recrutamento interno é sempre preferível ao externo. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Terceira: a banca afirma que a entrevista estruturada segue um roteiro definido. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Quarta: a banca diz que a entrevista por competências pede exemplos de situações passadas. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Quinta: a banca afirma que a LGPD não se aplica ao recrutamento. Está correta?" },
          { papel: "professor", tipo: "definicao", texto: "Pegadinhas da banca neste bloco: primeira, tratar recrutamento e seleção como sinônimos. Segunda, dizer que interno é sempre melhor. Terceira, confundir entrevista estruturada com entrevista por competências. Quarta, achar que a LGPD não se aplica. Quinta, tratar time-to-fill e time-to-hire como sinônimos absolutos. Sexta, aceitar critérios subjetivos como válidos. Sétima, confundir requisito com competência." },
          { papel: "professor", tipo: "conclusao", texto: "Recrutar não é procurar qualquer pessoa para preencher rapidamente uma vaga. É construir uma ponte entre uma necessidade real da organização e profissionais que possam contribuir, aprendendo e trabalhando em condições claras, éticas e compatíveis com a função." },
          { papel: "professor", tipo: "conclusao", texto: "Percebam a integração: a gestão de pessoas define o cuidado com a trajetória profissional; a estratégia mostra que as decisões precisam atender aos objetivos do negócio; e o recrutamento e a seleção transformam essa necessidade em uma ação concreta." },
          { papel: "professor", tipo: "guarde", texto: "Antes de encerrar, vamos fazer uma revisão geral dos três blocos. No Bloco 1, mantivemos toda a base original: conceito de gestão de pessoas, seis processos, treinamento e desenvolvimento, avaliação, remuneração, qualidade de vida, turnover, absenteísmo e ética. Acrescentamos a evolução histórica, os objetivos formais, o planejamento de pessoas, a análise e descrição de cargos, os indicadores e a LGPD no nível introdutório." },

      {
        titulo: "Português · Bloco 1",
        subtitulo: "Interpretação de texto",
        aula: [
          { papel: "professor", tipo: "abertura", texto: "Bom dia, turma. Hoje vamos começar a estudar Interpretação de texto. Essa é, sem dúvida, a habilidade mais transversal de qualquer prova de concurso. Interpretar texto é a capacidade de entender o que um texto diz, sem inventar, sem distorcer e sem trazer para dentro da resposta aquilo que você acha que é verdade no mundo real. Tudo o que a banca pergunta precisa ter base no texto." },
          { papel: "aluno1", tipo: "pergunta", texto: "Professor, qual é a diferença entre compreender e interpretar?" },
          { papel: "professor", tipo: "definicao", texto: "Compreender é entender o que está escrito, o que está explícito. Interpretar é entender o que aquilo significa, o que está por trás das palavras, as relações de causa, consequência, oposição e conclusão. A compreensão é a base; a interpretação é o passo seguinte." },
          { papel: "aluno2", tipo: "pergunta", texto: "Então interpretar exige mais do que ler?" },
          { papel: "professor", tipo: "definicao", texto: "Exige. O texto é um tecido. Cada palavra, cada conectivo e cada vírgula tem função. Interpretar é perceber como as ideias se conectam. Quem lê só palavra por palavra perde a relação entre as partes." },
          { papel: "aluno3", tipo: "pergunta", texto: "Qual é o erro mais comum nesse tipo de questão?" },
          { papel: "professor", tipo: "definicao", texto: "Escolher a alternativa que parece bonita, mas que não está no texto. A banca adora colocar alternativas verdadeiras no mundo real, mas que o texto não disse. É o famoso distrator por extrapolação." },
          { papel: "aluno4", tipo: "pergunta", texto: "Pode dar um exemplo?" },
          { papel: "professor", tipo: "definicao", texto: "Imagine que o texto diga que a empresa aumentou o investimento em treinamento. A alternativa diz que a empresa investe mais em treinamento do que em salários. O texto não disse isso. É uma informação plausível, mas ausente do texto. Está errada." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* desconfie de exageros. Palavras como sempre, nunca, todos, nenhum, exclusivamente, somente, apenas costumam indicar erro. O texto raramente afirma algo absoluto." },
          { papel: "aluno5", tipo: "pergunta", texto: "E a inversão de causa e consequência?" },
          { papel: "professor", tipo: "definicao", texto: "É uma pegadinha clássica. O texto pode dizer que A levou a B. A alternativa inverte e diz que B levou a A. Parece certo, mas está errado. Sempre verifique a direção da relação." },
          { papel: "aluno6", tipo: "pergunta", texto: "E quando a alternativa usa sinônimos?" },
          { papel: "professor", tipo: "definicao", texto: "Sinônimos são permitidos. A banca pode parafrasear o texto. O que não pode é mudar o sentido. Se a paráfrase mantém a ideia, está correta. Se distorce, está errada." },
          { papel: "aluno7", tipo: "pergunta", texto: "E quando o texto tem ironia?" },
          { papel: "professor", tipo: "definicao", texto: "A ironia é um recurso expressivo. O texto diz o contrário do que quer comunicar. A banca costuma cobrar isso. Você precisa perceber o tom, não apenas as palavras literais." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* a banca costuma cobrar a diferença entre o que está escrito e o que se pode inferir. Inferência é permitida quando há base no texto. Extrapolação é sempre errada." },
          { papel: "aluno1", tipo: "pergunta", texto: "E quando o enunciado pede a ideia principal?" },
          { papel: "professor", tipo: "definicao", texto: "A ideia principal é o núcleo do texto. Costuma estar no primeiro ou no último parágrafo, mas não sempre. Você precisa identificar o tema central e o que o autor defende sobre ele." },
          { papel: "aluno2", tipo: "pergunta", texto: "E a diferença entre tema e tese?" },
          { papel: "professor", tipo: "definicao", texto: "Tema é o assunto. Tese é a posição do autor sobre o assunto. O tema pode ser gestão de pessoas. A tese pode ser que a gestão de pessoas precisa ser estratégica. A banca cobra os dois." },
          { papel: "aluno3", tipo: "pergunta", texto: "E quando o texto apresenta argumentos contrários?" },
          { papel: "professor", tipo: "definicao", texto: "A banca costuma perguntar qual é a posição do autor. Cuidado: apresentar um argumento contrário não significa concordar com ele. O autor pode apresentar para refutar. Você precisa perceber a intenção." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* a banca adora trocar a posição do autor pela posição do opositor. Leia com atenção quem defende o quê." },
          { papel: "aluno4", tipo: "pergunta", texto: "E a coesão referencial? Cai muito?" },
          { papel: "professor", tipo: "definicao", texto: "Cai muito. A banca pergunta a que termo se refere um pronome, um advérbio ou uma expressão. Você precisa rastrear a referência. Se o texto diz que a empresa contratou novos profissionais e que eles passaram por treinamento, o eles se refere aos novos profissionais." },
          { papel: "aluno5", tipo: "pergunta", texto: "E quando o texto tem muitos conectivos?" },
          { papel: "professor", tipo: "definicao", texto: "Os conectivos indicam a relação entre as ideias: oposição (mas, porém, contudo), conclusão (portanto, assim, logo), causa (porque, pois, já que), concessão (embora, ainda que), adição (e, além disso). A banca cobra o valor semântico de cada um." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* trocar o conectivo muda o sentido. Mas indica oposição. Portanto indica conclusão. A banca troca um pelo outro e você precisa perceber." },
          { papel: "aluno6", tipo: "pergunta", texto: "E quando o texto é literário?" },
          { papel: "professor", tipo: "definicao", texto: "Textos literários exigem mais atenção à subjetividade, às figuras de linguagem e ao tom. A banca costuma cobrar a interpretação de metáforas e ironias. A regra é a mesma: a resposta está no texto." },
          { papel: "aluno7", tipo: "pergunta", texto: "E quando o texto é técnico ou científico?" },
          { papel: "professor", tipo: "definicao", texto: "Textos técnicos exigem atenção à precisão dos conceitos. A banca costuma cobrar definições e relações de causa e efeito. Você precisa identificar o que é definição, o que é exemplo e o que é conclusão." },
          { papel: "professor", tipo: "definicao", texto: "Como isso pode aparecer na prova. Primeira: a banca afirma que a resposta está no texto, mesmo que seja verdadeira no mundo real. Está correta?" },

          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* a banca adora inverter. Diz que a Administração pode fazer tudo o que a lei não proíbe. Está errado. Essa é a regra do particular. A Administração só faz o que a lei autoriza." },

          { papel: "professor", tipo: "definicao", texto: "A eficiência foi incluída pela Emenda Constitucional 19/1998. Antes o LIMPE era só LIMP. A banca cobra muito essa data e essa mudança." },
          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* eficiência foi incluída pela EC 19/1998. A banca coloca a eficiência como princípio original. Não é. Ela foi acrescentada." },

          { papel: "professor", tipo: "definicao", texto: "Como isso pode aparecer na prova. Primeira: a banca afirma que a Administração pode fazer tudo o que a lei não proíbe. Está correta?" },

          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* o ato administrativo tem presunção de legitimidade e de veracidade. Só deixa de produzir efeitos se for anulado ou revogado. A banca cobra muito os atributos." },

          { papel: "professor", tipo: "atencao_banca", texto: "*Atenção à banca:* a anulação pode gerar dever de indenizar se o beneficiário estava de boa-fé. A revogação, em regra, não gera indenização, salvo se houver prejuízo comprovado." },

    /* ══════════ iOS UNLOCK ══════════ */
    function desbloquearIOS(forcar = false) {
      if (!isIOS || !synth) return;
      if (iosDesbloqueado && !forcar) return;
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0.01; u.rate = 2.0; u.pitch = 1.0;
        if (elenco && elenco.professor) u.voice = elenco.professor;
        synth.speak(u);
        iosDesbloqueado = true;
      } catch (e) { }
    }
    document.addEventListener('touchstart', () => desbloquearIOS(), { once: true, passive: true });
    document.addEventListener('click', () => desbloquearIOS(), { once: true });

    /* ══════════ RENDER ══════════ */
    function renderTexto(t) {
      return esc(String(t).replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' '))
        .replace(/\*([^*]+)\*/g, '<span class="enfase">$1</span>');
    }

    function renderCapitulo() {
      const el = $('folha');
      el.style.opacity = 0;
      setTimeout(() => {
        el.innerHTML = '';

        const header = document.createElement('div');
        header.className = 'folha-header';
        const titulo = document.createElement('div');
        titulo.className = 'folha-titulo';
        titulo.textContent = CAPITULOS[indiceCapitulo].subtitulo;
        header.appendChild(titulo);

        const bolinhas = document.createElement('div');
        bolinhas.className = 'folha-bolinhas';
        for (let p = 0; p < totalCaps(); p++) {
          const b = document.createElement('div');
          b.className = 'bolinha' + (p === indiceCapitulo ? ' ativa' : '');
          bolinhas.appendChild(b);
        }
        header.appendChild(bolinhas);
        el.appendChild(header);

        aulaAtual().forEach((fala, i) => {
          if (fala.tipo === 'pausa') {
            const br = document.createElement('div');
            br.className = 'quebra';
            el.appendChild(br);
            return;
          }
          const div = document.createElement('div');
          div.className = 'fala ' + fala.papel + ' futura';
          div.id = 'fala-' + i;
          div.innerHTML = '<span class="simbolo">' + (SIMBOLOS[fala.papel] || '·') + '</span>' + renderTexto(fala.texto);
          div.addEventListener('click', () => irParaFala(i));
          el.appendChild(div);
        });

        el.style.opacity = 1;
        atualizarProgresso();
        atualizarBotoesNav();
      }, 150);
    }

    function irParaFala(idx) {
      const aula = aulaAtual();
      if (idx < 0 || idx >= aula.length || aula[idx].tipo === 'pausa') return;

      const tocava = tocando && !pausado;
      pararSilencioso();
      indiceAtual = idx;

      destacarFalas(idx);
      atualizarBotoesNav();

      if (tocava) setTimeout(tocarDeOndeParou, 80);
      else mostrarToast('📍 Fala ' + contarFalas(idx));
    }

    function contarFalas(idx) {
      const aula = aulaAtual();
      let n = 0;
      for (let k = 0; k <= idx && k < aula.length; k++) if (aula[k].tipo !== 'pausa') n++;
      return n + ' / ' + falasValidas(aula).length;
    }

    function destacarFalas(idx) {
      document.querySelectorAll('.fala').forEach(el => {
        const i = parseInt(el.id.replace('fala-', ''), 10);
        el.classList.remove('falando', 'falada', 'futura');
        el.classList.add(i < idx ? 'falada' : i === idx ? 'falando' : 'futura');
      });
      const atual = $('fala-' + idx);
      if (atual) {
        const r = atual.getBoundingClientRect();
        if (r.top < 100 || r.bottom > window.innerHeight - 220)
          atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function resetDestaques() {
      document.querySelectorAll('.fala').forEach(el => {
        el.classList.remove('falando', 'falada');
        el.classList.add('futura');
      });
    }

    /* ══════════ NAVEGAÇÃO ══════════ */
    function irParaCapitulo(novo) {
      if (novo < 0 || novo >= totalCaps() || novo === indiceCapitulo) return;
      const tocava = tocando && !pausado;
      pararSilencioso();

      indiceCapitulo = novo;
      indiceAtual = 0;

      renderCapitulo();
      atualizarListaBlocos();
      mostrarToast('📖 ' + CAPITULOS[indiceCapitulo].subtitulo);

      if (tocava) setTimeout(tocarDeOndeParou, 400);
    }
    const pularCapitulo = dir => irParaCapitulo(indiceCapitulo + dir);

    function atualizarProgresso() {
      $('playerProgresso').textContent = 'Bloco ' + (indiceCapitulo + 1) + ' / ' + totalCaps();
    }

    function atualizarListaBlocos() {
      const el = $('blocosLista');
      el.innerHTML = '';
      CAPITULOS.forEach((cap, i) => {
        const item = document.createElement('button');
        item.className = 'bloco-item' + (i === indiceCapitulo ? ' ativo' : '');
        item.type = 'button';
        item.innerHTML =
          '<div class="bloco-num">' + (i + 1) + '</div>' +
          '<div class="bloco-info"><div class="bloco-nome">' + esc(cap.titulo) + '</div>' +
          '<div class="bloco-desc">' + esc(cap.subtitulo) + '</div></div>' +
          '<div class="bloco-check">✓</div>';
        item.addEventListener('click', () => {
          if (i === indiceCapitulo) return;
          irParaCapitulo(i);
          setTimeout(fecharMenu, 200);
        });
        el.appendChild(item);
      });
    }
