<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sala de Aula — RH Bloco 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    background: #0f172a; color: #cbd5e1;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }

  .conteudo { flex: 1; padding: 24px 22px 0; overflow: hidden; display: flex; flex-direction: column; }

  .texto-bloco {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 1.02rem; line-height: 1.85;
    color: #cbd5e1;
  }

  .fala {
    margin-bottom: 14px;
    transition: opacity .25s, background .25s;
  }

  .simbolo {
    font-weight: 700;
    margin-right: 8px;
    font-size: 1.1em;
    opacity: .85;
  }
  .fala.professor .simbolo { color: #a78bfa; }
  .fala.aluno1 .simbolo   { color: #60a5fa; }
  .fala.aluno2 .simbolo   { color: #fbbf24; }
  .fala.aluno3 .simbolo   { color: #34d399; }
  .fala.aluno4 .simbolo   { color: #f472b6; }
  .fala.aluno5 .simbolo   { color: #22d3ee; }
  .fala.aluno6 .simbolo   { color: #fb923c; }
  .fala.aluno7 .simbolo   { color: #c084fc; }

  .fala.falando {
    background: rgba(124, 58, 237, .15);
    border-left: 3px solid #7c3aed;
    border-radius: 4px;
    padding: 6px 10px;
    margin-left: -13px;
    margin-right: -10px;
    color: #f1f5f9;
  }
  .fala.falada { opacity: .4; }
  .fala.futura { opacity: .78; }

  /* ênfase visual nas palavras-âncora */
  .enfase {
    color: #fbbf24;
    font-weight: 700;
    letter-spacing: .01em;
  }

  .quebra { height: 14px; }

  .player { padding: 16px 0 20px; }
  .btn-play {
    width: 100%; min-height: 52px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: opacity .15s, transform .1s;
    background: #2563eb; color: #fff;
  }
  .btn-play:active { opacity: .85; transform: scale(.98); }
  .btn-play.tocando { background: #dc2626; }

  .progresso-wrap {
    margin-top: 10px; height: 3px; background: #1e293b;
    border-radius: 2px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: #3b82f6; border-radius: 2px;
    width: 0%; transition: width .3s;
  }

  .status-vozes {
    margin-top: 8px; font-size: .72rem; color: #64748b;
    text-align: center; line-height: 1.5;
  }
</style>
</head>
<body>

<div class="conteudo">
  <div class="texto-bloco" id="texto"></div>

  <div class="player">
    <button class="btn-play" id="btnPlay" onclick="togglePlay()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Ouvir
    </button>
    <div class="progresso-wrap"><div class="progresso-fill" id="prog"></div></div>
    <p class="status-vozes" id="statusVozes">Detectando vozes…</p>
  </div>
</div>

<script>
/* =====================================================
   DETECÇÃO DE VOZES (com retry duplo para iOS)
   ===================================================== */
let todasAsVozes = [];
let elenco = null;

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function carregarVozesComRetry(callback) {
  let tentativas = 0;
  let jaChamou = false;

  function tentar() {
    tentativas++;
    const vozes = window.speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      if (!jaChamou) { jaChamou = true; callback(); }
      // iOS: segunda leva de vozes chega ~1s depois
      if (tentativas < 20) setTimeout(tentar, 500);
      return;
    }
    if (tentativas < 40) setTimeout(tentar, 100);
    else if (!jaChamou) { jaChamou = true; callback(); }
  }

  if (window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', tentar);
  } else {
    window.speechSynthesis.onvoiceschanged = tentar;
  }
  tentar();
  setTimeout(tentar, 1500);
}

function vozesPtBR() {
  return todasAsVozes.filter(v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    return lang === 'pt-br' || lang.startsWith('pt-br');
  });
}

function filtrarVozes(ptBR) {
  if (!isIOS) return ptBR;
  // No iOS, Siri costuma falhar em cadeias longas — remove se houver alternativa
  const semSiri = ptBR.filter(v => !/siri/i.test(v.name));
  return semSiri.length >= 2 ? semSiri : ptBR;
}

/* =====================================================
   PERFIS — PROFESSOR COACH + ALUNOS DISTINTOS
   ===================================================== */
const PAPEIS_ALUNO = ['aluno1','aluno2','aluno3','aluno4','aluno5','aluno6','aluno7'];

const SIMBOLOS = {
  professor: '§',
  aluno1: '·', aluno2: '·', aluno3: '·', aluno4: '·',
  aluno5: '·', aluno6: '·', aluno7: '·'
};

const PERFIS = {
  /* ── PROFESSOR: coach motivacional ──
     Grave, lento, domina o silêncio com pausas longas */
  professor: {
    rate: 0.78, pitch: 0.82, volume: 1.0,
    microCurta: 280, microLonga: 420,
    rateEnfase: 0.72,      // palavra-âncora ainda mais lenta
    pitchEnfase: 0.78,     // e mais grave
    pausas: {
      abertura: 1100, definicao: 520, pergunta: 350,
      confirmacao: 480, guarde: 1200, conclusao: 900, pausa: 800
    }
  },

  /* ── ALUNOS: variação ampla de timbre e ritmo ──
     pitch separado por ~0.10 entre cada um para distinguir bem */
  aluno1: { rate: 1.05, pitch: 1.25, volume: 0.92,
    microCurta: 90, microLonga: 160, rateEnfase: 0.95, pitchEnfase: 1.20,
    pausas: { abertura:240, definicao:180, pergunta:260, confirmacao:200, guarde:280, conclusao:280, pausa:380 } },

  aluno2: { rate: 0.90, pitch: 0.92, volume: 0.92,
    microCurta: 130, microLonga: 200, rateEnfase: 0.82, pitchEnfase: 0.90,
    pausas: { abertura:260, definicao:220, pergunta:240, confirmacao:200, guarde:280, conclusao:260, pausa:380 } },

  aluno3: { rate: 1.00, pitch: 1.12, volume: 0.92,
    microCurta: 110, microLonga: 180, rateEnfase: 0.92, pitchEnfase: 1.08,
    pausas: { abertura:300, definicao:240, pergunta:300, confirmacao:220, guarde:300, conclusao:280, pausa:400 } },

  aluno4: { rate: 0.85, pitch: 0.88, volume: 0.92,
    microCurta: 150, microLonga: 220, rateEnfase: 0.78, pitchEnfase: 0.86,
    pausas: { abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:320, conclusao:300, pausa:420 } },

  aluno5: { rate: 1.10, pitch: 1.18, volume: 0.92,
    microCurta: 80, microLonga: 150, rateEnfase: 1.00, pitchEnfase: 1.14,
    pausas: { abertura:220, definicao:180, pergunta:240, confirmacao:180, guarde:260, conclusao:240, pausa:360 } },

  aluno6: { rate: 0.95, pitch: 1.05, volume: 0.92,
    microCurta: 120, microLonga: 190, rateEnfase: 0.88, pitchEnfase: 1.02,
    pausas: { abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:300, conclusao:280, pausa:400 } },

  aluno7: { rate: 0.98, pitch: 0.95, volume: 0.92,
    microCurta: 130, microLonga: 200, rateEnfase: 0.90, pitchEnfase: 0.93,
    pausas: { abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:300, conclusao:280, pausa:400 } }
};

/* =====================================================
   DIÁLOGO — professor com palavras-âncora em *asteriscos*
   ===================================================== */
const AULA = [
  { papel:'professor', tipo:'abertura',
    texto:"Bom dia, turma. Hoje vamos entender o que é *gestão de pessoas*." },

  { papel:'aluno1', tipo:'pergunta',
    texto:"Professor, gestão de pessoas é a área que cuida do quê, exatamente?" },

  { papel:'professor', tipo:'definicao',
    texto:"Boa pergunta. Gestão de pessoas é a área responsável pelo *ser humano* no trabalho." },

  { papel:'professor', tipo:'definicao',
    texto:"Ela atrai, desenvolve, motiva | e *mantém* as pessoas dentro da empresa." },

  { papel:'aluno2', tipo:'confirmacao',
    texto:"Entendi. Então é tudo que envolve gente dentro da organização." },

  { papel:'professor', tipo:'definicao',
    texto:"*Exatamente.* Tudo que envolve gente: atrair, desenvolver, motivar, manter." },

  { papel:'aluno5', tipo:'pergunta',
    texto:"E como isso funciona no dia a dia?" },

  { papel:'professor', tipo:'definicao',
    texto:"No dia a dia, aparece em *cada decisão* sobre pessoas." },

  { tipo:'pausa' },

  { papel:'aluno3', tipo:'pergunta',
    texto:"Mas professor, isso sempre foi assim?" },

  { papel:'professor', tipo:'definicao',
    texto:"*Não.* Durante muito tempo, essa área foi vista apenas como operacional." },

  { papel:'professor', tipo:'definicao',
    texto:"Cuidava de folha de pagamento, ponto, férias | e documentação." },

  { papel:'aluno1', tipo:'confirmacao',
    texto:"Ah, o famoso setor que resolvia papelada." },

  { papel:'professor', tipo:'confirmacao',
    texto:"Isso mesmo. Era o setor da *papelada*." },

  { papel:'aluno6', tipo:'pergunta',
    texto:"E o que fazia alguém mudar de ideia?" },

  { papel:'professor', tipo:'definicao',
    texto:"A percepção de que *pessoas* fazem a diferença nos resultados." },

  { tipo:'pausa' },

  { papel:'aluno2', tipo:'pergunta',
    texto:"E hoje, o que mudou?" },

  { papel:'professor', tipo:'definicao',
    texto:"Hoje o cenário mudou *completamente*." },

  { papel:'professor', tipo:'definicao',
    texto:"A gestão de pessoas passou a ser *estratégica*." },

  { papel:'professor', tipo:'definicao',
    texto:"Ela participa das *decisões importantes* da organização." },

  { papel:'aluno4', tipo:'confirmacao',
    texto:"Então ela deixou de só resolver problemas e passou a construir resultados." },

  { papel:'professor', tipo:'confirmacao',
    texto:"*Exatamente.* Essa é a virada de chave." },

  { tipo:'pausa' },

  { papel:'aluno7', tipo:'pergunta',
    texto:"Tem diferença entre gestão de pessoas | e gestão de recursos humanos?" },

  { papel:'professor', tipo:'definicao',
    texto:"Tem. E é uma diferença *importante*." },

  { papel:'professor', tipo:'definicao',
    texto:"Gestão de recursos humanos é o nome mais antigo." },

  { papel:'professor', tipo:'definicao',
    texto:"Ligado à ideia de que pessoas são *recursos*. Como máquinas, como dinheiro." },

  { papel:'professor', tipo:'definicao',
    texto:"Gestão de pessoas é o nome mais *moderno*." },

  { papel:'professor', tipo:'definicao',
    texto:"Ela enxerga o ser humano como *parceiro* da organização. Não como recurso." },

  { papel:'aluno1', tipo:'confirmacao',
    texto:"Então não é só uma troca de nome." },

  { papel:'professor', tipo:'definicao',
    texto:"*Não.* É uma mudança de *mentalidade*." },

  { papel:'professor', tipo:'definicao',
    texto:"Antes, a pessoa era vista como custo. || Agora, é vista como *diferencial competitivo*." },

  { tipo:'pausa' },

  { papel:'professor', tipo:'guarde',
    texto:"*Guarde isto.*" },

  { papel:'professor', tipo:'guarde',
    texto:"Gestão de pessoas é a área que cuida do *ser humano* no trabalho." },

  { papel:'aluno4', tipo:'guarde',
    texto:"E quando ela é estratégica, deixa de apenas resolver problemas." },

  { papel:'professor', tipo:'guarde',
    texto:"E passa a *construir resultados*." },

  { papel:'aluno2', tipo:'guarde',
    texto:"Agora ficou claro, professor." },

  { papel:'professor', tipo:'conclusao',
    texto:"Então guardem bem essa ideia. Gestão de pessoas é sobre *gente*. Sempre foi. E sempre será." }
];

let synth = window.speechSynthesis;
let tocando = false;
let cancelar = false;

/* =====================================================
   RENDER
   ===================================================== */
function renderTextoLegivel(texto) {
  // remove marcadores de micro-pausa
  let t = texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
  // converte *palavra* em <span class="enfase">
  t = t.replace(/\*([^*]+)\*/g, '<span class="enfase">$1</span>');
  return t;
}

function renderAula() {
  const el = document.getElementById('texto');
  el.innerHTML = '';
  AULA.forEach((fala, i) => {
    if (fala.tipo === 'pausa') {
      const br = document.createElement('div');
      br.className = 'quebra';
      el.appendChild(br);
      return;
    }
    const div = document.createElement('div');
    div.className = 'fala ' + fala.papel + ' futura';
    div.id = 'fala-' + i;
    const simbolo = SIMBOLOS[fala.papel] || '·';
    div.innerHTML = `<span class="simbolo">${simbolo}</span>${renderTextoLegivel(fala.texto)}`;
    el.appendChild(div);
  });
}
renderAula();

function destacarFala(idx) {
  document.querySelectorAll('.fala').forEach(el => {
    const numIdx = parseInt(el.id.replace('fala-', ''));
    el.classList.remove('falando', 'falada', 'futura');
    if (numIdx < idx) el.classList.add('falada');
    else if (numIdx === idx) el.classList.add('falando');
    else el.classList.add('futura');
  });
  const atual = document.getElementById('fala-' + idx);
  if (atual) atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetDestaques() {
  document.querySelectorAll('.fala').forEach(el => {
    el.classList.remove('falando', 'falada');
    el.classList.add('futura');
  });
}

/* =====================================================
   PLAYER
   ===================================================== */
function togglePlay() {
  if (tocando) { parar(); return; }
  tocar();
}

function parar() {
  cancelar = true;
  synth.cancel();
  tocando = false;
  resetDestaques();
  setBtnEstado(false);
  setProgresso(0);
}

function setBtnEstado(playing) {
  const btn = document.getElementById('btnPlay');
  if (playing) {
    btn.className = 'btn-play tocando';
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Parar`;
  } else {
    btn.className = 'btn-play';
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/></svg> Ouvir`;
  }
}

function setProgresso(pct) {
  document.getElementById('prog').style.width = pct + '%';
}

/* =====================================================
   SEGMENTAÇÃO: micro-pausas + ênfase
   ===================================================== */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) {
        // dentro de cada parte, separa ênfases
        const comEnfase = p.split(/(\*[^*]+\*)/g);
        comEnfase.forEach(frag => {
          if (!frag) return;
          if (frag.startsWith('*') && frag.endsWith('*')) {
            segmentos.push({ tipo:'enfase', texto: frag.slice(1, -1).trim() });
          } else if (frag.trim()) {
            segmentos.push({ tipo:'fala', texto: frag.trim() });
          }
        });
      }
    });
  });
  return segmentos;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume ?? 1.0;
    if (voz) u.voice = voz;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
  });
}

async function falarComMicroPausas(textoOriginal, perfil, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(perfil.microCurta);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(perfil.microLonga);
    } else if (seg.tipo === 'enfase') {
      await falar(seg.texto, perfil.rateEnfase, perfil.pitchEnfase, perfil.volume, voz);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, perfil.rate, perfil.pitch, perfil.volume, voz);
    }
  }
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ── Troca de voz robusta (iOS-safe) ── */
async function forcarTrocaVoz(voz) {
  synth.cancel();
  await esperar(120);
  await new Promise(resolve => {
    const u = new SpeechSynthesisUtterance('.');
    u.voice = voz;
    u.volume = 0;          // inaudível
    u.rate = 1.0;
    u.pitch = 1.0;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
    setTimeout(resolve, 250); // segurança
  });
  await esperar(180);
}

/* =====================================================
   LOOP PRINCIPAL
   ===================================================== */
async function tocar() {
  if (!elenco || !elenco.professor) {
    alert('Nenhuma voz pt-BR detectada no dispositivo.');
    return;
  }

  cancelar = false;
  tocando = true;
  setBtnEstado(true);

  const total = AULA.filter(d => d.tipo !== 'pausa').length;
  let faladas = 0;
  let ultimaVoz = null;

  for (let i = 0; i < AULA.length; i++) {
    if (cancelar) return;
    const fala = AULA[i];

    if (fala.tipo === 'pausa') {
      await esperar(PERFIS.professor.pausas.pausa);
      continue;
    }

    const voz = elenco[fala.papel];
    const perfil = PERFIS[fala.papel];

    if (voz !== ultimaVoz) {
      await forcarTrocaVoz(voz);
      if (cancelar) return;
      ultimaVoz = voz;
    }

    const pausaAntes = perfil.pausas[fala.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes);

    destacarFala(i);
    faladas++;
    setProgresso(Math.round((faladas / total) * 100));

    await falarComMicroPausas(fala.texto, perfil, voz);
  }

  if (!cancelar) {
    resetDestaques();
    setProgresso(100);
    setTimeout(() => {
      setBtnEstado(false);
      setProgresso(0);
      tocando = false;
    }, 800);
  }
}

/* =====================================================
   DISTRIBUIÇÃO DO ELENCO — prioriza vozes enhanced
   ===================================================== */
const REGEX_PROFESSOR = [
  /felipe.*(enhanced|premium)/i,
  /felipe/i,
  /daniel.*(enhanced|premium)/i,
  /daniel/i,
  /bruno/i,
  /eddy/i,
  /antonio|antônio/i,
  /joão|joao/i
];

function escolherProfessor(vozes) {
  for (const re of REGEX_PROFESSOR) {
    const v = vozes.find(v => re.test(v.name));
    if (v) return v;
  }
  return vozes[0];
}

function distribuirElenco(vozes) {
  if (vozes.length === 0) return null;

  const professor = escolherProfessor(vozes);
  const restantes = vozes.filter(v => v !== professor);

  // Enhanced/premium primeiro → timbre mais rico para os alunos
  const enhanced = restantes.filter(v => /enhanced|premium/i.test(v.name));
  const compactas = restantes.filter(v => !/enhanced|premium/i.test(v.name));
  const ordenadas = [...enhanced, ...compactas];

  const fila = ordenadas.length > 0 ? ordenadas : [professor];

  const e = { professor };
  PAPEIS_ALUNO.forEach((papel, i) => {
    e[papel] = fila[i % fila.length];
  });
  return e;
}

/* =====================================================
   STATUS VISUAL (ajuda a debugar elenco)
   ===================================================== */
function atualizarStatus() {
  const el = document.getElementById('statusVozes');
  if (!elenco) { el.textContent = 'Sem vozes pt-BR detectadas.'; return; }
  const unicas = new Set(Object.values(elenco).map(v => v.name));
  el.textContent = `Professor: ${elenco.professor.name} · ${unicas.size} vozes distintas em uso`;
}

/* =====================================================
   INIT
   ===================================================== */
carregarVozesComRetry(() => {
  const ptBR = filtrarVozes(vozesPtBR());
  if (ptBR.length === 0) {
    document.getElementById('statusVozes').textContent = 'Nenhuma voz pt-BR instalada.';
    return;
  }
  elenco = distribuirElenco(ptBR);
  atualizarStatus();
});
</script>
</body>
</html>
