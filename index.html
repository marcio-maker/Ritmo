<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sala de Aula — RH Bloco 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100dvh;

  .cabecalho {

  }

  }

  }

  .fala {
    display: flex; gap: 8px; margin-bottom: 10px;

  }
  .avatar {

    font-size: .72rem; font-weight: 800; flex-shrink: 0;
    color: #fff;
  }
  .fala.professor .avatar { background: #7c3aed; }
  .fala.aluno1   .avatar { background: #3b82f6; }
  .fala.aluno2   .avatar { background: #f59e0b; }
  .fala.aluno3   .avatar { background: #10b981; }
  .fala.aluno4   .avatar { background: #ec4899; }

  .balao {
    flex: 1; padding: 8px 12px; border-radius: 12px;
    font-size: .88rem; line-height: 1.5;
    background: #0f172a; color: #cbd5e1;
    border: 1px solid #334155;
    transition: background .15s, border-color .15s, color .15s;
  }
  .fala.professor .balao { border-top-left-radius: 4px; }
  .fala.aluno1   .balao { border-top-left-radius: 4px; }
  .fala.aluno2   .balao { border-top-right-radius: 4px; }
  .fala.aluno3   .balao { border-top-left-radius: 4px; }
  .fala.aluno4   .balao { border-top-right-radius: 4px; }

  .fala.falando .balao { color: #fff; }
  .fala.professor.falando .balao { background: #4c1d95; border-color: #7c3aed; }
  .fala.aluno1.falando   .balao { background: #1e3a8a; border-color: #3b82f6; }
  .fala.aluno2.falando   .balao { background: #78350f; border-color: #f59e0b; }
  .fala.aluno3.falando   .balao { background: #064e3b; border-color: #10b981; }
  .fala.aluno4.falando   .balao { background: #831843; border-color: #ec4899; }

  .fala.falada { opacity: .45; }
  .fala.futura { opacity: .65; }

  .quebra { height: 10px; }

  .player { padding: 12px 0 0; }
  .btn-play {
    width: 100%; min-height: 52px; border: none; border-radius: 12px;
    font-size: .95rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: opacity .15s, transform .1s;
    background: #2563eb; color: #fff;
  }
  .btn-play:active { opacity: .8; transform: scale(.97); }
  .btn-play.tocando { background: #dc2626; }

  .elenco {
    font-size: .68rem; color: #475569; text-align: center;
    padding: 10px 0 12px; font-weight: 600; line-height: 1.6;
  }
  .elenco .prof { color: #a78bfa; font-weight: 700; }
  .elenco .a1 { color: #60a5fa; font-weight: 700; }
  .elenco .a2 { color: #fbbf24; font-weight: 700; }
  .elenco .a3 { color: #34d399; font-weight: 700; }
  .elenco .a4 { color: #f472b6; font-weight: 700; }
  .modo { font-size: .62rem; color: #64748b; text-align: center; padding-bottom: 8px; font-style: italic; }

  .progresso-wrap {
    margin-top: 8px; height: 4px; background: #1e293b;
    border-radius: 2px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: #2563eb; border-radius: 2px;
    width: 0%; transition: width .3s;
  }
</style>
</head>
<body>

<div class="cabecalho">
  <h1>🎓 RH — Bloco 1 · Sala de Aula</h1>
  <p>1 professor + 4 alunos</p>
</div>

<div class="conteudo">
  <div class="texto-bloco" id="texto"></div>

  <div class="player">
    <button class="btn-play" id="btnPlay" onclick="togglePlay()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Ouvir aula
    </button>
    <div class="progresso-wrap"><div class="progresso-fill" id="prog"></div></div>
    <div class="elenco" id="elenco">🎙 Detectando vozes...</div>
    <div class="modo" id="modo"></div>
  </div>
</div>

<script>
/* =====================================================
   1. DETECÇÃO DE VOZES + MODO
   Detecta se pode usar vozes reais diferentes.
   Se sim → Modo Real (PC/Android).
   Se não → Modo Personagem (iOS): 1 voz real + 5 perfis.
   ===================================================== */
let todasAsVozes = [];
let vozesCarregadas = false;
let modoReal = false;      // true = usa vozes diferentes de verdade
let elenco = null;

function carregarVozesComRetry(callback) {
  let tentativas = 0;
  function tentar() {
    tentativas++;
    const vozes = window.speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      vozesCarregadas = true;
      callback();
      return;
    }
    if (tentativas < 50) setTimeout(tentar, 100);
    else callback();
  }
  if (window.speechSynthesis.addEventListener) {
    try { window.speechSynthesis.addEventListener('voiceschanged', tentar); }
    catch (e) { window.speechSynthesis.onvoiceschanged = tentar; }
  } else {
    window.speechSynthesis.onvoiceschanged = tentar;
  }
  tentar();
}

function vozesPtBR() {
  return todasAsVozes.filter(v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    return lang === 'pt-br' || lang.startsWith('pt-br');
  });
}

function detectarModo() {
  const pt = vozesPtBR();
  // Se tem 5+ vozes pt-BR, tenta modo real.
  // Se tem 4 ou menos, usa modo personagem (iOS bloqueia troca de voz).
  // Mas o critério real: iOS tem várias vozes no getVoices, mas trava na padrão.
  // Então usamos a user agent como heurística.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  modoReal = (pt.length >= 5) && !isIOS;
  return { pt: pt.length, modoReal };
}

/* =====================================================
   2. ELENCO
   Modo real: cada papel usa uma voz diferente.
   Modo personagem: todos os papéis usam a mesma voz real,
   mas com pitch/rate bem diferentes.
   ===================================================== */
function sortearElenco() {
  const pt = vozesPtBR();
  if (pt.length === 0) return null;

  const baralhadas = [...pt];
  for (let i = baralhadas.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [baralhadas[i], baralhadas[j]] = [baralhadas[j], baralhadas[i]];
  }

  if (modoReal) {
    // 5 vozes diferentes
    return {
      professor: baralhadas[0],
      aluno1: baralhadas[1] || baralhadas[0],
      aluno2: baralhadas[2] || baralhadas[0],
      aluno3: baralhadas[3] || baralhadas[0],
      aluno4: baralhadas[4] || baralhadas[0]
    };
  } else {
    // Modo personagem: mesma voz para todos, mas pitch/rate diferentes
    const vozUnica = baralhadas[0];
    return {
      professor: vozUnica,
      aluno1: vozUnica,
      aluno2: vozUnica,
      aluno3: vozUnica,
      aluno4: vozUnica
    };
  }
}

function atualizarElenco() {
  const elElenco = document.getElementById('elenco');
  const elModo = document.getElementById('modo');

  if (!elenco || !elenco.professor) {
    elElenco.textContent = '⚠️ Nenhuma voz pt-BR detectada';
    return;
  }

  if (modoReal) {
    elElenco.innerHTML = `
      <span class="prof">Prof:</span> ${elenco.professor.name}<br>
      <span class="a1">A1:</span> ${elenco.aluno1.name} ·
      <span class="a2">A2:</span> ${elenco.aluno2.name} ·
      <span class="a3">A3:</span> ${elenco.aluno3.name} ·
      <span class="a4">A4:</span> ${elenco.aluno4.name}
    `;
    elModo.textContent = '✓ Modo Real — 5 vozes diferentes detectadas';
  } else {
    elElenco.innerHTML = `
      Voz base: <strong>${elenco.professor.name}</strong><br>
      <span class="prof">Prof</span> · <span class="a1">A1</span> · <span class="a2">A2</span> · <span class="a3">A3</span> · <span class="a4">A4</span> — perfis de tom
    `;
    elModo.textContent = '⚠️ Modo Personagem — iOS limita a 1 voz pt-BR; cada papel tem tom próprio';
  }
}

/* =====================================================
   3. DIÁLOGO — Sala de aula sobre "O que é gestão de pessoas"
   ===================================================== */
const AULA = [
  { papel:'professor', tipo:'abertura',
    texto:"Bom dia, turma. Hoje vamos entender o que é gestão de pessoas." },
  { papel:'aluno1', tipo:'pergunta',
    texto:"Professor, gestão de pessoas é a área que cuida do quê, exatamente?" },
  { papel:'professor', tipo:'definicao',
    texto:"Boa pergunta. Gestão de pessoas é a área responsável pelo ser humano no trabalho." },
  { papel:'professor', tipo:'definicao',
    texto:"Ela atrai, desenvolve, motiva | e mantém as pessoas dentro da empresa." },
  { papel:'aluno2', tipo:'confirmacao',
    texto:"Entendi. Então é tudo que envolve gente dentro da organização." },
  { papel:'professor', tipo:'definicao',
    texto:"Exatamente. Tudo que envolve gente: atrair, desenvolver, motivar, manter." },

  { tipo:'pausa' },

  { papel:'aluno3', tipo:'pergunta',
    texto:"Mas professor, isso sempre foi assim?" },
  { papel:'professor', tipo:'definicao',
    texto:"Não. Durante muito tempo, essa área foi vista apenas como operacional." },
  { papel:'professor', tipo:'definicao',
    texto:"Cuidava de folha de pagamento, ponto, férias e documentação." },
  { papel:'aluno1', tipo:'confirmacao',
    texto:"Ah, o famoso setor que resolvia papelada." },
  { papel:'professor', tipo:'confirmacao',
    texto:"Isso mesmo. Era o setor da papelada." },

  { tipo:'pausa' },

  { papel:'aluno2', tipo:'pergunta',
    texto:"E hoje, o que mudou?" },
  { papel:'professor', tipo:'definicao',
    texto:"Hoje o cenário mudou completamente." },
  { papel:'professor', tipo:'definicao',
    texto:"A gestão de pessoas passou a ser estratégica." },
  { papel:'professor', tipo:'definicao',
    texto:"Ela participa das decisões importantes da organização." },
  { papel:'aluno4', tipo:'confirmacao',
    texto:"Então ela deixou de só resolver problemas e passou a construir resultados." },
  { papel:'professor', tipo:'confirmacao',
    texto:"Exatamente. Essa é a virada de chave." },

  { tipo:'pausa' },

  { papel:'aluno3', tipo:'pergunta',
    texto:"Professor, tem diferença entre gestão de pessoas | e gestão de recursos humanos?" },
  { papel:'professor', tipo:'definicao',
    texto:"Tem. E é uma diferença importante." },
  { papel:'professor', tipo:'definicao',
    texto:"Gestão de recursos humanos é o nome mais antigo." },
  { papel:'professor', tipo:'definicao',
    texto:"Ligado à ideia de que pessoas são recursos. Como máquinas, como dinheiro." },
  { papel:'professor', tipo:'definicao',
    texto:"Gestão de pessoas é o nome mais moderno." },
  { papel:'professor', tipo:'definicao',
    texto:"Ela enxerga o ser humano como parceiro da organização. Não como recurso." },
  { papel:'aluno1', tipo:'confirmacao',
    texto:"Então não é só uma troca de nome." },
  { papel:'professor', tipo:'definicao',
    texto:"Não. É uma mudança de mentalidade." },
  { papel:'professor', tipo:'definicao',
    texto:"Antes, a pessoa era vista como custo. || Agora, é vista como diferencial competitivo." },

  { tipo:'pausa' },

  { papel:'professor', tipo:'guarde',
    texto:"Guarde isto." },
  { papel:'professor', tipo:'guarde',
    texto:"Gestão de pessoas é a área que cuida do ser humano no trabalho." },
  { papel:'aluno4', tipo:'guarde',
    texto:"E quando ela é estratégica, deixa de apenas resolver problemas." },
  { papel:'professor', tipo:'guarde',
    texto:"E passa a construir resultados." },
  { papel:'aluno2', tipo:'guarde',
    texto:"Agora ficou claro, professor." },
  { papel:'professor', tipo:'conclusao',
    texto:"Então guardem bem essa ideia. Gestão de pessoas é sobre gente. Sempre foi. E sempre será." }
];

/* =====================================================
   4. PERFIS VOCAIS
   Dois níveis:
   - modoReal: rate/pitch suaves (as vozes já são diferentes)
   - modoPersonagem: rate/pitch extremos (precisa criar a ilusão)
   ===================================================== */
const PERFIS_REAL = {
  professor: { rate: 0.86, pitch: 0.94, volume: 1.0, microCurta: 200, microLonga: 300,
               pausas: { abertura:800, definicao:450, pergunta:300, confirmacao:350, guarde:850, conclusao:600, pausa:650 } },
  aluno1:    { rate: 0.98, pitch: 1.06, volume: 0.95, microCurta: 100, microLonga: 180,
               pausas: { abertura:300, definicao:200, pergunta:250, confirmacao:200, guarde:300, conclusao:300, pausa:400 } },
  aluno2:    { rate: 0.92, pitch: 0.98, volume: 0.95, microCurta: 120, microLonga: 180,
               pausas: { abertura:250, definicao:200, pergunta:220, confirmacao:180, guarde:280, conclusao:250, pausa:380 } },
  aluno3:    { rate: 0.94, pitch: 1.02, volume: 0.95, microCurta: 150, microLonga: 220,
               pausas: { abertura:300, definicao:220, pergunta:300, confirmacao:200, guarde:300, conclusao:280, pausa:400 } },
  aluno4:    { rate: 0.88, pitch: 0.96, volume: 0.95, microCurta: 160, microLonga: 220,
               pausas: { abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:320, conclusao:300, pausa:420 } }
};

/* Pitch/rate extremos para criar 5 "vozes" diferentes na mesma voz base */
const PERFIS_PERSONAGEM = {
  professor: { rate: 0.82, pitch: 0.80, volume: 1.0, microCurta: 240, microLonga: 340,
               pausas: { abertura:900, definicao:500, pergunta:350, confirmacao:400, guarde:900, conclusao:700, pausa:700 } },
  aluno1:    { rate: 1.05, pitch: 1.20, volume: 1.0, microCurta: 80,  microLonga: 140,
               pausas: { abertura:250, definicao:180, pergunta:220, confirmacao:180, guarde:280, conclusao:280, pausa:380 } },
  aluno2:    { rate: 0.94, pitch: 0.95, volume: 1.0, microCurta: 120, microLonga: 180,
               pausas: { abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:300, conclusao:280, pausa:400 } },
  aluno3:    { rate: 0.98, pitch: 1.12, volume: 1.0, microCurta: 150, microLonga: 220,
               pausas: { abertura:320, definicao:240, pergunta:320, confirmacao:220, guarde:320, conclusao:300, pausa:420 } },
  aluno4:    { rate: 0.86, pitch: 0.88, volume: 1.0, microCurta: 180, microLonga: 240,
               pausas: { abertura:300, definicao:240, pergunta:260, confirmacao:220, guarde:340, conclusao:320, pausa:440 } }
};

function perfilParaPapel(papel) {
  return modoReal ? PERFIS_REAL[papel] : PERFIS_PERSONAGEM[papel];
}

let synth = window.speechSynthesis;
let tocando = false;
let cancelar = false;

/* ── Render ── */
function renderTextoLegivel(texto) {
  return texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
}

function renderAula() {
  const el = document.getElementById('texto');
  el.innerHTML = '';
  AULA.forEach((fala, i) => {
    if (fala.tipo === 'pausa') {
      const br = document.createElement('div');
      br.className = 'quebra';
      el.appendChild(br);
      return;
    }
    const div = document.createElement('div');
    div.className = 'fala ' + fala.papel + ' futura';
    div.id = 'fala-' + i;
    const label = {
      professor: 'P', aluno1: 'A1', aluno2: 'A2', aluno3: 'A3', aluno4: 'A4'
    }[fala.papel];
    div.innerHTML = `
      <div class="avatar">${label}</div>
      <div class="balao">${renderTextoLegivel(fala.texto)}</div>
    `;
    el.appendChild(div);
  });
}
renderAula();

function destacarFala(idx) {
  document.querySelectorAll('.fala').forEach(el => {
    const numIdx = parseInt(el.id.replace('fala-', ''));
    el.classList.remove('falando', 'falada', 'futura');
    if (numIdx < idx) el.classList.add('falada');
    else if (numIdx === idx) el.classList.add('falando');
    else el.classList.add('futura');
  });
  const atual = document.getElementById('fala-' + idx);
  if (atual) atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetDestaques() {
  document.querySelectorAll('.fala').forEach(el => {
    el.classList.remove('falando', 'falada');
    el.classList.add('futura');
  });
}

/* ── Player ── */
function togglePlay() {
  if (tocando) { parar(); return; }
  tocar();
}

function parar() {
  cancelar = true;
  synth.cancel();
  tocando = false;
  resetDestaques();
  setBtnEstado(false);
  setProgresso(0);
}

function setBtnEstado(playing) {
  const btn = document.getElementById('btnPlay');
  if (playing) {
    btn.className = 'btn-play tocando';
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Parar`;
  } else {
    btn.className = 'btn-play';
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/></svg> Ouvir aula`;
  }
}

function setProgresso(pct) {
  document.getElementById('prog').style.width = pct + '%';
}

/* ── Micro-pausas ── */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) segmentos.push({ tipo:'fala', texto:p.trim() });
    });
  });
  return segmentos;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume ?? 1.0;
    if (voz) u.voice = voz;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
  });
}

async function falarComMicroPausas(textoOriginal, perfil, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(perfil.microCurta);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(perfil.microLonga);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, perfil.rate, perfil.pitch, perfil.volume, voz);
    }
  }
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function forcarTrocaVoz(voz) {
  synth.cancel();
  await esperar(150);
  await falar(' ', 1.0, 1.0, 1.0, voz);
  await esperar(250);
}

async function tocar() {
  if (!vozesCarregadas) {
    carregarVozesComRetry(() => {
      const info = detectarModo();
      elenco = sortearElenco();
      atualizarElenco();
      tocar();
    });
    return;
  }
  if (!elenco) {
    detectarModo();
    elenco = sortearElenco();
    atualizarElenco();
  }
  if (!elenco || !elenco.professor) {
    alert('Nenhuma voz pt-BR detectada.');
    return;
  }

  cancelar = false;
  tocando = true;
  setBtnEstado(true);

  const total = AULA.filter(d => d.tipo !== 'pausa').length;
  let faladas = 0;
  let ultimaVoz = null;

  for (let i = 0; i < AULA.length; i++) {
    if (cancelar) return;
    const fala = AULA[i];

    if (fala.tipo === 'pausa') {
      const perfilProf = perfilParaPapel('professor');
      await esperar(perfilProf.pausas.pausa);
      continue;
    }

    const voz = elenco[fala.papel];
    const perfil = perfilParaPapel(fala.papel);

    // Workaround iOS: força troca de voz quando muda de voz real (só no modo real)
    if (modoReal && ultimaVoz !== voz) {
      await forcarTrocaVoz(voz);
      if (cancelar) return;
      ultimaVoz = voz;
    } else if (!modoReal && ultimaVoz === null) {
      // No modo personagem, força a voz base uma única vez
      await forcarTrocaVoz(voz);
      if (cancelar) return;
      ultimaVoz = voz;
    }

    const pausaAntes = perfil.pausas[fala.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes);

    destacarFala(i);
    faladas++;
    setProgresso(Math.round((faladas / total) * 100));

    await falarComMicroPausas(fala.texto, perfil, voz);
  }

  if (!cancelar) {
    resetDestaques();
    setProgresso(100);
    setTimeout(() => {
      setBtnEstado(false);
      setProgresso(0);
      tocando = false;
    }, 800);
  }
}

/* ── Init ── */
carregarVozesComRetry(() => {
  detectarModo();
  elenco = sortearElenco();
  atualizarElenco();
});
</script>
