<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sala de Aula — Gestão de Pessoas | Concurso</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}

  :root{
    --bg:#0a0e1a;--bg-elev:#131a2b;--surface:rgba(148,163,184,.05);--surface-hover:rgba(148,163,184,.09);
    --border:rgba(148,163,184,.12);--border-strong:rgba(148,163,184,.22);
    --text:#cbd5e1;--text-dim:#94a3b8;--text-faint:#64748b;
    --accent:#8b5cf6;--accent-soft:rgba(139,92,246,.15);--accent-glow:rgba(139,92,246,.35);
    --page-bg:rgba(148,163,184,.04);--page-border:rgba(148,163,184,.14);
    --page-text:#cbd5e1;--page-text-strong:#e2e8f0;--enfase:#fbbf24;
    --shadow-lg:0 12px 32px rgba(0,0,0,.35);--shadow-xl:0 24px 64px rgba(0,0,0,.5);
    --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:24px;
    --font-tamanho:1.02rem;--transition:cubic-bezier(.2,.8,.3,1);
  }
  body[data-tema="claro"]{
    --bg:#f1f5f9;--bg-elev:#fff;--surface:rgba(15,23,42,.03);--surface-hover:rgba(15,23,42,.06);
    --border:rgba(15,23,42,.08);--border-strong:rgba(15,23,42,.15);
    --text:#334155;--text-dim:#64748b;--text-faint:#94a3b8;
    --accent:#7c3aed;--accent-soft:rgba(124,58,237,.12);
    --page-bg:#fff;--page-border:rgba(15,23,42,.06);--page-text:#1e293b;--page-text-strong:#0f172a;
    --enfase:#b45309;--shadow-lg:0 12px 32px rgba(15,23,42,.08);--shadow-xl:0 24px 64px rgba(15,23,42,.12);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Georgia,serif;
    background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;
    overflow-x:hidden;transition:background .4s var(--transition),color .4s var(--transition);
    padding-bottom:calc(env(safe-area-inset-bottom) + 140px);-webkit-font-smoothing:antialiased;
  }

  .app-titulo,.folha-titulo,.drawer-titulo,.secao-titulo{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.22em;
  }

  .app-header{
    position:sticky;top:0;z-index:100;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,var(--bg) 0%,transparent 100%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .app-titulo{font-size:.68rem;color:var(--text-dim);opacity:.8}

  .btn-icon{
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .2s var(--transition),background .2s;
    touch-action:manipulation;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .btn-icon:hover{background:var(--surface-hover)}
  .btn-icon:active{transform:scale(.92)}
  .btn-icon.sm{width:36px;height:36px}

  .conteudo{flex:1;padding:0 18px;display:flex;flex-direction:column;max-width:720px;margin:0 auto;width:100%}
  .folha{
    background:var(--page-bg);border:1px solid var(--page-border);border-radius:var(--r-lg);
    padding:22px 22px 26px;position:relative;box-shadow:var(--shadow-lg);
    transition:background .4s var(--transition),border-color .4s var(--transition),opacity .3s;
    font-family:Georgia,"Times New Roman",serif;font-size:var(--font-tamanho);line-height:1.75;
    color:var(--page-text);text-align:justify;hyphens:auto;-webkit-hyphens:auto;
    animation:fadeInUp .5s var(--transition);
  }
  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .folha::before{
    content:'';position:absolute;top:0;left:28px;right:28px;height:3px;
    background:linear-gradient(90deg,var(--accent),#2563eb);border-radius:0 0 3px 3px;opacity:.9;
  }
  .folha-header{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--page-border)}
  .folha-titulo{font-size:.62rem;letter-spacing:.24em;color:var(--text-dim);margin-bottom:10px}
  .folha-bolinhas{display:flex;justify-content:center;gap:6px}
  .bolinha{
    width:6px;height:6px;border-radius:50%;background:var(--border-strong);
    transition:background .3s var(--transition),transform .3s var(--transition);
  }
  .bolinha.ativa{background:var(--accent);transform:scale(1.5);box-shadow:0 0 8px var(--accent-glow)}

  .fala{
    display:inline;margin:0;padding:0;transition:background .3s,color .3s;
    cursor:pointer;border-radius:3px;
  }
  .fala::after{content:' '}
  .simbolo{
    font-weight:700;margin-right:3px;font-size:1em;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.9;
  }
  .fala.professor .simbolo{color:#a78bfa;font-size:1.1em;letter-spacing:.04em}
  .fala.aluno1 .simbolo{color:#60a5fa}
  .fala.aluno2 .simbolo{color:#fbbf24}
  .fala.aluno3 .simbolo{color:#34d399}
  .fala.aluno4 .simbolo{color:#f472b6}
  .fala.aluno5 .simbolo{color:#22d3ee}
  .fala.aluno6 .simbolo{color:#fb923c}
  .fala.aluno7 .simbolo{color:#c084fc}
  .fala.falando{background:var(--accent-soft);padding:1px 4px;margin:0 -4px;color:var(--page-text-strong);font-weight:500}
  .fala.falando .simbolo{opacity:1}
  .fala.falada{opacity:.35}
  .fala.futura{opacity:.92}
  .fala:hover{background:var(--accent-soft)}
  .enfase{color:var(--enfase);font-weight:700;font-style:italic;letter-spacing:.01em}
  .quebra{display:block;height:14px}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .35s var(--transition);z-index:9998;
  }
  .overlay.ativo{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);
    background:var(--bg-elev);border-left:1px solid var(--border);box-shadow:var(--shadow-xl);
    z-index:9999;transform:translateX(100%);transition:transform .4s var(--transition);
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .drawer.ativo{transform:translateX(0)}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  .drawer-titulo{font-size:.72rem;color:var(--text-dim)}

  .secao{margin-bottom:26px}
  .secao-titulo{font-size:.58rem;letter-spacing:.2em;color:var(--text-faint);margin-bottom:12px;padding-left:2px}

  .toggle-linha{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);cursor:pointer;transition:background .2s,border-color .2s;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  .toggle-linha:hover{background:var(--surface-hover)}
  .toggle-label{
    display:flex;align-items:center;gap:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.86rem;font-weight:500;color:var(--text);
  }
  .toggle-label .emoji{font-size:1.1rem}
  .switch{
    position:relative;width:44px;height:26px;background:var(--border-strong);
    border-radius:13px;transition:background .3s var(--transition);flex-shrink:0;
  }
  .switch::after{
    content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
    background:#fff;border-radius:50%;transition:transform .3s var(--transition);
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch.ativo{background:var(--accent)}
  .switch.ativo::after{transform:translateX(18px)}

  .fonte-controle{
    display:flex;align-items:center;gap:12px;padding:8px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  }
  .btn-fonte{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
    background:var(--bg-elev);color:var(--text);cursor:pointer;
    font-family:inherit;font-weight:700;font-size:.82rem;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s,transform .15s,border-color .2s;
    touch-action:manipulation;flex-shrink:0;
  }
  .btn-fonte:hover{background:var(--surface-hover);border-color:var(--border-strong)}
  .btn-fonte:active{transform:scale(.9)}
  .btn-fonte:disabled{opacity:.3;cursor:not-allowed}
  .fonte-barra{flex:1;height:4px;background:var(--border);border-radius:2px;position:relative;overflow:hidden}
  .fonte-barra-fill{
    position:absolute;top:0;left:0;bottom:0;
    background:linear-gradient(90deg,var(--accent),#2563eb);
    border-radius:2px;transition:width .3s var(--transition);
  }

  .blocos-lista{display:flex;flex-direction:column;gap:6px}
  .bloco-item{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    cursor:pointer;transition:background .2s,border-color .2s,transform .15s;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    text-align:left;color:var(--text);touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
  }
  .bloco-item:hover{background:var(--surface-hover)}
  .bloco-item:active{transform:scale(.98)}
  .bloco-item.ativo{background:var(--accent-soft);border-color:var(--accent)}
  .bloco-num{
    width:32px;height:32px;border-radius:50%;background:var(--border);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:.82rem;font-weight:700;flex-shrink:0;transition:background .2s,color .2s;
  }
  .bloco-item.ativo .bloco-num{background:var(--accent);color:#fff}
  .bloco-info{flex:1;min-width:0}
  .bloco-nome{font-size:.86rem;font-weight:600;color:var(--text);margin-bottom:2px}
  .bloco-item.ativo .bloco-nome{color:var(--accent)}
  .bloco-desc{font-size:.68rem;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bloco-check{color:var(--accent);font-size:1rem;flex-shrink:0;opacity:0;transition:opacity .2s}
  .bloco-item.ativo .bloco-check{opacity:1}

  #player{
    position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%);
    width:min(340px,calc(100vw - 32px));background:var(--bg-elev);
    border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);
    padding:8px 8px 10px;z-index:500;user-select:none;-webkit-user-select:none;touch-action:none;
    animation:fadeInUp .5s var(--transition);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .player-handle{height:14px;display:flex;align-items:center;justify-content:center;cursor:grab;margin-bottom:2px}
  .player-handle::before{content:'';width:32px;height:3px;background:var(--border-strong);border-radius:2px}
  .player-controles{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 4px}
  .btn-ctrl{
    border:none;background:transparent;color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:12px;
    transition:background .2s,transform .15s,color .2s;
    touch-action:manipulation;font-family:inherit;
  }
  .btn-ctrl:hover:not(:disabled){background:var(--surface-hover)}
  .btn-ctrl:active:not(:disabled){transform:scale(.9)}
  .btn-ctrl:disabled{opacity:.25;cursor:not-allowed}
  .btn-sec{width:40px;height:40px}
  .btn-play{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;
    box-shadow:0 6px 20px var(--accent-glow);
    transition:transform .2s var(--transition),background .3s,box-shadow .3s;
  }
  .btn-play:hover{transform:scale(1.05)}
  .btn-play:active{transform:scale(.95)}
  .btn-play.tocando{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:0 6px 20px rgba(220,38,38,.4);
  }
  .player-rodape{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 0;gap:8px}
  .btn-vel{
    padding:5px 10px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:.7rem;font-weight:700;color:var(--text-dim);background:var(--surface);
    border:1px solid var(--border);border-radius:8px;cursor:pointer;
    transition:background .2s,color .2s,border-color .2s;
    touch-action:manipulation;letter-spacing:.02em;
  }
  .btn-vel:hover{background:var(--surface-hover)}
  .btn-vel.ativa{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .player-progresso{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.66rem;font-weight:600;
    color:var(--text-faint);letter-spacing:.05em;
  }

  .toast{
    position:fixed;bottom:calc(env(safe-area-inset-bottom) + 120px);left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--bg-elev);color:var(--text);border:1px solid var(--border);
    padding:10px 18px;border-radius:99px;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:.78rem;font-weight:600;box-shadow:var(--shadow-lg);
    opacity:0;pointer-events:none;
    transition:opacity .3s var(--transition),transform .3s var(--transition);
    z-index:9997;white-space:nowrap;max-width:calc(100vw - 32px);
    overflow:hidden;text-overflow:ellipsis;
  }
  .toast.ativo{opacity:1;transform:translateX(-50%) translateY(0)}

  #debugPanel{
    position:fixed;top:12px;left:12px;right:12px;background:rgba(0,0,0,.95);
    border:1px solid #334155;border-radius:12px;padding:14px;color:#cbd5e1;
    font-family:ui-monospace,Menlo,monospace;font-size:.68rem;line-height:1.5;
    z-index:10000;max-height:70vh;overflow-y:auto;display:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  #debugPanel.ativo{display:block}
  #debugPanel h3{
    font-size:.72rem;color:#fbbf24;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  #debugPanel h3 button{
    background:#7c3aed;color:#fff;border:none;border-radius:6px;
    padding:4px 10px;font-size:.65rem;font-family:inherit;cursor:pointer;font-weight:700;
  }
  #debugPanel .linha{
    display:flex;justify-content:space-between;padding:3px 0;
    border-bottom:1px solid rgba(148,163,184,.1);
  }
  #debugPanel .linha.ativa{color:#fbbf24;font-weight:700}
  #debugPanel .voz{color:#93c5fd}
  #debugPanel .info{
    margin-top:10px;padding-top:10px;
    border-top:1px solid rgba(148,163,184,.15);
    color:#94a3b8;font-size:.62rem;
  }
  #debugPanel .aviso{
    margin-top:8px;padding:8px;background:rgba(220,38,38,.15);
    border-radius:6px;color:#fca5a5;font-size:.65rem;
  }
  #debugPanel .sucesso{
    margin-top:8px;padding:8px;background:rgba(34,197,94,.15);
    border-radius:6px;color:#86efac;font-size:.65rem;
  }

  @media(max-width:380px){
    .folha{padding:18px 16px 22px;font-size:.95rem}
    .conteudo{padding:0 14px}
    #player{width:calc(100vw - 24px)}
    .btn-sec{width:36px;height:36px}
    .btn-play{width:50px;height:50px}
  }
  @media(min-width:600px){
    .conteudo{padding:0 32px}
    .folha{padding:28px 32px 32px}
    #player{width:360px}
  }
  @media(min-width:900px){.folha{padding:32px 40px 36px}}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body data-tema="escuro">

<header class="app-header">
  <div class="app-titulo">Sala de Aula · Gestão de Pessoas</div>
  <button class="btn-icon" id="btnMenu" aria-label="Abrir menu" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
</header>

<div class="conteudo">
  <article class="folha" id="folha"></article>
</div>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-titulo">Menu</span>
    <button class="btn-icon sm" id="btnFechar" aria-label="Fechar menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>

  <section class="secao">
    <div class="secao-titulo">Aparência</div>
    <div class="toggle-linha" id="toggleTema">
      <div class="toggle-label">
        <span class="emoji" id="temaEmoji">🌙</span>
        <span id="temaLabel">Modo escuro</span>
      </div>
      <div class="switch" id="temaSwitch"></div>
    </div>
  </section>

  <section class="secao">
    <div class="secao-titulo">Tamanho do texto</div>
    <div class="fonte-controle">
      <button class="btn-fonte" id="btnFonteMenos" aria-label="Diminuir fonte">A−</button>
      <div class="fonte-barra"><div class="fonte-barra-fill" id="fonteBarraFill"></div></div>
      <button class="btn-fonte" id="btnFonteMais" aria-label="Aumentar fonte">A+</button>
    </div>
  </section>

  <section class="secao">
    <div class="secao-titulo">Blocos</div>
    <div class="blocos-lista" id="blocosLista"></div>
  </section>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="debugPanel">
  <h3>🎙️ Debug de Vozes <button type="button" onclick="fecharDebug()">Fechar</button></h3>
  <div id="debugElenco"></div>
</div>

<div id="player" role="region" aria-label="Controles de áudio">
  <div class="player-handle" id="handle"></div>
  <div class="player-controles">
    <button class="btn-ctrl btn-sec" id="btnCapAnterior" aria-label="Bloco anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.41 16.59L13.82 12l4.59-4.59L17 6l-6 6 6 6zM6 6h2v12H6z"/></svg>
    </button>
    <button class="btn-ctrl btn-sec" id="btnAnterior" aria-label="Fala anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn-ctrl btn-play" id="btnPlay" aria-label="Ouvir ou pausar" aria-pressed="false">
      <svg id="iconePlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn-ctrl btn-sec" id="btnProximo" aria-label="Próxima fala">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
    <button class="btn-ctrl btn-sec" id="btnCapProximo" aria-label="Próximo bloco">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5.59 7.41L10.18 12l-4.59 4.59L7 18l6-6-6-6zM16 6h2v12h-2z"/></svg>
    </button>
  </div>
  <div class="player-rodape">
    <button class="btn-vel" id="btnVel" aria-label="Velocidade">1.0×</button>
    <span class="player-progresso" id="playerProgresso">Bloco 1 / 3</span>
  </div>
</div>

<script>
'use strict';

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const synth = window.speechSynthesis || null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══════════ PREFS ══════════ */
const FONTES = [0.80, 0.88, 0.95, 1.02, 1.10, 1.20, 1.30, 1.45];
let prefTema = 'escuro', prefTamanho = 1.02, prefVelocidade = 1.0;
try {
  const t = localStorage.getItem('pref-tema');
  if (t === 'claro' || t === 'escuro') prefTema = t;
  const s = parseFloat(localStorage.getItem('pref-tamanho'));
  if (isFinite(s) && s >= 0.5 && s <= 2.0) prefTamanho = s;
  const v = parseFloat(localStorage.getItem('pref-velocidade'));
  if (isFinite(v) && v >= 0.5 && v <= 3.0) prefVelocidade = v;
} catch(e) {}
const salvarPrefs = () => {
  try {
    localStorage.setItem('pref-tema', prefTema);
    localStorage.setItem('pref-tamanho', String(prefTamanho));
    localStorage.setItem('pref-velocidade', String(prefVelocidade));
  } catch(e) {}
};

/* ══════════ TEMA ══════════ */
function aplicarTema() {
  document.body.setAttribute('data-tema', prefTema);
  $('temaEmoji').textContent = prefTema === 'claro' ? '☀️' : '🌙';
  $('temaLabel').textContent = prefTema === 'claro' ? 'Modo claro' : 'Modo escuro';
  $('temaSwitch').classList.toggle('ativo', prefTema === 'claro');
}
function alternarTema() {
  prefTema = prefTema === 'claro' ? 'escuro' : 'claro';
  salvarPrefs(); aplicarTema();
}

/* ══════════ FONTE ══════════ */
function indiceFonte() {
  let melhor = 0, menor = Math.abs(FONTES[0] - prefTamanho);
  for (let i = 1; i < FONTES.length; i++) {
    const d = Math.abs(FONTES[i] - prefTamanho);
    if (d < menor) { menor = d; melhor = i; }
  }
  return melhor;
}
function aplicarFonte() {
  const tam = (isFinite(prefTamanho) && prefTamanho > 0.3 && prefTamanho < 2.5) ? prefTamanho : 1.02;
  document.documentElement.style.setProperty('--font-tamanho', tam + 'rem');
  const i = indiceFonte();
  $('fonteBarraFill').style.width = ((i + 1) / FONTES.length) * 100 + '%';
  $('btnFonteMenos').disabled = i <= 0;
  $('btnFonteMais').disabled = i >= FONTES.length - 1;
}
function ajustarFonte(dir) {
  const i = indiceFonte();
  const novo = Math.max(0, Math.min(FONTES.length - 1, i + dir));
  if (novo === i) return;
  prefTamanho = FONTES[novo];
  salvarPrefs(); aplicarFonte();
}

/* ══════════ TOAST ══════════ */
let toastTimer = null;
function mostrarToast(txt) {
  const el = $('toast');
  el.textContent = txt;
  el.classList.add('ativo');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('ativo'), 1800);
}

/* ══════════ VOZES ══════════ */
let todasAsVozes = [], elenco = null, felipeEncontrado = false, iosDesbloqueado = false;

function carregarVozes(cb) {
  if (!synth) return cb();
  let jaChamou = false;
  const fim = () => { if (!jaChamou) { jaChamou = true; cb(); } };

  let v = speechSynthesis.getVoices();
  if (v.length) { todasAsVozes = v; return fim(); }

  const handler = () => {
    v = speechSynthesis.getVoices();
    if (v.length) {
      todasAsVozes = v;
      if (speechSynthesis.removeEventListener) speechSynthesis.removeEventListener('voiceschanged', handler);
      fim();
    }
  };
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', handler);
  else speechSynthesis.onvoiceschanged = handler;

  let t = 0;
  const poll = () => {
    t++;
    v = speechSynthesis.getVoices();
    if (v.length) { todasAsVozes = v; return fim(); }
    if (t < 30) setTimeout(poll, 200);
    else fim();
  };
  setTimeout(poll, 200);
}

const vozesPtBR = () => todasAsVozes.filter(v => {
  const l = (v.lang || '').toLowerCase().replace('_', '-');
  return l === 'pt-br' || l.startsWith('pt-br');
});

let tocando = false, pausado = false, cancelar = false;
let indiceCapitulo = 0, indiceAtual = 0, velocidade = prefVelocidade;

const aulaAtual = () => CAPITULOS[indiceCapitulo].aula;
const totalCaps  = () => CAPITULOS.length;
const falasValidas = aula => aula.filter(f => f.tipo !== 'pausa');

/* ══════════ iOS UNLOCK ══════════ */
function desbloquearIOS(forcar = false) {
  if (!isIOS || !synth) return;
  if (iosDesbloqueado && !forcar) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0.01; u.rate = 2.0; u.pitch = 1.0;
    if (elenco && elenco.professor) u.voice = elenco.professor;
    synth.speak(u);
    iosDesbloqueado = true;
  } catch(e) {}
}
document.addEventListener('touchstart', () => desbloquearIOS(), { once: true, passive: true });
document.addEventListener('click', () => desbloquearIOS(), { once: true });

/* ══════════ RENDER ══════════ */
function renderTexto(t) {
  return esc(String(t).replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' '))
    .replace(/\*([^*]+)\*/g, '<span class="enfase">$1</span>');
}

function renderCapitulo() {
  const el = $('folha');
  el.style.opacity = 0;
  setTimeout(() => {
    el.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'folha-header';
    const titulo = document.createElement('div');
    titulo.className = 'folha-titulo';
    titulo.textContent = CAPITULOS[indiceCapitulo].subtitulo;
    header.appendChild(titulo);

    const bolinhas = document.createElement('div');
    bolinhas.className = 'folha-bolinhas';
    for (let p = 0; p < totalCaps(); p++) {
      const b = document.createElement('div');
      b.className = 'bolinha' + (p === indiceCapitulo ? ' ativa' : '');
      bolinhas.appendChild(b);
    }
    header.appendChild(bolinhas);
    el.appendChild(header);

    aulaAtual().forEach((fala, i) => {
      if (fala.tipo === 'pausa') {
        const br = document.createElement('div');
        br.className = 'quebra';
        el.appendChild(br);
        return;
      }
      const div = document.createElement('div');
      div.className = 'fala ' + fala.papel + ' futura';
      div.id = 'fala-' + i;
      div.innerHTML = '<span class="simbolo">' + (SIMBOLOS[fala.papel] || '·') + '</span>' + renderTexto(fala.texto);
      div.addEventListener('click', () => irParaFala(i));
      el.appendChild(div);
    });

    el.style.opacity = 1;
    atualizarProgresso();
    atualizarBotoesNav();
  }, 150);
}

function irParaFala(idx) {
  const aula = aulaAtual();
  if (idx < 0 || idx >= aula.length || aula[idx].tipo === 'pausa') return;

  const tocava = tocando && !pausado;
  pararSilencioso();
  indiceAtual = idx;

  destacarFalas(idx);
  atualizarBotoesNav();

  if (tocava) setTimeout(tocarDeOndeParou, 80);
  else mostrarToast('📍 Fala ' + contarFalas(idx));
}

function contarFalas(idx) {
  const aula = aulaAtual();
  let n = 0;
  for (let k = 0; k <= idx && k < aula.length; k++) if (aula[k].tipo !== 'pausa') n++;
  return n + ' / ' + falasValidas(aula).length;
}

function destacarFalas(idx) {
  document.querySelectorAll('.fala').forEach(el => {
    const i = parseInt(el.id.replace('fala-', ''), 10);
    el.classList.remove('falando', 'falada', 'futura');
    el.classList.add(i < idx ? 'falada' : i === idx ? 'falando' : 'futura');
  });
  const atual = $('fala-' + idx);
  if (atual) {
    const r = atual.getBoundingClientRect();
    if (r.top < 100 || r.bottom > window.innerHeight - 220)
      atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function resetDestaques() {
  document.querySelectorAll('.fala').forEach(el => {
    el.classList.remove('falando', 'falada');
    el.classList.add('futura');
  });
}

/* ══════════ NAVEGAÇÃO ══════════ */
function irParaCapitulo(novo) {
  if (novo < 0 || novo >= totalCaps() || novo === indiceCapitulo) return;
  const tocava = tocando && !pausado;
  pararSilencioso();

  indiceCapitulo = novo;
  indiceAtual = 0;

  renderCapitulo();
  atualizarListaBlocos();
  mostrarToast('📖 ' + CAPITULOS[indiceCapitulo].subtitulo);

  if (tocava) setTimeout(tocarDeOndeParou, 400);
}
const pularCapitulo = dir => irParaCapitulo(indiceCapitulo + dir);

function atualizarProgresso() {
  $('playerProgresso').textContent = 'Bloco ' + (indiceCapitulo + 1) + ' / ' + totalCaps();
}

function atualizarListaBlocos() {
  const el = $('blocosLista');

    const item = document.createElement('button');
    item.className = 'bloco-item' + (i === indiceCapitulo ? ' ativo' : '');
    item.type = 'button';
    item.innerHTML =
      '<div class="bloco-num">' + (i + 1) + '</div>' +
      '<div class="bloco-info"><div class="bloco-nome">' + esc(cap.titulo) + '</div>' +
      '<div class="bloco-desc">' + esc(cap.subtitulo) + '</div></div>' +
      '<div class="bloco-check">✓</div>';
    item.addEventListener('click', () => {
      if (i === indiceCapitulo) return;
      irParaCapitulo(i);
      setTimeout(fecharMenu, 200);
    });
    el.appendChild(item);
  });
}

/* ══════════ UI ══════════ */
function setBtnEstado(playing) {
  const btn = $('btnPlay'), icone = $('iconePlay');
  btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  btn.classList.toggle('tocando', playing);
  icone.innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function atualizarBotoesNav() {
  const aula = aulaAtual();
  const ehPrimeiro = indiceCapitulo === 0;
  const ehUltimo   = indiceCapitulo === totalCaps() - 1;

  const temAnterior = aula.slice(0, indiceAtual).some(f => f.tipo !== 'pausa') || !ehPrimeiro;
  const temProximo  = aula.slice(indiceAtual + 1).some(f => f.tipo !== 'pausa') || !ehUltimo;

  $('btnAnterior').disabled = !temAnterior;
  $('btnProximo').disabled = !temProximo;
  $('btnCapAnterior').disabled = ehPrimeiro;
  $('btnCapProximo').disabled = ehUltimo;
}

/* ══════════ VELOCIDADE ══════════ */
const VELOCIDADES = [0.75, 1.0, 1.25, 1.5, 2.0];
function atualizarBtnVel() {
  const btn = $('btnVel');
  btn.textContent = velocidade.toFixed(2).replace(/0$/, '') + '×';
  btn.classList.toggle('ativa', velocidade !== 1.0);
}
function ciclarVelocidade() {
  const i = VELOCIDADES.indexOf(velocidade);
  velocidade = VELOCIDADES[(i + 1) % VELOCIDADES.length];
  prefVelocidade = velocidade;
  salvarPrefs(); atualizarBtnVel();
  mostrarToast('⚡ ' + velocidade.toFixed(2).replace(/0$/, '') + '×');
  if (tocando && !pausado) {
    const idx = indiceAtual;
    pararSilencioso();
    setTimeout(() => { indiceAtual = idx; tocarDeOndeParou(); }, 100);
  }
}

/* ══════════ PLAY / PAUSE ══════════ */
function togglePlay() {
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    mostrarToast('⚠️ Áudio não compatível com este navegador'); return;
  }
  desbloquearIOS();
  if (isIOS) desbloquearIOS(true);

  if (tocando && !pausado) {
    pausado = true; cancelar = true;
    try { synth.cancel(); } catch(e) {}
    setBtnEstado(false);
    return;
  }
  if (tocando && pausado) {
    pausado = false;
    setTimeout(tocarDeOndeParou, isIOS ? 150 : 60);
    return;
  }
  indiceAtual = 0;
  setTimeout(tocarDeOndeParou, isIOS ? 180 : 80);
}

function pararSilencioso() {
  cancelar = true;
  if (synth) { try { synth.cancel(); } catch(e) {} }
  tocando = false; pausado = false;
  setBtnEstado(false);
}

function pularFrase(dir) {
  const aula = aulaAtual();
  let novo = indiceAtual + dir;
  while (novo >= 0 && novo < aula.length && aula[novo].tipo === 'pausa') novo += dir;

  if (novo < 0) {
    if (indiceCapitulo > 0) {
      irParaCapitulo(indiceCapitulo - 1);
      const ant = aulaAtual();
      for (let i = ant.length - 1; i >= 0; i--)
        if (ant[i].tipo !== 'pausa') { indiceAtual = i; break; }
      destacarFalas(indiceAtual);
      atualizarBotoesNav();
    }
    return;
  }
  if (novo >= aula.length) {
    if (indiceCapitulo < totalCaps() - 1) pularCapitulo(1);
    else mostrarToast('✅ Fim do conteúdo');
    return;
  }

  const tocava = tocando && !pausado;
  pararSilencioso();
  indiceAtual = novo;
  destacarFalas(indiceAtual);
  atualizarBotoesNav();
  if (tocava) setTimeout(tocarDeOndeParou, 80);
}

/* ══════════ FALA ══════════ */
function dividirSegmentos(texto) {
  const segs = [];
  String(texto).split(/\s*\|\|\s*/).forEach((parte, iL) => {
    if (iL > 0) segs.push({ tipo:'pausaLonga' });
    parte.split(/\s*\|\s*/).forEach((p, iC) => {
      if (iC > 0) segs.push({ tipo:'pausaCurta' });
      if (!p.trim()) return;
      p.split(/(\*[^*]+\*)/g).forEach(frag => {
        if (!frag) return;
        if (frag.startsWith('*') && frag.endsWith('*'))
          segs.push({ tipo:'enfase', texto: frag.slice(1, -1).trim() });
        else if (frag.trim())
          segs.push({ tipo:'fala', texto: frag.trim() });
      });
    });
  });
  return segs;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    let ok = false;
    const fim = () => { if (!ok) { ok = true; resolve(); } };
    if (!synth) return fim();

    const u = new SpeechSynthesisUtterance(texto);
    u.lang = (voz && voz.lang) || 'pt-BR';
    u.rate = Math.max(0.1, Math.min(2.0, rate * velocidade));
    u.pitch = Math.max(0, Math.min(2.0, pitch));
    u.volume = (volume == null) ? 1.0 : volume;
    if (voz) u.voice = voz;
    u.onend = fim; u.onerror = fim;

    try { synth.speak(u); } catch(e) { return fim(); }
    setTimeout(fim, Math.max(3000, texto.length * 130 / u.rate));
  });
}

async function falarComMicroPausas(texto, perfil, voz) {
  for (const seg of dividirSegmentos(texto)) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') await esperar(perfil.microCurta / velocidade);
    else if (seg.tipo === 'pausaLonga') await esperar(perfil.microLonga / velocidade);
    else if (seg.tipo === 'enfase') await falar(seg.texto, perfil.rateEnfase, perfil.pitchEnfase, perfil.volume, voz);
    else if (seg.tipo === 'fala') await falar(seg.texto, perfil.rate, perfil.pitch, perfil.volume, voz);
  }
}

const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ══════════ LOOP ══════════ */
async function tocarDeOndeParou() {
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    mostrarToast('⚠️ Áudio não compatível com este navegador'); return;
  }
  if (!elenco || !elenco.professor) {
    mostrarToast('⚠️ Sem vozes pt-BR'); return;
  }

  const aula = aulaAtual();
  cancelar = false; tocando = true; pausado = false;
  setBtnEstado(true);

  const idxInicial = indiceAtual;

  for (let i = indiceAtual; i < aula.length; i++) {
    if (cancelar) return;
    indiceAtual = i;
    const fala = aula[i];

    if (fala.tipo === 'pausa') {
      await esperar(PERFIS.professor.pausas.pausa / velocidade);
      continue;
    }

    const voz = elenco[fala.papel] || elenco.professor;
    const perfil = PERFIS[fala.papel] || PERFIS.professor;

    const pausaAntes = perfil.pausas[fala.tipo] || 0;
    const ehPrimeira = (i === idxInicial);
    if (pausaAntes > 0 && !(isIOS && ehPrimeira)) {
      await esperar(pausaAntes / velocidade);
    }

    destacarFalas(i);
    atualizarBotoesNav();

    await falarComMicroPausas(fala.texto, perfil, voz);
    if (cancelar) return;
  }

  if (!cancelar) {
    resetDestaques();
    setBtnEstado(false);
    tocando = false; pausado = false;
    atualizarBotoesNav();
    mostrarToast(indiceCapitulo < totalCaps() - 1
      ? '✅ Fim do Bloco ' + (indiceCapitulo + 1) + ' — toque em ⇥'
      : '✅ Fim do conteúdo');
  }
}

/* ══════════ ARRASTE DO PLAYER ══════════ */
const player = $('player'), handle = $('handle');
let arrastando = false, moveu = false;
let sx = 0, sy = 0, sl = 0, st = 0;

function iniciarArraste(e) {
  if (e.target !== handle && !handle.contains(e.target)) return;
  arrastando = true; moveu = false;
  const r = player.getBoundingClientRect();
  sl = r.left; st = r.top;
  const p = e.touches ? e.touches[0] : e;
  sx = p.clientX; sy = p.clientY;
  player.style.left = sl + 'px';
  player.style.top = st + 'px';
  player.style.transform = 'none';
  player.style.bottom = 'auto';
  e.preventDefault();
}
function moverArraste(e) {
  if (!arrastando) return;
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - sx, dy = p.clientY - sy;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moveu = true;
  player.style.left = Math.max(8, Math.min(window.innerWidth - player.offsetWidth - 8, sl + dx)) + 'px';
  player.style.top  = Math.max(8, Math.min(window.innerHeight - player.offsetHeight - 8, st + dy)) + 'px';
}
function soltarArraste(e) {
  if (!arrastando) return;
  arrastando = false;
  if (e && e.preventDefault) e.preventDefault();
}
handle.addEventListener('mousedown', iniciarArraste);
document.addEventListener('mousemove', moverArraste);
document.addEventListener('mouseup', soltarArraste);
handle.addEventListener('touchstart', iniciarArraste, { passive: false });
document.addEventListener('touchmove', moverArraste, { passive: false });
document.addEventListener('touchend', soltarArraste);

/* ══════════ DEBUG ══════════ */
let toques = [];
function registrarToque() {
  if (moveu) return;
  const agora = Date.now();
  toques.push(agora);
  toques = toques.filter(t => agora - t < 700);
  if (toques.length === 3) {
    const dp = $('debugPanel');
    dp.classList.toggle('ativo');
    if (dp.classList.contains('ativo')) atualizarDebug();
    toques = [];
  }
}
handle.addEventListener('touchend', registrarToque);
handle.addEventListener('click', registrarToque);

function atualizarDebug() {
  const el = $('debugElenco');
  if (!elenco) { el.textContent = 'Elenco não montado.'; return; }

  const falaAtual = aulaAtual()[indiceAtual];
  const linhas = Object.entries(elenco).map(([papel, voz]) => {
    const ativa = (falaAtual && falaAtual.papel === papel) ? ' ativa' : '';
    const p = PERFIS[papel];
    return '<div class="linha' + ativa + '">' +
      '<span>' + esc(papel) + '</span>' +
      '<span class="voz">' + esc(voz.name) + ' · pitch ' + p.pitch.toFixed(2) + ' · rate ' + p.rate.toFixed(2) + '</span>' +
      '</div>';
  }).join('');

  const unicas = new Set(Object.values(elenco).map(v => v.name)).size;
  const ptBR = vozesPtBR().length;

  let aviso = '';
  if (isIOS && !felipeEncontrado)
    aviso = '<div class="aviso">📱 iPhone sem Felipe! Baixe em: Ajustes → Acessibilidade → Conteúdo Falado → Vozes → Português (Brasil) → Felipe.</div>';
  else if (isIOS && felipeEncontrado)
    aviso = '<div class="sucesso">✅ iPhone com Felipe!</div>';
  else if (unicas < 3)
    aviso = '<div class="aviso">⚠️ Só ' + unicas + ' vozes distintas. Instale mais em Ajustes.</div>';

  el.innerHTML = linhas +
    '<div class="info">Vozes únicas: ' + unicas + ' · pt-BR disponíveis: ' + ptBR + '<br>' +
    'Total exposto: ' + todasAsVozes.length + '<br>' +
    'Modo: ' + (isIOS ? 'iPhone/Safari' : 'Desktop/Microsoft') + '<br>' +
    'Felipe detectado: ' + (felipeEncontrado ? '✅ sim' : '❌ não') + '<br>' +
    'iOS desbloqueado: ' + (iosDesbloqueado ? '✅ sim' : '⏳ aguardando gesto') + '</div>' + aviso;
}
function fecharDebug() { $('debugPanel').classList.remove('ativo'); }

/* ══════════ ELENCO ══════════ */
function embaralhar(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const PRIORIDADE_PROF = [/felipe/i, /daniel/i, /antonio|antônio/i, /ricardo/i,
                         /lucas/i, /thiago/i, /paulo/i,
                         /microsoft.*(daniel|antonio|ricardo|felipe)/i, /google.*português/i];
const PRIORIDADE_FEM = [/maria/i, /francisca/i, /thalita|talita/i,
                        /luciana/i, /fernanda/i, /camila/i, /joana/i];

function escolherPorPrioridade(vozes, regexes, usadas = null) {
  for (const re of regexes) {
    const v = vozes.find(v => re.test(v.name) && (!usadas || !usadas.has(v)));
    if (v) return v;
  }
  return null;
}

function escolherVozProfessor(vozes) {
  const v = escolherPorPrioridade(vozes, PRIORIDADE_PROF);
  if (v) {
    felipeEncontrado = /felipe/i.test(v.name);
    return v;
  }
  const masc = vozes.filter(v =>
    /daniel|felipe|ricardo|lucas|joão|joao|carlos|pedro|paulo|thiago|mateus|gustavo|arthur|antonio|antônio|male|homem/i.test(v.name));
  return masc.length ? embaralhar(masc)[0] : embaralhar(vozes)[0];
}

function escolherVozAluna(vozes, usadas) {
  const v = escolherPorPrioridade(vozes, PRIORIDADE_FEM, usadas);
  if (v) return v;
  const fem = vozes.filter(v =>
    /maria|francisca|thalita|talita|luciana|fernanda|camila|joana|helena|mariana|ana|beatriz|carolina|female|mulher/i.test(v.name) && !usadas.has(v));
  return fem.length ? embaralhar(fem)[0] : null;
}

function distribuirElenco(vozes) {
  if (!vozes.length) return null;
  const professor = escolherVozProfessor(vozes);
  const usadas = new Set([professor]);
  const e = { professor };

  ['aluno1','aluno3','aluno5','aluno6'].forEach(p => {
    const v = escolherVozAluna(vozes, usadas);
    if (v) { e[p] = v; usadas.add(v); }
  });

  const restantes = embaralhar(vozes.filter(v => !usadas.has(v)));
  PAPEIS_ALUNO.filter(p => !e[p]).forEach((p, i) => {
    e[p] = restantes.length ? restantes[i % restantes.length] : embaralhar(vozes)[i % vozes.length];
  });
  return e;
}

function ajustarPerfilProfessor() {
  if (!isIOS) return;
  if (!felipeEncontrado) {
    PERFIS.professor.rate = 0.85;
    PERFIS.professor.pitch = 0.70;
    PERFIS.professor.rateEnfase = 0.79;
    PERFIS.professor.pitchEnfase = 0.68;
    Object.assign(PERFIS.professor.pausas, {
      abertura:950, definicao:490, pergunta:320, confirmacao:420,
      guarde:1120, conclusao:860, atencao_banca:780, pausa:670
    });
  } else {
    PERFIS.professor.rate = 0.88;
    PERFIS.professor.pitch = 0.78;
    PERFIS.professor.rateEnfase = 0.82;
    PERFIS.professor.pitchEnfase = 0.75;
  }
}

/* ══════════ INIT ══════════ */
aplicarTema();
aplicarFonte();
atualizarBtnVel();
atualizarListaBlocos();

$('btnMenu').addEventListener('click', abrirMenu);
$('btnFechar').addEventListener('click', fecharMenu);
$('overlay').addEventListener('click', fecharMenu);
$('toggleTema').addEventListener('click', alternarTema);
$('btnFonteMenos').addEventListener('click', () => ajustarFonte(-1));
$('btnFonteMais').addEventListener('click', () => ajustarFonte(1));
$('btnPlay').addEventListener('click', togglePlay);
$('btnAnterior').addEventListener('click', () => pularFrase(-1));
$('btnProximo').addEventListener('click', () => pularFrase(1));
$('btnCapAnterior').addEventListener('click', () => pularCapitulo(-1));
$('btnCapProximo').addEventListener('click', () => pularCapitulo(1));
$('btnVel').addEventListener('click', ciclarVelocidade);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharMenu();
  if (e.key === ' ' && !e.target.matches('button, input, textarea')) { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') pularFrase(1);
  if (e.key === 'ArrowLeft') pularFrase(-1);
});

renderCapitulo();

carregarVozes(() => {
  const ptBR = vozesPtBR();
  if (ptBR.length === 0) {
    if (todasAsVozes.length > 0) elenco = distribuirElenco(todasAsVozes);
    atualizarBotoesNav();
    return;
  }
  elenco = distribuirElenco(ptBR);
  ajustarPerfilProfessor();
  atualizarBotoesNav();
});
</script>
