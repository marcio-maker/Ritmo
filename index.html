<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diálogos Sortidos — RH</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }

  .tabs {
    display: flex; gap: 6px; padding: 16px 18px 0; overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: 68px; padding: 10px 6px;
    border: none; border-radius: 9px;
    font-size: .78rem; font-weight: 700; font-family: inherit;
    cursor: pointer; background: #1e293b; color: #64748b;
    transition: background .15s, color .15s; white-space: nowrap;
  }
  .tab.ativa { background: #1e3a8a; color: #fff; }

  .paineis { flex: 1; padding: 14px 18px 0; overflow: hidden; position: relative; }
  .painel { display: none; flex-direction: column; gap: 10px; height: 100%; }
  .painel.ativo { display: flex; }

  .heading {
    font-size: .95rem; font-weight: 700; color: #93c5fd;
    padding-left: 2px;
  }

  .texto-bloco {
    background: #1e293b; border-radius: 12px; padding: 14px;
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  /* Balões */
  .fala {
    display: flex; gap: 8px; margin-bottom: 10px;
    align-items: flex-start;
    transition: opacity .2s;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem; font-weight: 800; flex-shrink: 0;
    color: #fff;
  }
  .fala.vozA .avatar { background: #3b82f6; }
  .fala.vozB .avatar { background: #f59e0b; }

  .balao {
    flex: 1; padding: 8px 12px; border-radius: 12px;
    font-size: .88rem; line-height: 1.5;
    background: #0f172a; color: #cbd5e1;
    border: 1px solid #334155;
    transition: background .15s, border-color .15s, color .15s;
  }
  .fala.vozA .balao { border-top-left-radius: 4px; }
  .fala.vozB .balao { border-top-right-radius: 4px; }

  .fala.falando .balao {
    background: #1e3a8a; border-color: #3b82f6; color: #fff;
  }
  .fala.vozB.falando .balao {
    background: #78350f; border-color: #f59e0b; color: #fff;
  }
  .fala.falada { opacity: .45; }
  .fala.futura { opacity: .65; }

  .quebra { height: 8px; }

  .player { padding: 10px 0 0; }
  .btn-play {
    width: 100%; min-height: 52px; border: none; border-radius: 12px;
    font-size: .95rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: opacity .15s, transform .1s;
    background: #2563eb; color: #fff;
  }
  .btn-play:active { opacity: .8; transform: scale(.97); }
  .btn-play.tocando { background: #dc2626; }

  .voz-info {
    font-size: .68rem; color: #475569; text-align: center;
    padding: 8px 0 10px; font-weight: 600; line-height: 1.5;
  }
  .voz-info .tagA { color: #60a5fa; font-weight: 700; }
  .voz-info .tagB { color: #fbbf24; font-weight: 700; }

  .progresso-wrap {
    margin-top: 8px; height: 4px; background: #1e293b;
    border-radius: 2px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: #2563eb; border-radius: 2px;
    width: 0%; transition: width .3s;
  }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab ativa" data-v="b1" onclick="trocarTab('b1')">Bloco 1</button>
  <button class="tab" data-v="b2" onclick="trocarTab('b2')">Bloco 2</button>
  <button class="tab" data-v="b3" onclick="trocarTab('b3')">Bloco 3</button>
</div>

<div class="paineis" id="paineis"></div>

<script>
/* =====================================================
   1. DETECÇÃO DE VOZES
   ===================================================== */
let todasAsVozes = [];
let vozesCarregadas = false;

function carregarVozesComRetry(callback) {
  let tentativas = 0;
  function tentar() {
    tentativas++;
    const vozes = window.speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      vozesCarregadas = true;
      callback();
      return;
    }
    if (tentativas < 50) setTimeout(tentar, 100);
    else callback();
  }
  if (window.speechSynthesis.addEventListener) {
    try { window.speechSynthesis.addEventListener('voiceschanged', tentar); }
    catch (e) { window.speechSynthesis.onvoiceschanged = tentar; }
  } else {
    window.speechSynthesis.onvoiceschanged = tentar;
  }
  tentar();
}

function vozesPtBR() {
  return todasAsVozes.filter(v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    return lang === 'pt-br' || lang.startsWith('pt-br');
  });
}

/* Sorteia 2 vozes diferentes (prioriza M+F se possível) */
function sortearDuasVozes() {
  const pt = vozesPtBR();
  if (pt.length === 0) return { A: null, B: null };
  if (pt.length === 1) return { A: pt[0], B: pt[0] };

  const masculinas = pt.filter(v => /felipe|daniel|antonio|antônio|marcos|paulo|ricardo|joão|joao|carlos|bruno|thiago|tiago|eduardo|hugo/i.test(v.name));
  const femininas = pt.filter(v => /luciana|fernanda|thalita|francisca|maria|joana|catarina|ana|helena|beatriz|camila|julia|júlia|leticia|letícia|patricia|patrícia/i.test(v.name));

  let A, B;
  if (masculinas.length > 0 && femininas.length > 0) {
    A = masculinas[Math.floor(Math.random() * masculinas.length)];
    B = femininas[Math.floor(Math.random() * femininas.length)];
  } else {
    // Sorteia 2 diferentes
    const idxA = Math.floor(Math.random() * pt.length);
    let idxB = Math.floor(Math.random() * pt.length);
    while (idxB === idxA && pt.length > 1) {
      idxB = Math.floor(Math.random() * pt.length);
    }
    A = pt[idxA];
    B = pt[idxB];
  }
  return { A, B };
}

/* =====================================================
   2. DIÁLOGOS — 3 Blocos em formato de conversa
   voz 'A' = quem explica · voz 'B' = quem reage
   " | " = micro-pausa curta · " || " = micro-pausa longa
   ===================================================== */
const BLOCOS = [
  {
    id: "b1",
    heading: "O que é gestão de pessoas",
    dialogo: [
      { voz:'A', tipo:'abertura',  texto:"Gestão de pessoas é a área responsável pelo ser humano no trabalho." },
      { voz:'B', tipo:'definicao', texto:"Entendi. Então ela cuida de tudo que envolve gente dentro da empresa." },
      { voz:'A', tipo:'definicao', texto:"Exatamente. Ela atrai, desenvolve, motiva | e mantém as pessoas na empresa." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"E isso sempre foi assim?" },
      { voz:'A', tipo:'definicao', texto:"Não. Durante muito tempo, essa área foi vista apenas como operacional." },
      { voz:'A', tipo:'definicao', texto:"Cuidava de folha de pagamento, ponto, férias e documentação." },
      { voz:'B', tipo:'definicao', texto:"Ah, o setor que resolvia papelada." },
      { voz:'A', tipo:'definicao', texto:"Isso mesmo." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"E hoje, o que mudou?" },
      { voz:'A', tipo:'definicao', texto:"Hoje o cenário mudou. || A gestão de pessoas passou a ser estratégica." },
      { voz:'A', tipo:'definicao', texto:"Ela participa das decisões importantes da organização." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"Então tem diferença entre gestão de pessoas | e gestão de recursos humanos?" },
      { voz:'A', tipo:'definicao', texto:"Tem. || Gestão de recursos humanos é o nome mais antigo." },
      { voz:'A', tipo:'definicao', texto:"Ligado à ideia de que pessoas são recursos, como máquinas ou dinheiro." },
      { voz:'A', tipo:'definicao', texto:"Gestão de pessoas é o nome mais moderno, que enxerga o ser humano como parceiro da organização." },
      { voz:'B', tipo:'definicao', texto:"Faz sentido. O nome muda, a mentalidade muda também." },
      { tipo:'pausa' },
      { voz:'A', tipo:'guarde',    texto:"Guarde isto." },
      { voz:'A', tipo:'guarde',    texto:"Gestão de pessoas é a área que cuida do ser humano no trabalho." },
      { voz:'B', tipo:'guarde',    texto:"E quando ela é estratégica, deixa de apenas resolver problemas." },
      { voz:'A', tipo:'guarde',    texto:"E passa a construir resultados." }
    ]
  },
  {
    id: "b2",
    heading: "Gestão estratégica de pessoas",
    dialogo: [
      { voz:'A', tipo:'abertura',  texto:"A gestão estratégica de pessoas é quando a área de recursos humanos deixa de agir só no operacional." },
      { voz:'B', tipo:'definicao', texto:"Então ela passa a participar do planejamento da organização." },
      { voz:'A', tipo:'definicao', texto:"Exatamente." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"E o que isso significa na prática?" },
      { voz:'A', tipo:'definicao', texto:"Significa alinhar as políticas de pessoas aos objetivos do negócio." },
      { voz:'A', tipo:'definicao', texto:"Se a empresa quer crescer, o setor de pessoas precisa preparar a equipe para esse crescimento." },
      { voz:'A', tipo:'definicao', texto:"Se a empresa quer inovar, precisa contratar e desenvolver pessoas com esse perfil." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"E quais são as frentes de trabalho dela?" },
      { voz:'A', tipo:'definicao', texto:"São quatro frentes principais." },
      { voz:'A', tipo:'definicao', texto:"Primeiro, atrai talentos. Segundo, desenvolve esses talentos." },
      { voz:'A', tipo:'definicao', texto:"Terceiro, mantém as pessoas boas na empresa. || Quarto, garante que tudo isso esteja ligado à estratégia." },
      { voz:'B', tipo:'definicao', texto:"Entendi. Então não é só contratar e pagar." },
      { voz:'A', tipo:'definicao', texto:"Não. É pensar no presente e no futuro da organização." },
      { tipo:'pausa' },
      { voz:'A', tipo:'guarde',    texto:"Guarde isto." },
      { voz:'A', tipo:'guarde',    texto:"Gestão estratégica de pessoas é alinhar gente e negócio." },
      { voz:'B', tipo:'guarde',    texto:"Não é só contratar e pagar." },
      { voz:'A', tipo:'guarde',    texto:"É pensar no presente e no futuro da organização." }
    ]
  },
  {
    id: "b3",
    heading: "Recrutamento",
    dialogo: [
      { voz:'A', tipo:'abertura',  texto:"Recrutamento é o processo de atrair candidatos para uma vaga." },
      { voz:'B', tipo:'definicao', texto:"Então é a etapa em que a empresa vai ao mercado buscar pessoas." },
      { voz:'A', tipo:'definicao', texto:"Isso. Buscar pessoas com potencial para ocupar determinada função." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"E recrutamento é a mesma coisa que seleção?" },
      { voz:'A', tipo:'definicao', texto:"Não. || Muita gente confunde, mas são coisas diferentes." },
      { voz:'A', tipo:'definicao', texto:"Recrutamento atrai. Seleção escolhe." },
      { voz:'B', tipo:'definicao', texto:"São duas etapas diferentes, uma depois da outra." },
      { voz:'A', tipo:'definicao', texto:"Exatamente." },
      { tipo:'pausa' },
      { voz:'B', tipo:'definicao', texto:"E quais são os tipos de recrutamento?" },
      { voz:'A', tipo:'definicao', texto:"Existem dois tipos principais. || O recrutamento interno | e o recrutamento externo." },
      { voz:'B', tipo:'definicao', texto:"E qual é a diferença?" },
      { voz:'A', tipo:'definicao', texto:"O interno busca candidatos dentro da própria empresa. O externo busca no mercado." },
      { voz:'B', tipo:'definicao', texto:"Entendi. Um olha para dentro, o outro para fora." },
      { voz:'A', tipo:'definicao', texto:"Isso mesmo." },
      { tipo:'pausa' },
      { voz:'A', tipo:'guarde',    texto:"Guarde isto." },
      { voz:'A', tipo:'guarde',    texto:"Recrutamento é atrair." },
      { voz:'B', tipo:'guarde',    texto:"E a escolha entre interno e externo depende do momento da empresa." },
      { voz:'A', tipo:'guarde',    texto:"E do tipo de vaga." }
    ]
  }
];

/* =====================================================
   3. PERFIL V6b — Palestrante inspirador
   ===================================================== */
const V6B = {
  base: { rate: 0.88, pitch: 0.96, volume: 1.0 },
  pausas: {
    abertura:700, definicao:400, lista:180, exemplo:220,
    conclusao:500, guarde:800, pausa:650
  },
  ratePorTipo: {
    abertura:0.86, definicao:0.90, lista:0.92,
    exemplo:0.90, conclusao:0.84, guarde:0.80
  },
  pitchPorTipo: {
    abertura:0.98, definicao:0.96, lista:0.96,
    exemplo:0.98, conclusao:0.92, guarde:0.90
  },
  volumePorTipo: {
    abertura:1.0, definicao:1.0, lista:0.98,
    exemplo:0.96, conclusao:1.0, guarde:0.90
  },
  microCurta: 120, microLonga: 220
};

let synth = window.speechSynthesis;
let tocando = null;
let cancelar = false;
let modoContinuo = true;

/* Armazena o par de vozes sorteado para cada bloco */
const vozesPorBloco = {};

/* ── Render ── */
const paineisEl = document.getElementById('paineis');

function renderTextoLegivel(texto) {
  return texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
}

function renderTodos() {
  paineisEl.innerHTML = '';
  BLOCOS.forEach((bloco, idx) => {
    const painel = document.createElement('div');
    painel.className = 'painel' + (idx === 0 ? ' ativo' : '');
    painel.id = 'painel-' + bloco.id;

    const heading = document.createElement('div');
    heading.className = 'heading';
    heading.textContent = bloco.heading;
    painel.appendChild(heading);

    const texto = document.createElement('div');
    texto.className = 'texto-bloco';
    texto.id = 'texto-' + bloco.id;
    bloco.dialogo.forEach((fala, i) => {
      if (fala.tipo === 'pausa') {
        const br = document.createElement('div');
        br.className = 'quebra';
        texto.appendChild(br);
        return;
      }
      const div = document.createElement('div');
      div.className = 'fala voz' + fala.voz + ' futura';
      div.id = bloco.id + '-f-' + i;
      div.innerHTML = `
        <div class="avatar">${fala.voz}</div>
        <div class="balao">${renderTextoLegivel(fala.texto)}</div>
      `;
      texto.appendChild(div);
    });
    painel.appendChild(texto);

    const player = document.createElement('div');
    player.className = 'player';
    player.innerHTML = `
      <button class="btn-play" id="btn-${bloco.id}" onclick="togglePlay('${bloco.id}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Ouvir diálogo
      </button>
      <div class="progresso-wrap"><div class="progresso-fill" id="prog-${bloco.id}"></div></div>
      <div class="voz-info" id="voz-${bloco.id}">🎙 Sorteando vozes...</div>
    `;
    painel.appendChild(player);

    paineisEl.appendChild(painel);
  });

  // Sorteia as vozes para cada bloco assim que renderiza
  setTimeout(sortearVozesDeTodos, 300);
  setTimeout(sortearVozesDeTodos, 1500);
}
renderTodos();

function sortearVozesDeTodos() {
  if (!vozesCarregadas) return;
  BLOCOS.forEach(bloco => {
    if (!vozesPorBloco[bloco.id]) {
      vozesPorBloco[bloco.id] = sortearDuasVozes();
    }
  });
  atualizarInfoVozes();
}

function atualizarInfoVozes() {
  BLOCOS.forEach(bloco => {
    const par = vozesPorBloco[bloco.id];
    const el = document.getElementById('voz-' + bloco.id);
    if (!el || !par) return;
    if (par.A && par.B) {
      el.innerHTML = `
        <span class="tagA">A (explica):</span> ${par.A.name}<br>
        <span class="tagB">B (reage):</span> ${par.B.name}
      `;
    } else {
      el.textContent = '⚠️ Nenhuma voz pt-BR detectada';
    }
  });
}

/* ── Tabs ── */
function trocarTab(v) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('ativa', t.dataset.v === v));
  document.querySelectorAll('.painel').forEach(p => p.classList.toggle('ativo', p.id === 'painel-' + v));
  if (tocando && tocando !== v) pararTudo();
}

/* ── Player ── */
function togglePlay(id) {
  if (tocando === id) { pararTudo(); return; }
  if (tocando) pararTudo();
  tocarBloco(id);
}

function pararTudo() {
  cancelar = true;
  synth.cancel();
  if (tocando) {
    setBtnEstado(tocando, false);
    resetDestaques(tocando);
    setProgresso(tocando, 0);
  }
  tocando = null;
}

function setBtnEstado(id, playing) {
  const btn = document.getElementById('btn-' + id);
  if (!btn) return;
  if (playing) {
    btn.className = 'btn-play tocando';
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Parar`;
  } else {
    btn.className = 'btn-play';
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/></svg> Ouvir diálogo`;
  }
}

function setProgresso(id, pct) {
  const el = document.getElementById('prog-' + id);
  if (el) el.style.width = pct + '%';
}

function resetDestaques(id) {
  document.querySelectorAll('#' + id + '-f-0, [id^="' + id + '-f-"]').forEach(el => {
    if (el.classList.contains('fala')) {
      el.classList.remove('falando', 'falada');
      el.classList.add('futura');
    }
  });
}

function destacarFala(id, idx) {
  document.querySelectorAll('[id^="' + id + '-f-"]').forEach(el => {
    if (!el.classList.contains('fala')) return;
    const numIdx = parseInt(el.id.replace(id + '-f-', ''));
    el.classList.remove('falando', 'falada', 'futura');
    if (numIdx < idx) el.classList.add('falada');
    else if (numIdx === idx) el.classList.add('falando');
    else el.classList.add('futura');
  });
  const atual = document.getElementById(id + '-f-' + idx);
  if (atual) atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ── Micro-pausas ── */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) segmentos.push({ tipo:'fala', texto:p.trim() });
    });
  });
  return segmentos;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume ?? 1.0;
    if (voz) u.voice = voz;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
  });
}

async function falarComMicroPausas(textoOriginal, rate, pitch, volume, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(V6B.microCurta);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(V6B.microLonga);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, rate, pitch, volume, voz);
    }
  }
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function forcarTrocaVoz(voz) {
  synth.cancel();
  await esperar(150);
  await falar(' ', 1.0, 1.0, 1.0, voz);
  await esperar(250);
}

async function tocarBloco(id) {
  const bloco = BLOCOS.find(b => b.id === id);
  if (!bloco) return;

  if (!vozesCarregadas) {
    carregarVozesComRetry(() => {
      sortearVozesDeTodos();
      tocarBloco(id);
    });
    return;
  }

  // Garante que existe um par de vozes sorteado para este bloco
  if (!vozesPorBloco[id]) {
    vozesPorBloco[id] = sortearDuasVozes();
    atualizarInfoVozes();
  }
  const par = vozesPorBloco[id];
  if (!par.A || !par.B) {
    alert('Nenhuma voz pt-BR detectada.');
    return;
  }

  cancelar = false;
  tocando = id;
  setBtnEstado(id, true);
  resetDestaques(id);

  const total = bloco.dialogo.filter(d => d.tipo !== 'pausa').length;
  let faladas = 0;
  let ultimaVoz = null;

  for (let i = 0; i < bloco.dialogo.length; i++) {
    if (cancelar) return;
    const fala = bloco.dialogo[i];

    if (fala.tipo === 'pausa') {
      await esperar(V6B.pausas.pausa);
      continue;
    }

    const voz = (fala.voz === 'A') ? par.A : par.B;

    // Força troca de voz ao mudar de A para B (workaround iOS)
    if (ultimaVoz !== fala.voz) {
      await forcarTrocaVoz(voz);
      if (cancelar) return;
      ultimaVoz = fala.voz;
    }

    const pausaAntes = V6B.pausas[fala.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes);

    const rate   = V6B.ratePorTipo[fala.tipo]   ?? V6B.base.rate;
    const pitch  = V6B.pitchPorTipo[fala.tipo]  ?? V6B.base.pitch;
    const volume = V6B.volumePorTipo[fala.tipo] ?? V6B.base.volume;

    destacarFala(id, i);
    faladas++;
    setProgresso(id, Math.round((faladas / total) * 100));

    await falarComMicroPausas(fala.texto, rate, pitch, volume, voz);
  }

  if (cancelar) return;

  resetDestaques(id);
  setProgresso(id, 100);
  setBtnEstado(id, false);

  await esperar(600);

  // MODO CONTÍNUO: emenda no próximo bloco (com NOVAS vozes sorteadas)
  if (modoContinuo) {
    const idxAtual = BLOCOS.findIndex(b => b.id === id);
    const proximoIdx = idxAtual + 1;

    if (proximoIdx < BLOCOS.length) {
      const proximoBloco = BLOCOS[proximoIdx];
      // Sorteia novas vozes para o próximo bloco
      vozesPorBloco[proximoBloco.id] = sortearDuasVozes();
      atualizarInfoVozes();

      trocarTab(proximoBloco.id);
      setProgresso(id, 0);
      if (tocando === id) tocando = null;
      setTimeout(() => tocarBloco(proximoBloco.id), 500);
      return;
    }
  }

  setProgresso(id, 0);
  if (tocando === id) tocando = null;
}

/* ── Init ── */
carregarVozesComRetry(() => {
  sortearVozesDeTodos();
});
</script>
