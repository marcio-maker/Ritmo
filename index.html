<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sala de Aula — RH Bloco 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    background: #0f172a;
    color: #cbd5e1;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 150px);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .conteudo {
    flex: 1;
    padding: 24px 22px 0;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  /* ============================================
     FOLHA (que expande)
     ============================================ */
  .texto-bloco {
    font-size: 1.02rem;
    line-height: 1.75;
    color: #cbd5e1;
    background: rgba(148, 163, 184, .06);
    border: 1px solid rgba(148, 163, 184, .12);
    border-radius: 14px;
    padding: 16px 18px 20px;
    position: relative;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    min-height: 260px;
    text-align: justify;
    hyphens: auto;
    -webkit-hyphens: auto;
    transition: background .3s, color .3s, opacity .25s;
  }

  /* Tema claro */
  body[data-tema="claro"] .texto-bloco {
    background: #f8fafc;
    color: #1e293b;
  }
  body[data-tema="claro"] .enfase { color: #b45309; }
  body[data-tema="claro"] .fala.falando {
    background: rgba(124, 58, 237, .12);
    color: #0f172a;
  }
  body[data-tema="claro"] .titulo-capitulo {
    color: #64748b;
    border-bottom-color: rgba(100, 116, 139, .2);
  }
  body[data-tema="claro"] .aba {
    color: #64748b;
  }
  body[data-tema="claro"] .aba.ativa {
    color: #7c3aed;
    border-bottom-color: #7c3aed;
  }
  body[data-tema="claro"] .bolinha-pagina {
    background: rgba(100, 116, 139, .3);
  }

  /* ── Abas de capítulo ─────────────── */
  .abas-capitulos {
    display: flex;
    gap: 4px;
    margin: -8px -18px 12px -18px;
    padding: 0 12px;
    border-bottom: 1px solid rgba(148, 163, 184, .15);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .abas-capitulos::-webkit-scrollbar { display: none; }
  .aba {
    flex: 0 0 auto;
    padding: 8px 10px;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #64748b;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: color .2s, border-color .2s;
    touch-action: manipulation;
  }
  .aba.ativa {
    color: #a78bfa;
    border-bottom-color: #7c3aed;
  }
  .aba:active { opacity: .7; }

  /* Cabeçalho do capítulo */
  .titulo-capitulo {
    display: block;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .62rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 0 0 10px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(148, 163, 184, .2);
  }

  /* Indicador de páginas (bolinhas) */
  .bolinhas-pagina {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 0 0 14px 0;
  }
  .bolinha-pagina {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(148, 163, 184, .3);
    transition: background .3s, transform .3s;
  }
  .bolinha-pagina.ativa {
    background: #7c3aed;
    transform: scale(1.4);
  }

  /* Falas — fluem como texto corrido */
  .fala {
    display: inline;
    margin: 0;
    padding: 0;
    transition: background .25s, color .25s;
    cursor: pointer;
  }
  .fala::after { content: ' '; }

  .simbolo {
    font-weight: 700;
    margin-right: 3px;
    font-size: 1em;
    opacity: .9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .fala.professor .simbolo { color: #a78bfa; font-size: 1.1em; letter-spacing: .04em; }
  .fala.aluno1 .simbolo   { color: #60a5fa; }
  .fala.aluno2 .simbolo   { color: #fbbf24; }
  .fala.aluno3 .simbolo   { color: #34d399; }
  .fala.aluno4 .simbolo   { color: #f472b6; }
  .fala.aluno5 .simbolo   { color: #22d3ee; }
  .fala.aluno6 .simbolo   { color: #fb923c; }
  .fala.aluno7 .simbolo   { color: #c084fc; }

  .fala.falando {
    background: rgba(124, 58, 237, .22);
    border-radius: 3px;
    padding: 1px 4px;
    margin: 0 -4px;
    color: #f1f5f9;
    font-weight: 500;
  }
  .fala.falando .simbolo { font-size: 1.1em; opacity: 1; }

  .fala.falada { opacity: .42; }
  .fala.futura { opacity: .92; }
  .fala:hover { background: rgba(124, 58, 237, .1); border-radius: 3px; }

  .enfase {
    color: #fbbf24;
    font-weight: 700;
    font-style: italic;
    letter-spacing: .01em;
  }

  .quebra { display: block; height: 12px; }

  /* ============================================
     TOOLBAR
     ============================================ */
  .toolbar {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    right: 12px;
    display: flex;
    gap: 5px;
    z-index: 9998;
  }
  .toolbar button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(148, 163, 184, .2);
    background: rgba(15, 23, 42, .92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #cbd5e1;
    font-size: .82rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s, background .2s;
    font-family: inherit;
    touch-action: manipulation;
  }
  .toolbar button:active { transform: scale(.9); }
  .toolbar button:disabled { opacity: .35; cursor: not-allowed; }

  /* ============================================
     PLAYER
     ============================================ */
  #playerFlutuante {
    position: fixed;
    z-index: 9999;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    background: rgba(15, 23, 42, .97);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(148, 163, 184, .18);
    border-radius: 18px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
    padding: 10px 10px 12px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: box-shadow .2s, opacity .2s;
  }
  #playerFlutuante.arrastando {
    box-shadow: 0 20px 48px rgba(0, 0, 0, .7), 0 0 0 2px rgba(124, 58, 237, .5);
    opacity: .96;
  }
  .handle {
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    margin-bottom: 4px;
    touch-action: none;
  }
  .handle::before {
    content: '';
    width: 36px;
    height: 4px;
    background: #475569;
    border-radius: 2px;
    transition: background .15s;
  }
  #playerFlutuante.arrastando .handle::before { background: #7c3aed; }
  .controles {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .btn-ctrl {
    border: none;
    background: #1e293b;
    color: #cbd5e1;
    font-family: inherit;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s, color .15s;
    touch-action: manipulation;
  }
  .btn-ctrl:active { transform: scale(.92); }
  .btn-ctrl:disabled { opacity: .3; }
  .btn-sec { width: 38px; height: 38px; font-size: .9rem; }
  .btn-pagina {
    background: #312e81;
    color: #c7d2fe;
  }
  .btn-pagina:not(:disabled):hover { background: #3730a3; }
  .btn-play-flut {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    font-size: 1.3rem;
    box-shadow: 0 6px 18px rgba(37, 99, 235, .4);
  }
  .btn-play-flut.tocando {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    box-shadow: 0 6px 18px rgba(220, 38, 38, .4);
  }
  .rodape {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding: 0 4px;
    gap: 6px;
  }
  .btn-vel {
    padding: 6px 10px;
    font-size: .72rem;
    background: #1e293b;
    color: #93c5fd;
    border-radius: 8px;
    letter-spacing: .02em;
    min-width: 52px;
    border: none;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-vel.ativa { background: #1e3a8a; color: #fff; }
  .contador-pagina {
    font-size: .68rem;
    color: #94a3b8;
    font-weight: 600;
    letter-spacing: .05em;
    text-align: right;
    flex: 1;
    font-family: ui-monospace, Menlo, monospace;
  }
  #playerFlutuante.minimizado .handle,
  #playerFlutuante.minimizado .controles .btn-sec,
  #playerFlutuante.minimizado .controles .btn-pagina,
  #playerFlutuante.minimizado .rodape { display: none; }
  #playerFlutuante.minimizado { width: auto; padding: 6px; border-radius: 50%; }
  #playerFlutuante.minimizado .controles { gap: 0; }

  /* ============================================
     DEBUG
     ============================================ */
  #debugPanel {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    background: rgba(0, 0, 0, .92);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px;
    color: #cbd5e1;
    font-family: ui-monospace, Menlo, monospace;
    font-size: .68rem;
    line-height: 1.5;
    z-index: 10000;
    max-height: 60vh;
    overflow-y: auto;
    display: none;
  }
  #debugPanel.ativo { display: block; }
  #debugPanel h3 {
    font-size: .72rem;
    color: #fbbf24;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #debugPanel h3 button {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: .65rem;
    font-family: inherit;
    cursor: pointer;
  }
  #debugPanel .linha {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    border-bottom: 1px solid rgba(148, 163, 184, .1);
  }
  #debugPanel .linha.ativa { color: #fbbf24; font-weight: 700; }
  #debugPanel .voz { color: #93c5fd; }
  #debugPanel .aviso {
    margin-top: 8px;
    padding: 6px;
    background: rgba(220, 38, 38, .15);
    border-radius: 6px;
    color: #fca5a5;
  }
  #debugPanel .sucesso {
    margin-top: 8px;
    padding: 6px;
    background: rgba(34, 197, 94, .15);
    border-radius: 6px;
    color: #86efac;
  }

  /* ============================================
     TOAST
     ============================================ */
  .toast {
    position: fixed;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(124, 58, 237, .95);
    color: #fff;
    padding: 8px 16px;
    border-radius: 99px;
    font-size: .75rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 9997;
    white-space: nowrap;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .toast.ativo {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── RESPONSIVIDADE ────────────────────────────── */
  @media (max-width: 390px) {
    .texto-bloco { padding: 13px 13px 16px; font-size: .95rem; }
    #playerFlutuante { width: 290px; padding: 8px 8px 10px; }
    .btn-play-flut { width: 48px; height: 48px; font-size: 1.2rem; }
    .btn-sec { width: 34px; height: 34px; font-size: .82rem; }
    .btn-vel { font-size: .68rem; padding: 5px 8px; min-width: 46px; }
    .toolbar button { width: 38px; height: 38px; font-size: .78rem; }
    .conteudo { padding: 20px 16px 0; }
    .contador-pagina { font-size: .62rem; }
    .aba { font-size: .62rem; padding: 7px 8px; }
  }

  @media (max-width: 340px) {
    #playerFlutuante { width: 270px; }
    .btn-play-flut { width: 42px; height: 42px; font-size: 1.05rem; }
    .btn-sec { width: 30px; height: 30px; font-size: .75rem; }
    .btn-vel { font-size: .62rem; padding: 4px 7px; min-width: 40px; }
  }

  @media (min-width: 600px) {
    .conteudo { padding: 32px 32px 0; }
    #playerFlutuante { width: 340px; }
    .btn-play-flut { width: 58px; height: 58px; font-size: 1.4rem; }
    .btn-sec { width: 42px; height: 42px; font-size: .95rem; }
  }
</style>
</head>
<body data-tema="escuro">

<div class="toolbar">
  <button id="btnTema" type="button" aria-label="Alternar tema">☀️</button>
  <button id="btnFonteMenos" type="button" aria-label="Diminuir fonte">A−</button>
  <button id="btnFonteMais" type="button" aria-label="Aumentar fonte">A+</button>
</div>

<div class="conteudo">
  <div class="texto-bloco" id="texto"></div>
</div>

<div class="toast" id="toast"></div>

<div id="debugPanel">
  <h3>🎙️ Debug de Vozes <button onclick="fecharDebug()">Fechar</button></h3>
  <div id="debugElenco"></div>
</div>

<div id="playerFlutuante" role="region" aria-label="Controles de áudio">
  <div class="handle" id="handle" aria-label="Arraste para mover"></div>
  <div class="controles">
    <button class="btn-ctrl btn-pagina btn-sec" id="btnPaginaAnterior" onclick="pularCapitulo(-1)" aria-label="Capítulo anterior" title="Capítulo anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.41 16.59L13.82 12l4.59-4.59L17 6l-6 6 6 6zM6 6h2v12H6z"/>
      </svg>
    </button>
    <button class="btn-ctrl btn-sec" id="btnAnterior" onclick="pularFrase(-1)" aria-label="Frase anterior" title="Frase anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
      </svg>
    </button>
    <button class="btn-ctrl btn-play-flut" id="btnPlayFlut" onclick="togglePlay()" aria-label="Ouvir ou pausar">
      <svg id="iconePlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <button class="btn-ctrl btn-sec" id="btnProximo" onclick="pularFrase(1)" aria-label="Próxima frase" title="Próxima frase">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/>
      </svg>
    </button>
    <button class="btn-ctrl btn-pagina btn-sec" id="btnPaginaProxima" onclick="pularCapitulo(1)" aria-label="Próximo capítulo" title="Próximo capítulo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5.59 7.41L10.18 12l-4.59 4.59L7 18l6-6-6-6zM16 6h2v12h-2z"/>
      </svg>
    </button>
  </div>
  <div class="rodape">
    <button class="btn-vel" id="btnVel" onclick="ciclarVelocidade()" aria-label="Velocidade">1.0×</button>
    <span class="contador-pagina" id="contadorPagina">Bloco 1 / 3</span>
  </div>
</div>

<script>
/* =====================================================
   AMBIENTE
   ===================================================== */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMicrosoft = /Windows|Win32|Win64/.test(navigator.userAgent);

/* =====================================================
   PREFERÊNCIAS
   ===================================================== */
const FONTES = [0.80, 0.88, 0.95, 1.02, 1.10, 1.20, 1.30, 1.45];

let prefTema = 'escuro';
let prefTamanho = 1.02;
let prefVelocidade = 1.0;

try {
  const t = localStorage.getItem('pref-tema');
  if (t === 'claro' || t === 'escuro') prefTema = t;

  const s = parseFloat(localStorage.getItem('pref-tamanho'));
  if (isFinite(s) && s >= 0.5 && s <= 2.0) prefTamanho = s;

  const v = parseFloat(localStorage.getItem('pref-velocidade'));
  if (isFinite(v) && v >= 0.5 && v <= 3.0) prefVelocidade = v;
} catch(e) {}

function salvarPrefs() {
  try {
    localStorage.setItem('pref-tema', prefTema);
    localStorage.setItem('pref-tamanho', String(prefTamanho));
    localStorage.setItem('pref-velocidade', String(prefVelocidade));
  } catch(e) {}
}

/* =====================================================
   TEMA
   ===================================================== */
function aplicarTema() {
  const btn = document.getElementById('btnTema');
  document.body.setAttribute('data-tema', prefTema);
  if (btn) btn.textContent = (prefTema === 'claro') ? '🌙' : '☀️';
}

function alternarTema() {
  prefTema = (prefTema === 'claro') ? 'escuro' : 'claro';
  salvarPrefs();
  aplicarTema();
  mostrarToast(prefTema === 'claro' ? '☀️ Modo claro' : '🌙 Modo escuro');
}

/* =====================================================
   FONTE
   ===================================================== */
function acharIndiceFonte() {
  let melhor = 0;
  let menorDist = Math.abs(FONTES[0] - prefTamanho);
  for (let i = 1; i < FONTES.length; i++) {
    const d = Math.abs(FONTES[i] - prefTamanho);
    if (d < menorDist) { menorDist = d; melhor = i; }
  }
  return melhor;
}

function aplicarFonte() {
  const tam = (isFinite(prefTamanho) && prefTamanho > 0.3 && prefTamanho < 2.5) ? prefTamanho : 1.02;
  document.documentElement.style.setProperty('--tamanho-fonte', tam + 'rem');
  const card = document.getElementById('texto');
  if (card) card.style.fontSize = tam + 'rem';

  const i = acharIndiceFonte();
  const btnM = document.getElementById('btnFonteMenos');
  const btnP = document.getElementById('btnFonteMais');
  if (btnM) btnM.disabled = (i <= 0);
  if (btnP) btnP.disabled = (i >= FONTES.length - 1);
}

function ajustarFonte(direcao) {
  const i = acharIndiceFonte();
  const novo = Math.max(0, Math.min(FONTES.length - 1, i + direcao));
  if (novo === i) return;
  prefTamanho = FONTES[novo];
  salvarPrefs();
  aplicarFonte();
  mostrarToast('🔤 Fonte: ' + Math.round(prefTamanho * 100) + '%');
}

/* =====================================================
   TOAST
   ===================================================== */
let toastTimer = null;
function mostrarToast(txt) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = txt;
  el.classList.add('ativo');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('ativo'), 1400);
}

/* =====================================================
   VOZES
   ===================================================== */
let todasAsVozes = [];
let elenco = null;
let modoIOS = false;
let felipeEncontrado = false;

function carregarVozes(callback) {
  let jaChamou = false;
  const finalizar = () => {
    if (jaChamou) return;
    jaChamou = true;
    callback();
  };

  try {
    let vozes = speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      finalizar();
      return;
    }

    const handler = () => {
      try {
        vozes = speechSynthesis.getVoices();
        if (vozes.length > 0) {
          todasAsVozes = vozes;
          speechSynthesis.removeEventListener('voiceschanged', handler);
          finalizar();
        }
      } catch(e) { finalizar(); }
    };

    if (speechSynthesis.addEventListener) {
      speechSynthesis.addEventListener('voiceschanged', handler);
    } else {
      speechSynthesis.onvoiceschanged = handler;
    }

    let tentativas = 0;
    const poll = () => {
      try {
        tentativas++;
        vozes = speechSynthesis.getVoices();
        if (vozes.length > 0) {
          todasAsVozes = vozes;
          finalizar();
          return;
        }
        if (tentativas < 30) setTimeout(poll, 200);
        else finalizar();
      } catch(e) { finalizar(); }
    };
    setTimeout(poll, 200);
  } catch(e) {
    finalizar();
  }
}

function vozesPtBR() {
  return todasAsVozes.filter(v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    return lang === 'pt-br' || lang.startsWith('pt-br');
  });
}

/* =====================================================
   PERFIS
   ===================================================== */

let synth = window.speechSynthesis;
let tocando = false;
let pausado = false;
let cancelar = false;
let indiceCapitulo = 0;   // 0, 1, 2
let indiceAtual = 0;      // índice da fala dentro do capítulo atual
let velocidade = prefVelocidade;

function getAulaAtual() { return CAPITULOS[indiceCapitulo].aula; }
function getTotalCapitulos() { return CAPITULOS.length; }

/* =====================================================
   RENDER
   ===================================================== */
function renderTextoLegivel(texto) {
  let t = texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
  t = t.replace(/\*([^*]+)\*/g, '<span class="enfase">$1</span>');
  return t;
}

function renderCapitulo() {
  const el = document.getElementById('texto');
  if (!el) return;
  el.style.opacity = 0;
  setTimeout(function() {
    el.innerHTML = '';

    // Abas de capítulo
    const abas = document.createElement('div');
    abas.className = 'abas-capitulos';
    CAPITULOS.forEach(function(cap, i) {
      const btn = document.createElement('button');
      btn.className = 'aba' + (i === indiceCapitulo ? ' ativa' : '');
      btn.type = 'button';
      btn.textContent = 'Bloco ' + (i + 1);
      btn.addEventListener('click', function() {
        if (i === indiceCapitulo) return;
        irParaCapitulo(i);
      });
      abas.appendChild(btn);
    });
    el.appendChild(abas);

    // Título
    const titulo = document.createElement('div');
    titulo.className = 'titulo-capitulo';
    titulo.textContent = CAPITULOS[indiceCapitulo].titulo;
    el.appendChild(titulo);

    // Bolinhas
    const bolinhas = document.createElement('div');
    bolinhas.className = 'bolinhas-pagina';
    for (let p = 0; p < getTotalCapitulos(); p++) {
      const b = document.createElement('div');
      b.className = 'bolinha-pagina' + (p === indiceCapitulo ? ' ativa' : '');
      bolinhas.appendChild(b);
    }
    el.appendChild(bolinhas);

    // Falas
    const aula = getAulaAtual();
    aula.forEach(function(fala, i) {
      if (fala.tipo === 'pausa') {
        const br = document.createElement('div');
        br.className = 'quebra';
        el.appendChild(br);
        return;
      }
      const div = document.createElement('div');
      div.className = 'fala ' + fala.papel + ' futura';
      div.id = 'fala-' + i;
      const simbolo = SIMBOLOS[fala.papel] || '·';
      div.innerHTML = '<span class="simbolo">' + simbolo + '</span>' + renderTextoLegivel(fala.texto);
      div.addEventListener('click', function() { irParaFala(i); });
      el.appendChild(div);
    });

    el.style.opacity = 1;
    atualizarContadorPagina();
    atualizarBotoesNavegacao();
  }, 180);
}

function irParaFala(idx) {
  const aula = getAulaAtual();
  if (idx < 0 || idx >= aula.length) return;
  if (aula[idx].tipo === 'pausa') return;

  const estavaTocando = tocando && !pausado;
  pararSilencioso();
  indiceAtual = idx;

  destacarFala(idx);
  atualizarBotoesNavegacao();

  if (estavaTocando) {
    setTimeout(function() { tocarDeOndeParou(); }, 80);
  } else {
    mostrarToast('📍 Fala ' + contarFalas(idx));
  }
}

function contarFalas(idx) {
  const aula = getAulaAtual();
  let n = 0;
  for (let k = 0; k <= idx && k < aula.length; k++) {
    if (aula[k].tipo !== 'pausa') n++;
  }
  const total = aula.filter(function(f) { return f.tipo !== 'pausa'; }).length;
  return n + ' / ' + total;
}

function destacarFala(idx) {
  document.querySelectorAll('.fala').forEach(function(el) {
    const numIdx = parseInt(el.id.replace('fala-', ''));
    el.classList.remove('falando', 'falada', 'futura');
    if (numIdx < idx) el.classList.add('falada');
    else if (numIdx === idx) el.classList.add('falando');
    else el.classList.add('futura');
  });
  const atual = document.getElementById('fala-' + idx);
  if (atual) {
    const rect = atual.getBoundingClientRect();
    if (rect.top < 100 || rect.bottom > window.innerHeight - 200) {
      atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function resetDestaques() {
  document.querySelectorAll('.fala').forEach(function(el) {
    el.classList.remove('falando', 'falada');
    el.classList.add('futura');
  });
}

/* =====================================================
   NAVEGAÇÃO DE CAPÍTULO
   ===================================================== */
function irParaCapitulo(novo) {
  if (novo < 0 || novo >= getTotalCapitulos()) return;
  if (novo === indiceCapitulo) return;

  const estavaTocando = tocando && !pausado;
  pararSilencioso();

  indiceCapitulo = novo;
  indiceAtual = 0;

  renderCapitulo();
  mostrarToast('📖 ' + CAPITULOS[indiceCapitulo].titulo);

  // Regra A: se estava tocando, continua tocando o novo capítulo
  if (estavaTocando) {
    setTimeout(function() { tocarDeOndeParou(); }, 350);
  }
}

function pularCapitulo(direcao) {
  irParaCapitulo(indiceCapitulo + direcao);
}

function atualizarContadorPagina() {
  const el = document.getElementById('contadorPagina');
  if (el) el.textContent = 'Bloco ' + (indiceCapitulo + 1) + ' / ' + getTotalCapitulos();
}

   UI
   ===================================================== */
function setBtnEstado(playing) {
  const btn = document.getElementById('btnPlayFlut');
  const icone = document.getElementById('iconePlay');
  if (!btn || !icone) return;
  if (playing) {
    btn.classList.add('tocando');

  } else {
    btn.classList.remove('tocando');

  }

function atualizarBotoesNavegacao() {
  const aula = getAulaAtual();
  const btnA = document.getElementById('btnAnterior');
  const btnP = document.getElementById('btnProximo');
  const btnCA = document.getElementById('btnPaginaAnterior');
  const btnCP = document.getElementById('btnPaginaProxima');

  if (btnA && btnP) {
    const temAnterior = aula.slice(0, indiceAtual).some(function(f) { return f.tipo !== 'pausa'; });
    const temProximo  = aula.slice(indiceAtual + 1).some(function(f) { return f.tipo !== 'pausa'; });
    btnA.disabled = !temAnterior;
    btnP.disabled = !temProximo;
  }
  if (btnCA) btnCA.disabled = (indiceCapitulo === 0);
  if (btnCP) btnCP.disabled = (indiceCapitulo === getTotalCapitulos() - 1);
}

/* =====================================================
   VELOCIDADE
   ===================================================== */
const VELOCIDADES = [0.75, 1.0, 1.25, 1.5, 2.0];

function atualizarBtnVel() {
  const btn = document.getElementById('btnVel');
  if (!btn) return;
  btn.textContent = velocidade.toFixed(2).replace(/0$/, '') + '×';
  btn.classList.toggle('ativa', velocidade !== 1.0);
}

function ciclarVelocidade() {
  const i = VELOCIDADES.indexOf(velocidade);
  velocidade = VELOCIDADES[(i + 1) % VELOCIDADES.length];
  prefVelocidade = velocidade;
  salvarPrefs();
  atualizarBtnVel();
  mostrarToast('⚡ ' + velocidade.toFixed(2).replace(/0$/, '') + '×');
  if (tocando && !pausado) {
    const idx = indiceAtual;
    pararSilencioso();
    setTimeout(function() { indiceAtual = idx; tocarDeOndeParou(); }, 100);
  }
}

/* =====================================================
   PLAY / PAUSE / PULAR
   ===================================================== */
function togglePlay() {
  if (tocando && !pausado) {
    pausado = true;
    cancelar = true;
    try { synth.cancel(); } catch(e) {}
    setBtnEstado(false);
    return;
  }
  if (tocando && pausado) {
    pausado = false;
    tocarDeOndeParou();
    return;
  }
  indiceAtual = 0;
  tocarDeOndeParou();
}

function pararSilencioso() {
  cancelar = true;
  try { synth.cancel(); } catch(e) {}
  tocando = false;
  pausado = false;
  setBtnEstado(false);
}

function pularFrase(direcao) {
  const aula = getAulaAtual();
  let novo = indiceAtual + direcao;
  while (novo >= 0 && novo < aula.length && aula[novo].tipo === 'pausa') novo += direcao;

  // Se saiu do capítulo, muda de capítulo
  if (novo < 0) {
    if (indiceCapitulo > 0) pularCapitulo(-1);
    return;
  }
  if (novo >= aula.length) {
    if (indiceCapitulo < getTotalCapitulos() - 1) pularCapitulo(1);
    return;
  }

  const estavaTocando = tocando && !pausado;
  pararSilencioso();
  indiceAtual = novo;

  destacarFala(indiceAtual);
  atualizarBotoesNavegacao();

  if (estavaTocando) {
    setTimeout(function() { tocarDeOndeParou(); }, 80);
  }
}

/* =====================================================
   FALA
   ===================================================== */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach(function(parte, iLonga) {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach(function(p, iCurta) {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) {
        const comEnfase = p.split(/(\*[^*]+\*)/g);
        comEnfase.forEach(function(frag) {
          if (!frag) return;
          if (frag.startsWith('*') && frag.endsWith('*')) {
            segmentos.push({ tipo:'enfase', texto: frag.slice(1, -1).trim() });
          } else if (frag.trim()) {
            segmentos.push({ tipo:'fala', texto: frag.trim() });
          }
        });
      }
    });
  });
  return segmentos;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(function(resolve) {
    let resolvido = false;
    const finalizar = function() {
      if (!resolvido) { resolvido = true; resolve(); }
    };

    const u = new SpeechSynthesisUtterance(texto);
    u.lang = (voz && voz.lang) || 'pt-BR';
    u.rate = Math.max(0.1, Math.min(2.0, rate * velocidade));
    u.pitch = Math.max(0, Math.min(2.0, pitch));
    u.volume = (volume == null) ? 1.0 : volume;
    if (voz) u.voice = voz;
    u.onend = finalizar;
    u.onerror = finalizar;

    try { synth.speak(u); } catch(e) { finalizar(); return; }

    const estimativa = Math.max(3000, texto.length * 130 / u.rate);
    setTimeout(finalizar, estimativa);
  });
}

async function falarComMicroPausas(textoOriginal, perfil, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (let i = 0; i < segmentos.length; i++) {
    const seg = segmentos[i];
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(perfil.microCurta / velocidade);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(perfil.microLonga / velocidade);
    } else if (seg.tipo === 'enfase') {
      await falar(seg.texto, perfil.rateEnfase, perfil.pitchEnfase, perfil.volume, voz);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, perfil.rate, perfil.pitch, perfil.volume, voz);
    }
  }
}

function esperar(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

/* =====================================================
   LOOP PRINCIPAL
   ===================================================== */
async function tocarDeOndeParou() {
  if (!elenco || !elenco.professor) {
    mostrarToast('⚠️ Sem vozes pt-BR');
    return;
  }

  const aula = getAulaAtual();
  cancelar = false;
  tocando = true;
  pausado = false;
  setBtnEstado(true);

  for (let i = indiceAtual; i < aula.length; i++) {
    if (cancelar) return;
    indiceAtual = i;
    const fala = aula[i];

    if (fala.tipo === 'pausa') {
      await esperar(PERFIS.professor.pausas.pausa / velocidade);
      continue;
    }

    const voz = elenco[fala.papel];
    const perfil = PERFIS[fala.papel];

    const pausaAntes = perfil.pausas[fala.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes / velocidade);

    destacarFala(i);
    atualizarBotoesNavegacao();

    await falarComMicroPausas(fala.texto, perfil, voz);
    if (cancelar) return;
  }

  // Fim do capítulo (regra B: para e mostra mensagem)
  if (!cancelar) {
    resetDestaques();
    setBtnEstado(false);
    tocando = false;
    pausado = false;
    atualizarBotoesNavegacao();

    if (indiceCapitulo < getTotalCapitulos() - 1) {
      mostrarToast('✅ Fim do Bloco ' + (indiceCapitulo + 1) + ' — toque em ⇥ para o próximo');
    } else {
      mostrarToast('✅ Fim do último bloco');
    }
  }
}

/* =====================================================
   PLAYER ARRASTÁVEL
   ===================================================== */
const player = document.getElementById('playerFlutuante');
const handle = document.getElementById('handle');
let arrastando = false;
let startX = 0, startY = 0, startLeft = 0, startTop = 0;
let moveu = false;

function iniciarArraste(e) {
  if (e.target !== handle && !handle.contains(e.target)) return;
  arrastando = true;
  moveu = false;
  player.classList.add('arrastando');
  const rect = player.getBoundingClientRect();
  startLeft = rect.left;
  startTop = rect.top;
  const ponto = e.touches ? e.touches[0] : e;
  startX = ponto.clientX;
  startY = ponto.clientY;
  player.style.left = startLeft + 'px';
  player.style.top = startTop + 'px';
  player.style.transform = 'none';
  player.style.right = 'auto';
  player.style.bottom = 'auto';
  e.preventDefault();
}

function moverArraste(e) {
  if (!arrastando) return;
  const ponto = e.touches ? e.touches[0] : e;
  const dx = ponto.clientX - startX;
  const dy = ponto.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moveu = true;
  const novoLeft = Math.max(8, Math.min(window.innerWidth - player.offsetWidth - 8, startLeft + dx));
  const novoTop  = Math.max(8, Math.min(window.innerHeight - player.offsetHeight - 8, startTop + dy));
  player.style.left = novoLeft + 'px';
  player.style.top  = novoTop + 'px';
}

function soltarArraste(e) {
  if (!arrastando) return;
  arrastando = false;
  player.classList.remove('arrastando');
  if (e && e.preventDefault) e.preventDefault();
}

handle.addEventListener('mousedown', iniciarArraste);
document.addEventListener('mousemove', moverArraste);
document.addEventListener('mouseup', soltarArraste);
handle.addEventListener('touchstart', iniciarArraste, { passive: false });
document.addEventListener('touchmove', moverArraste, { passive: false });
document.addEventListener('touchend', soltarArraste);

let toquesHandle = [];
handle.addEventListener('touchend', function() {
  if (moveu) return;
  const agora = Date.now();
  toquesHandle.push(agora);
  toquesHandle = toquesHandle.filter(function(t) { return agora - t < 600; });

  if (toquesHandle.length === 3) {
    document.getElementById('debugPanel').classList.toggle('ativo');
    atualizarDebug();
    toquesHandle = [];
  } else if (toquesHandle.length === 2) {
    setTimeout(function() {
      if (toquesHandle.length === 2) {
        player.classList.toggle('minimizado');
        toquesHandle = [];
      }
    }, 620);
  }
});

  } else if (modoIOS && felipeEncontrado) {
    aviso = '<div class="sucesso">✅ iPhone com Felipe!</div>';
  }

  el.innerHTML = linhas + '<div style="margin-top:8px;color:#94a3b8">' +
    'Vozes únicas: ' + unicas + ' · pt-BR disponíveis: ' + vozesPtBR().length + '<br>' +
    'Total exposto pelo navegador: ' + todasAsVozes.length + '<br>' +
    'Modo: ' + (isIOS ? 'iPhone/Safari' : (isMicrosoft ? 'Microsoft' : 'Desktop')) + '<br>' +
    'Felipe detectado: ' + (felipeEncontrado ? '✅ sim' : '❌ não') +
    '</div>' + aviso;
}

function fecharDebug() {
  const el = document.getElementById('debugPanel');
  if (el) el.classList.remove('ativo');
}

/* =====================================================
   ELENCO
   ===================================================== */
function embaralhar(lista) {
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const PRIORIDADE_PROFESSOR = [
  /felipe/i, /daniel/i, /antonio|antônio/i, /ricardo/i,
  /lucas/i, /thiago/i, /paulo/i,
  /microsoft.*(daniel|antonio|ricardo|felipe)/i,
  /google.*português/i
];

const PRIORIDADE_ALUNAS = [
  /maria/i, /francisca/i, /thalita|talita/i,
  /luciana/i, /fernanda/i, /camila/i, /joana/i
];

function escolherVozProfessor(vozes) {
  for (let i = 0; i < PRIORIDADE_PROFESSOR.length; i++) {
    const regex = PRIORIDADE_PROFESSOR[i];
    const v = vozes.find(function(v) { return regex.test(v.name); });
    if (v) {
      felipeEncontrado = /felipe/i.test(v.name);
      return v;
    }
  }
  const masc = vozes.filter(function(v) {
    return /daniel|felipe|ricardo|lucas|joão|joao|carlos|pedro|paulo|thiago|mateus|gustavo|arthur|antonio|antônio|male|homem/i.test(v.name);
  });
  if (masc.length) return embaralhar(masc)[0];
  return embaralhar(vozes)[0];
}

function escolherVozAluna(vozes, usadas) {
  for (let i = 0; i < PRIORIDADE_ALUNAS.length; i++) {
    const regex = PRIORIDADE_ALUNAS[i];
    const v = vozes.find(function(v) { return regex.test(v.name) && !usadas.has(v); });
    if (v) return v;
  }
  const fem = vozes.filter(function(v) {
    return /maria|francisca|thalita|talita|luciana|fernanda|camila|joana|helena|mariana|ana|beatriz|carolina|female|mulher/i.test(v.name) && !usadas.has(v);
  });
  if (fem.length) return embaralhar(fem)[0];
  return null;
}

function distribuirElenco(vozes) {
  if (!vozes.length) return null;

  const professor = escolherVozProfessor(vozes);
  const usadas = new Set([professor]);
  const e = { professor: professor };

  const alunasFem = ['aluno1','aluno3','aluno5','aluno6'];
  alunasFem.forEach(function(papel) {
    const v = escolherVozAluna(vozes, usadas);
    if (v) { e[papel] = v; usadas.add(v); }
  });

  const restantes = embaralhar(vozes.filter(function(v) { return !usadas.has(v); }));
  const papeisRestantes = PAPEIS_ALUNO.filter(function(p) { return !e[p]; });
  papeisRestantes.forEach(function(papel, i) {
    if (restantes.length) {
      e[papel] = restantes[i % restantes.length];
    } else {
      e[papel] = embaralhar(vozes)[i % vozes.length];
    }
  });

  modoIOS = isIOS;
  return e;
}

function ajustarPerfilProfessor() {
  if (!isIOS) return;
  if (!felipeEncontrado) {
    PERFIS.professor = {
      rate: 0.85, pitch: 0.70, volume: 1.0,
      microCurta: 200, microLonga: 350,
      rateEnfase: 0.79, pitchEnfase: 0.68,
      pausas: { abertura:950, definicao:490, pergunta:320, confirmacao:420, guarde:1120, conclusao:860, pausa:670 }
    };
  } else {
    PERFIS.professor.rate = 0.88;
    PERFIS.professor.pitch = 0.78;
    PERFIS.professor.rateEnfase = 0.82;
    PERFIS.professor.pitchEnfase = 0.75;
  }
}

/* =====================================================
   PRÉ-AQUECIMENTO
   ===================================================== */
let preAquecido = false;
function preAquecerVozes() {
  if (preAquecido) return;
  preAquecido = true;
  if (!elenco) return;
  const vozesUnicas = Array.from(new Set(Object.values(elenco)));
  vozesUnicas.forEach(function(voz, i) {
    setTimeout(function() {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.voice = voz;
        u.volume = 0.01;
        u.rate = 2.0;
        synth.speak(u);
      } catch(e) {}
    }, i * 100);
  });
}
