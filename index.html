<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>3 Vozes BR — Ritmo V6b</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  header { padding: 16px 18px 0; text-align: center; }
  header h1 {
    font-size: .68rem; font-weight: 700; letter-spacing: .08em;
    color: #64748b; text-transform: uppercase; margin-bottom: 4px;
  }
  header p { font-size: 1rem; font-weight: 700; color: #f1f5f9; }

  .tabs {
    display: flex; gap: 6px; padding: 14px 18px 0; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1; min-width: 68px; padding: 9px 5px;
    border: none; border-radius: 9px;
    font-size: .72rem; font-weight: 700; font-family: inherit;
    cursor: pointer; background: #1e293b; color: #64748b;
    transition: background .15s, color .15s; white-space: nowrap;
  }
  .tab.ativa { background: #1e3a8a; color: #fff; }

  .paineis { flex: 1; padding: 12px 18px 0; overflow: hidden; position: relative; }
  .painel { display: none; flex-direction: column; gap: 8px; height: 100%; }
  .painel.ativo { display: flex; }

  .label-versao {
    font-size: .66rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: #475569; padding-left: 2px;
  }
  .descricao {
    font-size: .7rem; color: #64748b; padding-left: 2px; line-height: 1.4;
  }
  .descricao b { color: #93c5fd; }
  .voz-info {
    font-size: .68rem; color: #fbbf24; padding-left: 2px; line-height: 1.4;
    font-weight: 600;
  }

  .texto-bloco {
    background: #1e293b; border-radius: 12px; padding: 12px;
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .frase {
    font-size: .9rem; line-height: 1.55; color: #cbd5e1;
    padding: 4px 7px; border-radius: 6px; margin-bottom: 1px;
    transition: background .15s, color .15s, transform .15s;
  }
  .frase.falando { background: rgba(59,130,246,.2); color: #fff; transform: translateX(2px); }
  .frase.falada { color: #475569; }
  .quebra { height: 8px; }

  .player { padding: 10px 0 0; }
  .btn-play {
    width: 100%; min-height: 50px; border: none; border-radius: 12px;
    font-size: .92rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: opacity .15s, transform .1s;
  }
  .btn-play:active { opacity: .8; transform: scale(.97); }
  .btn-play.parado  { background: #2563eb; color: #fff; }
  .btn-play.tocando { background: #dc2626; color: #fff; }

  .progresso-wrap {
    margin-top: 7px; height: 4px; background: #1e293b;
    border-radius: 2px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: #2563eb; border-radius: 2px;
    width: 0%; transition: width .3s;
  }

  .dica {
    margin-top: 7px; font-size: .7rem; color: #475569;
    text-align: center; line-height: 1.5; padding-bottom: 6px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: #0f3460; color: #93c5fd; font-size: .64rem;
    font-weight: 700; padding: 3px 8px; border-radius: 99px;
    margin-left: 6px; vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <h1>👥 RH · Bloco 1 · 3 Vozes BR</h1>
  <p>Ritmo V6b <span class="badge">Palestrante</span></p>
</header>

<div class="tabs">
  <button class="tab ativa" data-v="luciana" onclick="trocarTab('luciana')">Luciana</button>
  <button class="tab" data-v="felipe" onclick="trocarTab('felipe')">Felipe</button>
  <button class="tab" data-v="fernanda" onclick="trocarTab('fernanda')">Fernanda</button>
</div>

<div class="paineis" id="paineis"></div>

<script>
/* =====================================================
   CONTEÚDO — Bloco 1 RH (cadenciado, com micro-pausas)
   ===================================================== */
const UNIDADES = [
  { tipo:"abertura",  texto:"Gestão de pessoas é a área responsável pelo ser humano no trabalho." },
  { tipo:"definicao", texto:"Ela atrai, desenvolve, motiva | e mantém as pessoas na empresa." },
  { tipo:"pausa" },
  { tipo:"definicao", texto:"Durante muito tempo, essa área foi vista apenas como operacional." },
  { tipo:"definicao", texto:"Cuidava de folha de pagamento, ponto, férias e documentação. || Era o setor que resolvia papelada." },
  { tipo:"pausa" },
  { tipo:"definicao", texto:"Hoje o cenário mudou. || A gestão de pessoas passou a ser estratégica." },
  { tipo:"definicao", texto:"Ela participa das decisões importantes da organização." },
  { tipo:"pausa" },
  { tipo:"definicao", texto:"Existe uma diferença importante entre gestão de pessoas | e gestão de recursos humanos." },
  { tipo:"definicao", texto:"Gestão de recursos humanos é o nome mais antigo, ligado à ideia de que pessoas são recursos, como máquinas ou dinheiro." },
  { tipo:"definicao", texto:"Gestão de pessoas é o nome mais moderno, que enxerga o ser humano como parceiro da organização." },
  { tipo:"pausa" },
  { tipo:"definicao", texto:"Essa mudança de nome reflete uma mudança de mentalidade." },
  { tipo:"definicao", texto:"Antes, a pessoa era vista como custo. || Agora, é vista como diferencial competitivo." },
  { tipo:"pausa" },
  { tipo:"guarde",    texto:"Guarde isto." },
  { tipo:"guarde",    texto:"Gestão de pessoas é a área que cuida do ser humano no trabalho." },
  { tipo:"guarde",    texto:"Quando ela é estratégica, deixa de apenas resolver problemas | e passa a construir resultados." }
];

/* =====================================================
   PERFIS DE RITMO — cada voz tem personalidade própria
   ===================================================== */

/* Luciana — neutra, clara, podcast (equilíbrio) */
const PERFIL_LUCIANA = {
  base: { rate: 0.88, pitch: 0.96, volume: 1.0 },
  pausas: {
    abertura:700, definicao:400, lista:180, exemplo:220,
    conclusao:500, guarde:800, pausa:650
  },
  ratePorTipo:  { abertura:0.86, definicao:0.90, lista:0.92, exemplo:0.90, conclusao:0.84, guarde:0.80 },
  pitchPorTipo: { abertura:0.98, definicao:0.96, lista:0.96, exemplo:0.98, conclusao:0.92, guarde:0.90 },
  volumePorTipo:{ abertura:1.0,  definicao:1.0,  lista:0.98, exemplo:0.96, conclusao:1.0,  guarde:0.90 },
  microCurta: 120, microLonga: 220
};

/* Felipe — grave, madura, palestrante (pausado e imponente) */
const PERFIL_FELIPE = {
  base: { rate: 0.80, pitch: 0.85, volume: 1.0 },
  pausas: {
    abertura:950, definicao:520, lista:220, exemplo:280,
    conclusao:650, guarde:1050, pausa:850
  },
  ratePorTipo:  { abertura:0.78, definicao:0.82, lista:0.86, exemplo:0.84, conclusao:0.76, guarde:0.72 },
  pitchPorTipo: { abertura:0.86, definicao:0.84, lista:0.86, exemplo:0.88, conclusao:0.82, guarde:0.80 },
  volumePorTipo:{ abertura:1.0,  definicao:1.0,  lista:0.98, exemplo:0.96, conclusao:1.0,  guarde:0.92 },
  microCurta: 180, microLonga: 320
};

/* Fernanda — calorosa, próxima, conversa (mais rápido e agudo) */
const PERFIL_FERNANDA = {
  base: { rate: 0.98, pitch: 1.08, volume: 1.0 },
  pausas: {
    abertura:550, definicao:320, lista:140, exemplo:180,
    conclusao:420, guarde:680, pausa:520
  },
  ratePorTipo:  { abertura:0.96, definicao:1.00, lista:1.02, exemplo:1.00, conclusao:0.94, guarde:0.90 },
  pitchPorTipo: { abertura:1.10, definicao:1.08, lista:1.08, exemplo:1.10, conclusao:1.04, guarde:1.02 },
  volumePorTipo:{ abertura:1.0,  definicao:1.0,  lista:0.98, exemplo:0.96, conclusao:1.0,  guarde:0.90 },
  microCurta: 90, microLonga: 170
};

/* =====================================================
   DEFINIÇÃO DAS 3 VOZES — busca multi-plataforma
   iOS (Safari):  Luciana, Felipe, Fernanda
   Edge Neural:   Francisca, Antonio, Thalita, Nicolau, Yara, etc.
   Chrome/Google: Google português do Brasil
   Windows SAPI:  Microsoft Maria, Microsoft Daniel
   ===================================================== */
const VOZES = {
  luciana: {
    nome: "Luciana",
    descricao: "Feminina neutra (pt-BR). <b>Clara e equilibrada, estilo podcast.</b>",
    dica: "🎧 Neutra · ritmo médio · dicção limpa",
    busca: [
      "Luciana (Premium)", "Luciana (Enhanced)", "Luciana",
      "pt-BR-FranciscaNeural", "Francisca",
      "Microsoft Maria", "Microsoft Francisca",
      "Google português do Brasil",
      "Fernanda (Premium)", "Fernanda (Enhanced)", "Fernanda"
    ],
    genero: "feminino",
    fallbackLang: "pt-BR",
    perfil: PERFIL_LUCIANA
  },
  felipe: {
    nome: "Felipe",
    descricao: "Masculina grave (pt-BR). <b>Madura e imponente, ritmo de palestra.</b>",
    dica: "🎤 Grave · pausado · autoridade",
    busca: [
      "Felipe (Premium)", "Felipe (Enhanced)", "Felipe",
      "pt-BR-AntonioNeural", "Antonio", "Nicolau",
      "Microsoft Daniel", "Microsoft Henrique",
      "Google português do Brasil"
    ],
    genero: "masculino",
    fallbackLang: "pt-BR",
    perfil: PERFIL_FELIPE
  },
  fernanda: {
    nome: "Fernanda",
    descricao: "Feminina calorosa (pt-BR). <b>Próxima e envolvente, jeito de conversa.</b>",
    dica: "💬 Calorosa · ágil · conversa próxima",
    busca: [
      "Fernanda (Premium)", "Fernanda (Enhanced)", "Fernanda",
      "pt-BR-ThalitaNeural", "Thalita", "Yara",
      "Microsoft Francisca", "Microsoft Maria",
      "Google português do Brasil"
    ],
    genero: "feminino",
    fallbackLang: "pt-BR",
    perfil: PERFIL_FERNANDA
  }
};

/* =====================================================
   VOZES — detecção, gênero e escolha única
   ===================================================== */
let synth = window.speechSynthesis;
let tocando = null;
let cancelar = false;
let vozesDisponiveis = [];
const vozesEscolhidas = {};   // { luciana: SpeechSynthesisVoice, ... }

/* ── Heurística de gênero pelo nome (multi-plataforma) ── */
const NOMES_FEMININOS = [
  "luciana","fernanda","joana","maria","francisca","helena","catarina",
  "célia","celia","ines","inês","marina","raquel","rita","vitória","vitoria",
  "thalita","yara","leila","valeria","valéria",
  "google português","google portuguese"
];
const NOMES_MASCULINOS = [
  "felipe","daniel","henrique","ricardo","joão","joao","thiago","tiago",
  "marcos","paulo","carlos","bruno","antonio","antônio","nicolau","julio","júlio"
];

function detectarGenero(voz) {
  const n = voz.name.toLowerCase();
  if (NOMES_FEMININOS.some(x => n.includes(x))) return "feminino";
  if (NOMES_MASCULINOS.some(x => n.includes(x))) return "masculino";
  return "desconhecido";
}

/* ── Carrega vozes ── */
function carregarVozes() {
  vozesDisponiveis = synth.getVoices();
}

/* ── Encontra voz para um perfil, excluindo já usadas ── */
function encontrarVoz(perfil, excluir = []) {
  carregarVozes();

  // 1) Filtra pt-BR (com fallback pra pool geral se não houver pt-BR)
  const ptBR = vozesDisponiveis.filter(v =>
    v.lang === "pt-BR" || v.lang.replace('_','-') === "pt-BR"
  );
  const pool = ptBR.length ? ptBR : vozesDisponiveis;

  // 2) Nome exato
  for (const nome of perfil.busca) {
    const v = pool.find(x => x.name === nome && !excluir.includes(x.name));
    if (v) return v;
  }
  // 3) Nome parcial
  for (const nome of perfil.busca) {
    const v = pool.find(x => x.name.includes(nome) && !excluir.includes(x.name));
    if (v) return v;
  }
  // 4) Por gênero
  const porGenero = pool.find(x =>
    detectarGenero(x) === perfil.genero && !excluir.includes(x.name)
  );
  if (porGenero) return porGenero;

  // 5) Qualquer voz livre no pool
  const livre = pool.find(x => !excluir.includes(x.name));
  if (livre) return livre;

  // 6) Último recurso: pool[0] mesmo repetida
  return pool[0] || null;
}

/* ── Escolhe 3 vozes ÚNICAS (uma por aba) ── */
function escolherVozesUnicas() {
  const usadas = [];
  Object.keys(VOZES).forEach(v => {
    const voz = encontrarVoz(VOZES[v], usadas);
    vozesEscolhidas[v] = voz;
    if (voz) usadas.push(voz.name);
  });
}

/* ── Descrição da voz realmente usada ── */
function descreverVoz(voz) {
  if (!voz) return "⚠️ Nenhuma voz pt-BR encontrada — usando padrão do sistema";
  return `🎙 Voz em uso: ${voz.name} (${voz.lang})`;
}

if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = () => {
    carregarVozes();
    escolherVozesUnicas();
    atualizarInfoVozes();
  };
}

/* ── Render ── */
const paineisEl = document.getElementById('paineis');

function renderTextoLegivel(texto) {
  return texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
}

function renderTodos() {
  paineisEl.innerHTML = '';
  Object.keys(VOZES).forEach((v, idx) => {
    const cfg = VOZES[v];
    const painel = document.createElement('div');
    painel.className = 'painel' + (idx === 0 ? ' ativo' : '');
    painel.id = 'painel-' + v;

    const label = document.createElement('div');
    label.className = 'label-versao';
    label.textContent = cfg.nome;
    painel.appendChild(label);

    const desc = document.createElement('div');
    desc.className = 'descricao';
    desc.innerHTML = cfg.descricao;
    painel.appendChild(desc);

    const vozInfo = document.createElement('div');
    vozInfo.className = 'voz-info';
    vozInfo.id = 'vozinfo-' + v;
    vozInfo.textContent = '🎙 Detectando voz...';
    painel.appendChild(vozInfo);

    const texto = document.createElement('div');
    texto.className = 'texto-bloco';
    texto.id = 'texto-' + v;
    UNIDADES.forEach((u, i) => {
      if (u.tipo === 'pausa') {
        const br = document.createElement('div');
        br.className = 'quebra';
        br.dataset.idx = i;
        texto.appendChild(br);
      } else {
        const el = document.createElement('div');
        el.className = 'frase';
        el.id = v + '-f-' + i;
        el.textContent = renderTextoLegivel(u.texto);
        texto.appendChild(el);
      }
    });
    painel.appendChild(texto);

    const player = document.createElement('div');
    player.className = 'player';
    player.innerHTML = `
      <button class="btn-play parado" id="btn-${v}" onclick="togglePlay('${v}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Ouvir ${cfg.nome}
      </button>
      <div class="progresso-wrap"><div class="progresso-fill" id="prog-${v}"></div></div>
      <p class="dica">${cfg.dica}</p>
    `;
    painel.appendChild(player);

    paineisEl.appendChild(painel);
  });
}

function atualizarInfoVozes() {
  Object.keys(VOZES).forEach(v => {
    const voz = vozesEscolhidas[v] || encontrarVoz(VOZES[v]);
    const el = document.getElementById('vozinfo-' + v);
    if (el) el.textContent = descreverVoz(voz);
  });
}

/* ── Inicialização ── */
carregarVozes();
escolherVozesUnicas();
renderTodos();
setTimeout(() => { carregarVozes(); escolherVozesUnicas(); atualizarInfoVozes(); }, 300);
setTimeout(() => { carregarVozes(); escolherVozesUnicas(); atualizarInfoVozes(); }, 1500);

/* ── Tabs ── */
function trocarTab(v) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('ativa', t.dataset.v === v));
  document.querySelectorAll('.painel').forEach(p => p.classList.toggle('ativo', p.id === 'painel-' + v));
  if (tocando && tocando !== v) pararTudo();
}

/* ── Player ── */
function togglePlay(v) {
  if (tocando === v) { pararTudo(); return; }
  if (tocando) pararTudo();
  tocarVersao(v);
}

function pararTudo() {
  cancelar = true;
  synth.cancel();
  if (tocando) {
    setBtnEstado(tocando, false);
    resetHighlights(tocando);
    setProgresso(tocando, 0);
  }
  tocando = null;
}

function setBtnEstado(v, playing) {
  const btn = document.getElementById('btn-' + v);
  const cfg = VOZES[v];
  if (playing) {
    btn.className = 'btn-play tocando';
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Parar`;
  } else {
    btn.className = 'btn-play parado';
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/></svg> Ouvir ${cfg.nome}`;
  }
}

function setProgresso(v, pct) {
  document.getElementById('prog-' + v).style.width = pct + '%';
}

function resetHighlights(v) {
  document.querySelectorAll('#texto-' + v + ' .frase').forEach(el => {
    el.classList.remove('falando', 'falada');
  });
}

function highlightFrase(v, idx) {
  document.querySelectorAll('#texto-' + v + ' .frase').forEach(el => {
    el.classList.remove('falando');
    if (parseInt(el.id.split('-f-')[1]) < idx) el.classList.add('falada');
  });
  const el = document.getElementById(v + '-f-' + idx);
  if (el) {
    el.classList.add('falando');
    el.classList.remove('falada');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

/* ── Micro-pausas ── */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) segmentos.push({ tipo:'fala', texto:p.trim() });
    });
  });
  return segmentos;
}

async function falarComMicroPausas(textoOriginal, rate, pitch, volume, voz, perfil) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(perfil.microCurta);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(perfil.microLonga);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, rate, pitch, volume, voz);
    }
  }
}

async function tocarVersao(v) {
  const cfg = VOZES[v];
  const perfil = cfg.perfil;
  const voz = vozesEscolhidas[v] || encontrarVoz(cfg);
  cancelar = false;
  tocando = v;
  setBtnEstado(v, true);
  resetHighlights(v);

  const total = UNIDADES.filter(u => u.tipo !== 'pausa').length;
  let faladas = 0;

  for (let i = 0; i < UNIDADES.length; i++) {
    if (cancelar) break;
    const u = UNIDADES[i];

    if (u.tipo === 'pausa') {
      await esperar(perfil.pausas.pausa);
      continue;
    }

    const pausaAntes = perfil.pausas[u.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes);

    const rate   = perfil.ratePorTipo[u.tipo]   ?? perfil.base.rate;
    const pitch  = perfil.pitchPorTipo[u.tipo]  ?? perfil.base.pitch;
    const volume = perfil.volumePorTipo[u.tipo] ?? perfil.base.volume;

    highlightFrase(v, i);
    faladas++;
    setProgresso(v, Math.round((faladas / total) * 100));

    await falarComMicroPausas(u.texto, rate, pitch, volume, voz, perfil);
    if (cancelar) break;
  }

  if (!cancelar) {
    resetHighlights(v);
    setProgresso(v, 100);
    setTimeout(() => {
      setBtnEstado(v, false);
      setProgresso(v, 0);
      if (tocando === v) tocando = null;
    }, 700);
  }
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = voz ? voz.lang : 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume ?? 1.0;
    if (voz) u.voice = voz;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
  });
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
</body>
</html>
