<style>

  }
  .descricao {
    font-size: .7rem; color: #64748b; padding-left: 2px; line-height: 1.4;
  }
  .descricao b { color: #93c5fd; }

  .texto-bloco {
    background: #1e293b; border-radius: 12px; padding: 12px;
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .frase {
    font-size: .9rem; line-height: 1.55; color: #cbd5e1;
    padding: 4px 7px; border-radius: 6px; margin-bottom: 1px;
    transition: background .15s, color .15s, transform .15s;
  }
  .frase.falando { background: rgba(59,130,246,.2); color: #fff; transform: translateX(2px); }
  .frase.falada { color: #475569; }
  .quebra { height: 8px; }

  .player { padding: 10px 0 0; }
  .btn-play {
    width: 100%; min-height: 50px; border: none; border-radius: 12px;
    font-size: .92rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: opacity .15s, transform .1s;
  }
  .btn-play:active { opacity: .8; transform: scale(.97); }
  .btn-play.parado  { background: #2563eb; color: #fff; }
  .btn-play.tocando { background: #dc2626; color: #fff; }

  .progresso-wrap {
    margin-top: 7px; height: 4px; background: #1e293b;
    border-radius: 2px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: #2563eb; border-radius: 2px;
    width: 0%; transition: width .3s;
  }

  .dica {
    margin-top: 7px; font-size: .7rem; color: #475569;
    text-align: center; line-height: 1.5; padding-bottom: 6px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: #0f3460; color: #93c5fd; font-size: .64rem;
    font-weight: 700; padding: 3px 8px; border-radius: 99px;
    margin-left: 6px; vertical-align: middle;
  }
</style>

const DADOS = { v4: V4, v5a: V5A, v5b: V5B, v5c: V5C };

let synth = window.speechSynthesis;
let tocando = null;
let cancelar = false;
let melhorVoz = null;

/* ── Voz ── */
function escolherVoz() {
  const vozes = synth.getVoices();
  if (!vozes.length) return null;
  const ptBR = vozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
  if (!ptBR.length) return null;
  return ptBR.find(v => v.name.includes('Luciana'))
      || ptBR.find(v => v.localService)
      || ptBR[0];
}
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = () => { melhorVoz = escolherVoz(); };
}

/* ── Render ── */
const paineisEl = document.getElementById('paineis');

function renderTextoLegivel(texto) {
  // remove marcadores de micro-pausa para exibição
  return texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
}

function renderTodos() {
  paineisEl.innerHTML = '';
  Object.keys(PERFIS).forEach((v, idx) => {
    const p = PERFIS[v];
    const unidades = DADOS[v];

    label.textContent = p.nome;

        br.dataset.idx = i;

        const el = document.createElement('div');
        el.className = 'frase';
        el.id = v + '-f-' + i;
        el.textContent = renderTextoLegivel(u.texto);
        texto.appendChild(el);

    painel.appendChild(texto);

    const player = document.createElement('div');
    player.className = 'player';
    player.innerHTML = `
      <button class="btn-play parado" id="btn-${v}" onclick="togglePlay('${v}')">

      <p class="dica">${p.dica}</p>
    `;
    painel.appendChild(player);

    paineisEl.appendChild(painel);
  });
}
renderTodos();

/* ── Tabs ── */
function trocarTab(v) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('ativa', t.dataset.v === v));
  document.querySelectorAll('.painel').forEach(p => p.classList.toggle('ativo', p.id === 'painel-' + v));
  if (tocando && tocando !== v) pararTudo();
}

/* ── Player ── */
function togglePlay(v) {
  if (tocando === v) { pararTudo(); return; }
  if (tocando) pararTudo();
  tocarVersao(v);
}

function pararTudo() {
  cancelar = true;
  synth.cancel();
  if (tocando) {
    setBtnEstado(tocando, false);
    resetHighlights(tocando);
    setProgresso(tocando, 0);
  }
  tocando = null;
}

function setBtnEstado(v, playing) {
  const btn = document.getElementById('btn-' + v);
  const p = PERFIS[v];
  const label = p.nome.split('—')[0].trim();
  if (playing) {
    btn.className = 'btn-play tocando';
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Parar`;
  } else {
    btn.className = 'btn-play parado';
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/></svg> Ouvir ${label}`;
  }
}

function setProgresso(v, pct) {
  document.getElementById('prog-' + v).style.width = pct + '%';
}

function resetHighlights(v) {
  document.querySelectorAll('#texto-' + v + ' .frase').forEach(el => {
    el.classList.remove('falando', 'falada');
  });
}

function highlightFrase(v, idx) {
  document.querySelectorAll('#texto-' + v + ' .frase').forEach(el => {
    el.classList.remove('falando');
    if (parseInt(el.id.split('-f-')[1]) < idx) el.classList.add('falada');
  });
  const el = document.getElementById(v + '-f-' + idx);
  if (el) {
    el.classList.add('falando');
    el.classList.remove('falada');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

/* ── Fala com micro-pausas ── */
/* Divide o texto em segmentos respeitando " || " (180ms) e " | " (80ms) */
function dividirComMicroPausas(texto) {
  // Primeiro separa por "||" (pausa longa)
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga', texto:null });
    // Depois separa por "|" (pausa curta)
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta', texto:null });
      if (p.trim()) segmentos.push({ tipo:'fala', texto:p.trim() });
    });
  });
  return segmentos;
}

async function falarComMicroPausas(textoOriginal, rate, pitch, perfil) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta' && perfil.micro) {
      await esperar(80);
    } else if (seg.tipo === 'pausaLonga' && perfil.microLonga) {
      await esperar(180);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, rate, pitch);
    }
  }
}

async function tocarVersao(v) {
  if (!melhorVoz) melhorVoz = escolherVoz();
  cancelar = false;
  tocando = v;
  setBtnEstado(v, true);
  resetHighlights(v);

  const perfil = PERFIS[v];
  const unidades = DADOS[v];
  const total = unidades.filter(u => u.tipo !== 'pausa').length;
  let faladas = 0;

  for (let i = 0; i < unidades.length; i++) {
    if (cancelar) break;
    const u = unidades[i];

    if (u.tipo === 'pausa') {
      await esperar(perfil.pausas.pausa);
      continue;
    }

    const pausaAntes = perfil.pausas[u.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes);

    const rate = perfil.ratePorTipo ? (perfil.ratePorTipo[u.tipo] ?? perfil.base.rate) : perfil.base.rate;
    const pitch = perfil.pitchPorTipo ? (perfil.pitchPorTipo[u.tipo] ?? perfil.base.pitch) : perfil.base.pitch;

    highlightFrase(v, i);
    faladas++;
    setProgresso(v, Math.round((faladas / total) * 100));

    await falarComMicroPausas(u.texto, rate, pitch, perfil);
    if (cancelar) break;
  }

  if (!cancelar) {
    resetHighlights(v);
    setProgresso(v, 100);
    setTimeout(() => {
      setBtnEstado(v, false);
      setProgresso(v, 0);
      if (tocando === v) tocando = null;
    }, 700);
  }
}

function falar(texto, rate, pitch) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    if (melhorVoz) u.voice = melhorVoz;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
  });
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

melhorVoz = escolherVoz();
</script>
