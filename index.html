<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sala de Aula — RH Bloco 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
    background: #0f172a; color: #cbd5e1;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 130px);
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  .conteudo { flex: 1; padding: 24px 22px 0; display: flex; flex-direction: column; }
  .texto-bloco {
    flex: 1;
    font-size: 1.02rem; line-height: 1.85;
    color: #cbd5e1;
  }
  .fala { margin-bottom: 14px; transition: opacity .25s, background .25s; }
  .simbolo { font-weight: 700; margin-right: 8px; font-size: 1.1em; opacity: .85; }
  .fala.professor .simbolo { color: #a78bfa; }
  .fala.aluno1 .simbolo   { color: #60a5fa; }
  .fala.aluno2 .simbolo   { color: #fbbf24; }
  .fala.aluno3 .simbolo   { color: #34d399; }
  .fala.aluno4 .simbolo   { color: #f472b6; }
  .fala.aluno5 .simbolo   { color: #22d3ee; }
  .fala.aluno6 .simbolo   { color: #fb923c; }
  .fala.aluno7 .simbolo   { color: #c084fc; }
  .fala.falando {
    background: rgba(124, 58, 237, .18);
    border-left: 3px solid #7c3aed;
    border-radius: 4px;
    padding: 6px 10px; margin-left: -13px; margin-right: -10px;
    color: #f1f5f9;
  }
  .fala.falada { opacity: .4; }
  .fala.futura { opacity: .78; }
  .enfase { color: #fbbf24; font-weight: 700; letter-spacing: .01em; }
  .quebra { height: 14px; }

  #playerFlutuante {
    position: fixed; z-index: 9999;

    background: rgba(15, 23, 42, .97);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(148, 163, 184, .18);

    box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
    padding: 10px 10px 12px;

    touch-action: none;

  }
  #playerFlutuante.arrastando {
    box-shadow: 0 20px 48px rgba(0, 0, 0, .7), 0 0 0 2px rgba(124, 58, 237, .5);

    height: 18px; display: flex; align-items: center; justify-content: center;
    cursor: grab; margin-bottom: 4px; touch-action: none;
  }
  .handle::before {
    content: ''; width: 36px; height: 4px;
    background: #475569; border-radius: 2px; transition: background .15s;
  }
  #playerFlutuante.arrastando .handle::before { background: #7c3aed; }
  .controles { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .btn-ctrl {
    border: none; background: #1e293b; color: #cbd5e1;
    font-family: inherit; font-weight: 700;
    border-radius: 12px; cursor: pointer;

  .btn-ctrl:disabled { opacity: .35; }
  .btn-sec { width: 42px; height: 42px; font-size: .95rem; }
  .btn-play-flut {

  .btn-vel {

    background: #1e293b; color: #93c5fd;

  .btn-vel.ativa { background: #1e3a8a; color: #fff; }
  .status-mini {
    font-size: .62rem; color: #64748b;
    text-align: right; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .progresso-mini {
    position: absolute; left: 12px; right: 12px; bottom: 5px;
    height: 2px; background: rgba(148, 163, 184, .15);

  .progresso-mini-fill { height: 100%; background: #3b82f6; width: 0%; transition: width .3s; }

  #playerFlutuante.minimizado .controles .btn-sec,

  #debugPanel {

    background: rgba(0, 0, 0, .92); border: 1px solid #334155;
    border-radius: 12px; padding: 12px;
    color: #cbd5e1; font-family: ui-monospace, Menlo, monospace;
    font-size: .68rem; line-height: 1.5;
    z-index: 10000; max-height: 60vh; overflow-y: auto; display: none;

  #debugPanel.ativo { display: block; }

    font-size: .72rem; color: #fbbf24; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #debugPanel h3 button {
    background: #7c3aed; color: #fff; border: none;
    border-radius: 6px; padding: 3px 8px;

  #debugPanel .linha {
    display: flex; justify-content: space-between; padding: 2px 0;

  }
  #debugPanel .linha.ativa { color: #fbbf24; font-weight: 700; }
  #debugPanel .voz { color: #93c5fd; }
  #debugPanel .status-troca {

    background: rgba(124, 58, 237, .15);
    border-radius: 6px; color: #c4b5fd;
  }
  #debugPanel .aviso {
    margin-top: 8px; padding: 6px;
    background: rgba(220, 38, 38, .15);
    border-radius: 6px; color: #fca5a5;
  }
  .badge-voz {
    position: fixed; top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(124, 58, 237, .9); color: #fff;
    font-size: .7rem; font-weight: 700;
    padding: 5px 12px; border-radius: 99px;
    z-index: 9998; pointer-events: none;
    opacity: 0; transition: opacity .3s;
    font-family: ui-monospace, Menlo, monospace;
  }
  .badge-voz.ativo { opacity: 1; }
</style>
</head>
<body>
<div class="conteudo">
  <div class="texto-bloco" id="texto"></div>
</div>

<div class="badge-voz" id="badgeVoz"></div>

<div id="debugPanel">
  <h3>🎙️ Debug de Vozes <button onclick="fecharDebug()">Fechar</button></h3>
  <div id="debugElenco"></div>
  <div class="status-troca" id="debugTroca">Aguardando…</div>
</div>

<div id="playerFlutuante" role="region" aria-label="Controles de áudio">
  <div class="handle" id="handle" aria-label="Arraste para mover"></div>
  <div class="controles">
    <button class="btn-ctrl btn-sec" id="btnAnterior" onclick="pularFrase(-1)" aria-label="Frase anterior">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
      </svg>

    <button class="btn-ctrl btn-play-flut" id="btnPlayFlut" onclick="togglePlay()" aria-label="Ouvir ou pausar">

    <button class="btn-vel" id="btnVel" onclick="ciclarVelocidade()" aria-label="Velocidade">1.0×</button>

    <div class="progresso-mini-fill" id="progMini"></div>

<script>
/* =====================================================
   AMBIENTE
   ===================================================== */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMicrosoft = /Windows|Win32|Win64/.test(navigator.userAgent);

/* =====================================================
   VOZES
   ===================================================== */
let todasAsVozes = [];
let elenco = null;
let vozesCarregadas = false;
let modoIOS = false;
let vozesDisponiveis = [];

function carregarVozes(callback) {
  let jaChamou = false;
  const finalizar = () => {
    if (jaChamou) return;
    jaChamou = true;
    vozesCarregadas = true;
    callback();
  };

  let vozes = speechSynthesis.getVoices();
  if (vozes.length > 0) {
    todasAsVozes = vozes;
    finalizar();
    return;
  }

  const handler = () => {
    vozes = speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      speechSynthesis.removeEventListener('voiceschanged', handler);
      finalizar();
    }
  };

  if (speechSynthesis.addEventListener) {
    speechSynthesis.addEventListener('voiceschanged', handler);
  } else {
    speechSynthesis.onvoiceschanged = handler;
  }

  let tentativas = 0;
  const poll = () => {
    tentativas++;
    vozes = speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      finalizar();
      return;
    }
    if (tentativas < 30) setTimeout(poll, 200);
    else finalizar();
  };
  setTimeout(poll, 200);
}

function vozesPtBR() {
  return todasAsVozes.filter(v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    return lang === 'pt-br' || lang.startsWith('pt-br');
  });
}

/* =====================================================
   PERFIS — REVISADOS
   =====================================================
   PROFESSOR: motivacional masculino
     - pitch 0.92 → masculino firme, NÃO cavernoso
     - rate 1.02  → ritmo de coach, não de leitor
     - ênfase pitch 0.90 / rate 0.98 → firme
   ALUNOS: variação natural (sem extremos robóticos)
   ===================================================== */
const PAPEIS_ALUNO = ['aluno1','aluno2','aluno3','aluno4','aluno5','aluno6','aluno7'];
const SIMBOLOS = {
  professor: '§',
  aluno1: '·', aluno2: '·', aluno3: '·', aluno4: '·',
  aluno5: '·', aluno6: '·', aluno7: '·'
};

const PERFIS = {

    microCurta: 130, microLonga: 200,
    rateEnfase: 0.98, pitchEnfase: 0.90,

    pausas:{ abertura:200, definicao:160, pergunta:220, confirmacao:160, guarde:240, conclusao:220, pausa:340 } },
  // Reflexivo (grave, lento)
  aluno2: { rate:0.82, pitch:0.88, volume:0.92, microCurta:180, microLonga:250, rateEnfase:0.76, pitchEnfase:0.85,
    pausas:{ abertura:300, definicao:260, pergunta:280, confirmacao:240, guarde:320, conclusao:300, pausa:440 } },
  // Curioso (médio-agudo)
  aluno3: { rate:1.06, pitch:1.18, volume:0.92, microCurta:100, microLonga:170, rateEnfase:0.98, pitchEnfase:1.14,
    pausas:{ abertura:300, definicao:240, pergunta:300, confirmacao:220, guarde:300, conclusao:280, pausa:400 } },
  // Calmo (médio-grave)
  aluno4: { rate:0.88, pitch:0.94, volume:0.92, microCurta:170, microLonga:240, rateEnfase:0.80, pitchEnfase:0.91,
    pausas:{ abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:320, conclusao:300, pausa:420 } },
  // Empolgado (muito agudo)
  aluno5: { rate:1.20, pitch:1.28, volume:0.92, microCurta:60,  microLonga:130, rateEnfase:1.12, pitchEnfase:1.24,
    pausas:{ abertura:180, definicao:150, pergunta:200, confirmacao:150, guarde:220, conclusao:200, pausa:320 } },
  // Neutro
  aluno6: { rate:0.96, pitch:1.08, volume:0.92, microCurta:110, microLonga:180, rateEnfase:0.90, pitchEnfase:1.05,
    pausas:{ abertura:280, definicao:220, pergunta:240, confirmacao:200, guarde:300, conclusao:280, pausa:400 } },
  // Cético (grave, muito lento)
  aluno7: { rate:0.78, pitch:0.86, volume:0.92, microCurta:200, microLonga:280, rateEnfase:0.72, pitchEnfase:0.83,
    pausas:{ abertura:320, definicao:280, pergunta:300, confirmacao:260, guarde:340, conclusao:320, pausa:460 } }
};

/* =====================================================
   DIÁLOGO
   ===================================================== */
const AULA = [
  { papel:'professor', tipo:'abertura',
    texto:"Bom dia, turma. Hoje vamos entender o que é *gestão de pessoas*." },
  { papel:'aluno1', tipo:'pergunta',
    texto:"Professor, gestão de pessoas é a área que cuida do quê, exatamente?" },
  { papel:'professor', tipo:'definicao',
    texto:"Boa pergunta. Gestão de pessoas é a área responsável pelo *ser humano* no trabalho." },
  { papel:'professor', tipo:'definicao',
    texto:"Ela atrai, desenvolve, motiva | e *mantém* as pessoas dentro da empresa." },
  { papel:'aluno2', tipo:'confirmacao',
    texto:"Entendi. Então é tudo que envolve gente dentro da organização." },
  { papel:'professor', tipo:'definicao',
    texto:"*Exatamente.* Tudo que envolve gente: atrair, desenvolver, motivar, manter." },
  { papel:'aluno5', tipo:'pergunta',
    texto:"E como isso funciona no dia a dia?" },
  { papel:'professor', tipo:'definicao',
    texto:"No dia a dia, aparece em *cada decisão* sobre pessoas." },
  { tipo:'pausa' },
  { papel:'aluno3', tipo:'pergunta',
    texto:"Mas professor, isso sempre foi assim?" },
  { papel:'professor', tipo:'definicao',
    texto:"*Não.* Durante muito tempo, essa área foi vista apenas como operacional." },
  { papel:'professor', tipo:'definicao',
    texto:"Cuidava de folha de pagamento, ponto, férias | e documentação." },
  { papel:'aluno1', tipo:'confirmacao',
    texto:"Ah, o famoso setor que resolvia papelada." },
  { papel:'professor', tipo:'confirmacao',
    texto:"Isso mesmo. Era o setor da *papelada*." },
  { papel:'aluno6', tipo:'pergunta',
    texto:"E o que fazia alguém mudar de ideia?" },
  { papel:'professor', tipo:'definicao',
    texto:"A percepção de que *pessoas* fazem a diferença nos resultados." },
  { tipo:'pausa' },
  { papel:'aluno2', tipo:'pergunta',
    texto:"E hoje, o que mudou?" },
  { papel:'professor', tipo:'definicao',
    texto:"Hoje o cenário mudou *completamente*." },
  { papel:'professor', tipo:'definicao',
    texto:"A gestão de pessoas passou a ser *estratégica*." },
  { papel:'professor', tipo:'definicao',
    texto:"Ela participa das *decisões importantes* da organização." },
  { papel:'aluno4', tipo:'confirmacao',
    texto:"Então ela deixou de só resolver problemas e passou a construir resultados." },
  { papel:'professor', tipo:'confirmacao',
    texto:"*Exatamente.* Essa é a virada de chave." },
  { tipo:'pausa' },
  { papel:'aluno7', tipo:'pergunta',
    texto:"Tem diferença entre gestão de pessoas | e gestão de recursos humanos?" },
  { papel:'professor', tipo:'definicao',
    texto:"Tem. E é uma diferença *importante*." },
  { papel:'professor', tipo:'definicao',
    texto:"Gestão de recursos humanos é o nome mais antigo." },
  { papel:'professor', tipo:'definicao',
    texto:"Ligado à ideia de que pessoas são *recursos*. Como máquinas, como dinheiro." },
  { papel:'professor', tipo:'definicao',
    texto:"Gestão de pessoas é o nome mais *moderno*." },
  { papel:'professor', tipo:'definicao',
    texto:"Ela enxerga o ser humano como *parceiro* da organização. Não como recurso." },
  { papel:'aluno1', tipo:'confirmacao',
    texto:"Então não é só uma troca de nome." },
  { papel:'professor', tipo:'definicao',
    texto:"*Não.* É uma mudança de *mentalidade*." },
  { papel:'professor', tipo:'definicao',
    texto:"Antes, a pessoa era vista como custo. || Agora, é vista como *diferencial competitivo*." },
  { tipo:'pausa' },
  { papel:'professor', tipo:'guarde',
    texto:"*Guarde isto.*" },
  { papel:'professor', tipo:'guarde',
    texto:"Gestão de pessoas é a área que cuida do *ser humano* no trabalho." },
  { papel:'aluno4', tipo:'guarde',
    texto:"E quando ela é estratégica, deixa de apenas resolver problemas." },
  { papel:'professor', tipo:'guarde',
    texto:"E passa a *construir resultados*." },
  { papel:'aluno2', tipo:'guarde',
    texto:"Agora ficou claro, professor." },
  { papel:'professor', tipo:'conclusao',

let synth = window.speechSynthesis;
let tocando = false;
let pausado = false;
let cancelar = false;
let indiceAtual = 0;
let velocidade = 1.0;

/* =====================================================
   RENDER
   ===================================================== */
function renderTextoLegivel(texto) {
  let t = texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
  t = t.replace(/\*([^*]+)\*/g, '<span class="enfase">$1</span>');
  return t;
}

function renderAula() {
  const el = document.getElementById('texto');
  el.innerHTML = '';
  AULA.forEach((fala, i) => {
    if (fala.tipo === 'pausa') {
      const br = document.createElement('div');
      br.className = 'quebra';
      el.appendChild(br);
      return;
    }
    const div = document.createElement('div');
    div.className = 'fala ' + fala.papel + ' futura';
    div.id = 'fala-' + i;
    const simbolo = SIMBOLOS[fala.papel] || '·';
    div.innerHTML = `<span class="simbolo">${simbolo}</span>${renderTextoLegivel(fala.texto)}`;
    el.appendChild(div);
  });
}
renderAula();

function destacarFala(idx) {
  document.querySelectorAll('.fala').forEach(el => {
    const numIdx = parseInt(el.id.replace('fala-', ''));
    el.classList.remove('falando', 'falada', 'futura');
    if (numIdx < idx) el.classList.add('falada');
    else if (numIdx === idx) el.classList.add('falando');
    else el.classList.add('futura');
  });
  const atual = document.getElementById('fala-' + idx);
  if (atual) {
    const rect = atual.getBoundingClientRect();
    if (rect.top < 80 || rect.bottom > window.innerHeight - 100) {
      atual.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
}

function resetDestaques() {
  document.querySelectorAll('.fala').forEach(el => {
    el.classList.remove('falando', 'falada');
    el.classList.add('futura');
  });
}

/* =====================================================
   BADGE
   ===================================================== */
let badgeTimer = null;
function mostrarBadge(txt) {
  const el = document.getElementById('badgeVoz');
  el.textContent = txt;
  el.classList.add('ativo');
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(() => el.classList.remove('ativo'), 1600);
}

/* =====================================================
   UI
   ===================================================== */
function setBtnEstado(playing) {
  const btn = document.getElementById('btnPlayFlut');
  const icone = document.getElementById('iconePlay');
  if (playing) {
    btn.classList.add('tocando');
    icone.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    btn.classList.remove('tocando');
    icone.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function setProgresso(pct) { document.getElementById('progMini').style.width = pct + '%'; }
function setStatus(txt)    { document.getElementById('statusMini').textContent = txt; }

function atualizarBotoesNavegacao() {
  const temAnterior = AULA.slice(0, indiceAtual).some(f => f.tipo !== 'pausa');
  const temProximo  = AULA.slice(indiceAtual + 1).some(f => f.tipo !== 'pausa');
  document.getElementById('btnAnterior').disabled = !temAnterior;
  document.getElementById('btnProximo').disabled  = !temProximo;
}

/* =====================================================
   VELOCIDADE
   ===================================================== */
const VELOCIDADES = [0.75, 1.0, 1.25, 1.5, 2.0];

function ciclarVelocidade() {
  const i = VELOCIDADES.indexOf(velocidade);
  velocidade = VELOCIDADES[(i + 1) % VELOCIDADES.length];
  const btn = document.getElementById('btnVel');
  btn.textContent = velocidade.toFixed(2).replace(/0$/, '') + '×';
  btn.classList.toggle('ativa', velocidade !== 1.0);
  if (tocando && !pausado) {
    const idx = indiceAtual;
    pararSilencioso();
    setTimeout(() => { indiceAtual = idx; tocarDeOndeParou(); }, 100);
  }
}

/* =====================================================
   PLAY / PAUSE / PULAR
   ===================================================== */
function togglePlay() {
  if (tocando && !pausado) {
    pausado = true;
    cancelar = true;
    try { synth.cancel(); } catch(e) {}
    setBtnEstado(false);
    setStatus('Pausado');
    return;
  }
  if (tocando && pausado) {
    pausado = false;
    tocarDeOndeParou();
    return;
  }
  indiceAtual = 0;
  tocarDeOndeParou();
}

function pararSilencioso() {
  cancelar = true;
  try { synth.cancel(); } catch(e) {}
  tocando = false;
  pausado = false;
  setBtnEstado(false);
}

function pularFrase(direcao) {
  let novo = indiceAtual + direcao;
  while (novo >= 0 && novo < AULA.length && AULA[novo].tipo === 'pausa') {
    novo += direcao;
  }
  if (novo < 0 || novo >= AULA.length) return;

  const estavaTocando = tocando && !pausado;
  pararSilencioso();
  indiceAtual = novo;

  if (estavaTocando) {
    setTimeout(() => tocarDeOndeParou(), 80);
  } else {
    destacarFala(indiceAtual);
    atualizarBotoesNavegacao();
    const f = AULA[indiceAtual];
    setStatus(f.papel === 'professor' ? 'Professor' : 'Aluno');
  }
}

/* =====================================================
   FALA
   ===================================================== */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) {
        const comEnfase = p.split(/(\*[^*]+\*)/g);
        comEnfase.forEach(frag => {
          if (!frag) return;
          if (frag.startsWith('*') && frag.endsWith('*')) {
            segmentos.push({ tipo:'enfase', texto: frag.slice(1, -1).trim() });
          } else if (frag.trim()) {
            segmentos.push({ tipo:'fala', texto: frag.trim() });
          }
        });
      }
    });
  });
  return segmentos;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    let resolvido = false;
    const finalizar = () => { if (!resolvido) { resolvido = true; resolve(); } };

    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = Math.max(0.1, Math.min(2.0, rate * velocidade));
    u.pitch = Math.max(0, Math.min(2.0, pitch));
    u.volume = volume ?? 1.0;
    if (voz) u.voice = voz;
    u.onend = finalizar;
    u.onerror = finalizar;

    try {
      synth.speak(u);
    } catch(e) {
      finalizar();
      return;
    }

    const estimativa = Math.max(3000, texto.length * 130 / u.rate);
    setTimeout(finalizar, estimativa);
  });
}

async function falarComMicroPausas(textoOriginal, perfil, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(perfil.microCurta / velocidade);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(perfil.microLonga / velocidade);
    } else if (seg.tipo === 'enfase') {
      await falar(seg.texto, perfil.rateEnfase, perfil.pitchEnfase, perfil.volume, voz);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, perfil.rate, perfil.pitch, perfil.volume, voz);
    }
  }
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* =====================================================
   TROCA DE VOZ
   ===================================================== */
async function trocarVoz(vozAntiga, vozNova) {
  const debugEl = document.getElementById('debugTroca');
  if (!vozNova) return;
  if (debugEl) debugEl.textContent = `Próxima voz: ${vozNova.name}`;
  mostrarBadge(`🎙️ ${vozNova.name}`);
}

/* =====================================================
   LOOP PRINCIPAL
   ===================================================== */
async function tocarDeOndeParou() {
  if (!elenco || !elenco.professor) {
    setStatus('Sem vozes pt-BR');
    return;
  }

  cancelar = false;
  tocando = true;
  pausado = false;
  setBtnEstado(true);

  const total = AULA.filter(d => d.tipo !== 'pausa').length;
  const jaFaladas = AULA.slice(0, indiceAtual).filter(d => d.tipo !== 'pausa').length;
  let faladas = jaFaladas;

  let ultimaVoz = null;
  for (let k = indiceAtual - 1; k >= 0; k--) {
    if (AULA[k].tipo !== 'pausa') {
      ultimaVoz = elenco[AULA[k].papel];
      break;
    }
  }

  for (let i = indiceAtual; i < AULA.length; i++) {
    if (cancelar) return;
    indiceAtual = i;
    const fala = AULA[i];

    if (fala.tipo === 'pausa') {
      await esperar(PERFIS.professor.pausas.pausa / velocidade);
      continue;
    }

    const voz = elenco[fala.papel];
    const perfil = PERFIS[fala.papel];

    if (voz !== ultimaVoz) {
      await trocarVoz(ultimaVoz, voz);
      if (cancelar) return;
      ultimaVoz = voz;
    }

    const pausaAntes = perfil.pausas[fala.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes / velocidade);

    destacarFala(i);
    atualizarBotoesNavegacao();

    const label = fala.papel === 'professor'
      ? `Professor · pitch ${perfil.pitch.toFixed(2)}`
      : `Aluno · pitch ${perfil.pitch.toFixed(2)}`;
    setStatus(label);

    faladas++;
    setProgresso(Math.round((faladas / total) * 100));

    await falarComMicroPausas(fala.texto, perfil, voz);
    if (cancelar) return;
  }

  if (!cancelar) {
    resetDestaques();
    setProgresso(100);
    setStatus('Fim');
    setTimeout(() => {
      setBtnEstado(false);
      setProgresso(0);
      setStatus('Pronto');
      tocando = false;
      pausado = false;
      indiceAtual = 0;
    }, 800);
  }
}

/* =====================================================
   PLAYER ARRASTÁVEL
   ===================================================== */
const player = document.getElementById('playerFlutuante');
const handle = document.getElementById('handle');
let arrastando = false;
let startX = 0, startY = 0, startLeft = 0, startTop = 0;
let moveu = false;

(function restaurarPosicao() {
  try {
    const salvo = JSON.parse(localStorage.getItem('playerPos') || 'null');
    if (salvo && typeof salvo.left === 'number' && typeof salvo.top === 'number') {
      const maxL = window.innerWidth - 80;
      const maxT = window.innerHeight - 80;
      player.style.left = Math.max(0, Math.min(maxL, salvo.left)) + 'px';
      player.style.top  = Math.max(0, Math.min(maxT, salvo.top)) + 'px';
      player.style.right = 'auto';
      player.style.bottom = 'auto';
    }
  } catch(e) {}
})();

function iniciarArraste(e) {
  if (e.target !== handle && !handle.contains(e.target)) return;
  arrastando = true;
  moveu = false;
  player.classList.add('arrastando');
  const rect = player.getBoundingClientRect();
  startLeft = rect.left;
  startTop = rect.top;
  const ponto = e.touches ? e.touches[0] : e;
  startX = ponto.clientX;
  startY = ponto.clientY;
  player.style.left = startLeft + 'px';
  player.style.top = startTop + 'px';
  player.style.right = 'auto';
  player.style.bottom = 'auto';
  e.preventDefault();
}

function moverArraste(e) {
  if (!arrastando) return;
  const ponto = e.touches ? e.touches[0] : e;
  const dx = ponto.clientX - startX;
  const dy = ponto.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moveu = true;
  const novoLeft = Math.max(8, Math.min(window.innerWidth - player.offsetWidth - 8, startLeft + dx));
  const novoTop  = Math.max(8, Math.min(window.innerHeight - player.offsetHeight - 8, startTop + dy));
  player.style.left = novoLeft + 'px';
  player.style.top  = novoTop + 'px';
}

function soltarArraste(e) {
  if (!arrastando) return;
  arrastando = false;
  player.classList.remove('arrastando');
  const rect = player.getBoundingClientRect();
  const centroX = rect.left + rect.width / 2;
  const meio = window.innerWidth / 2;
  const destinoX = centroX < meio ? 12 : window.innerWidth - rect.width - 12;
  player.style.transition = 'left .25s cubic-bezier(.2,.8,.3,1)';
  player.style.left = destinoX + 'px';
  setTimeout(() => { player.style.transition = ''; }, 300);
  try {
    localStorage.setItem('playerPos', JSON.stringify({
      left: destinoX, top: parseInt(player.style.top)
    }));
  } catch(e) {}
  if (e && e.preventDefault) e.preventDefault();
}

handle.addEventListener('mousedown', iniciarArraste);
document.addEventListener('mousemove', moverArraste);
document.addEventListener('mouseup', soltarArraste);
handle.addEventListener('touchstart', iniciarArraste, { passive: false });
document.addEventListener('touchmove', moverArraste, { passive: false });
document.addEventListener('touchend', soltarArraste);

let toquesHandle = [];
handle.addEventListener('touchend', () => {
  if (moveu) return;
  const agora = Date.now();
  toquesHandle.push(agora);
  toquesHandle = toquesHandle.filter(t => agora - t < 600);

  if (toquesHandle.length === 3) {
    document.getElementById('debugPanel').classList.toggle('ativo');
    atualizarDebug();
    toquesHandle = [];
  } else if (toquesHandle.length === 2) {
    setTimeout(() => {
      if (toquesHandle.length === 2) {
        player.classList.toggle('minimizado');
        toquesHandle = [];
      }
    }, 620);
  }
});

/* =====================================================
   DEBUG
   ===================================================== */
function atualizarDebug() {
  const el = document.getElementById('debugElenco');
  if (!elenco) { el.textContent = 'Elenco não montado.'; return; }

  const linhas = Object.entries(elenco).map(([papel, voz]) => {
    const ativo = AULA[indiceAtual] && AULA[indiceAtual].papel === papel ? ' ativa' : '';
    const perfil = PERFIS[papel];
    const pitchTxt = perfil ? perfil.pitch.toFixed(2) : '—';
    const rateTxt  = perfil ? perfil.rate.toFixed(2)  : '—';
    return `<div class="linha${ativo}">
      <span>${papel}</span>
      <span class="voz">${voz.name} · pitch ${pitchTxt} · rate ${rateTxt}</span>
    </div>`;
  }).join('');

  const unicas = new Set(Object.values(elenco).map(v => v.name)).size;

  let aviso = '';
  if (modoIOS) {
    aviso = `<div class="aviso">📱 Modo iOS: mesma voz base · diferenciação por pitch/rate. O Safari expõe apenas ${todasAsVozes.length} voz(es).</div>`;
  } else if (unicas < 3) {
    aviso = `<div class="aviso">⚠️ Só ${unicas} vozes distintas. Instale mais em Ajustes → Acessibilidade → Conteúdo Falado → Vozes.</div>`;
  }

  el.innerHTML = linhas + `<div style="margin-top:8px;color:#94a3b8">
    Vozes únicas: ${unicas} · pt-BR disponíveis: ${vozesPtBR().length}<br>
    Total exposto pelo navegador: ${todasAsVozes.length}<br>
    Modo: ${isIOS ? 'iPhone/Safari (vozes + pitch/rate)' : (isMicrosoft ? 'Microsoft (vozes distintas)' : 'Desktop (vozes distintas)')}
  </div>` + aviso;
}

function fecharDebug() {
  document.getElementById('debugPanel').classList.remove('ativo');
}

/* =====================================================
   ELENCO — REVISADO
   ===================================================== */
function embaralhar(lista) {
  const a = [...lista];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Prioridade de vozes para o PROFESSOR (masculino motivacional) */
const PRIORIDADE_PROFESSOR = [
  /daniel/i,
  /antonio|antônio/i,
  /ricardo/i,
  /felipe/i,
  /lucas/i,
  /thiago/i,
  /paulo/i,
  /microsoft.*(daniel|antonio|ricardo|felipe)/i,
  /google.*português/i
];

/* Prioridade de vozes para ALUNAS (femininas, contraste com o professor) */
const PRIORIDADE_ALUNAS = [
  /maria/i,
  /francisca/i,
  /thalita|talita/i,
  /luciana/i,
  /fernanda/i,
  /camila/i,
  /joana/i
];

function escolherVozProfessor(vozes) {
  for (const regex of PRIORIDADE_PROFESSOR) {
    const v = vozes.find(v => regex.test(v.name));
    if (v) return v;
  }
  const masc = vozes.filter(v =>
    /daniel|felipe|ricardo|lucas|joão|joao|carlos|pedro|paulo|thiago|mateus|gustavo|arthur|antonio|antônio|male|homem/i.test(v.name)
  );
  if (masc.length) return embaralhar(masc)[0];
  return embaralhar(vozes)[0];
}

function escolherVozAluna(vozes, usadas) {
  for (const regex of PRIORIDADE_ALUNAS) {
    const v = vozes.find(v => regex.test(v.name) && !usadas.has(v));
    if (v) return v;
  }
  const fem = vozes.filter(v =>
    /maria|francisca|thalita|talita|luciana|fernanda|camila|joana|helena|mariana|ana|beatriz|carolina|female|mulher/i.test(v.name) && !usadas.has(v)
  );
  if (fem.length) return embaralhar(fem)[0];
  return null;
}

function distribuirElenco(vozes) {
  if (!vozes.length) return null;

  vozesDisponiveis = [...vozes];

  const professor = escolherVozProfessor(vozes);
  const usadas = new Set([professor]);
  const e = { professor };

  const alunasFem = ['aluno1','aluno3','aluno5','aluno6'];
  alunasFem.forEach(papel => {
    const v = escolherVozAluna(vozes, usadas);
    if (v) {
      e[papel] = v;
      usadas.add(v);
    }
  });

  const restantes = embaralhar(vozes.filter(v => !usadas.has(v)));
  const papeisRestantes = PAPEIS_ALUNO.filter(p => !e[p]);
  papeisRestantes.forEach((papel, i) => {
    if (restantes.length) {
      e[papel] = restantes[i % restantes.length];
    } else {
      e[papel] = embaralhar(vozes)[i % vozes.length];
    }
  });

  modoIOS = isIOS;
  return e;
}

/* =====================================================
   PRÉ-AQUECIMENTO
   ===================================================== */
let preAquecido = false;
function preAquecerVozes() {
  if (preAquecido) return;
  preAquecido = true;
  if (!elenco) return;
  const vozesUnicas = [...new Set(Object.values(elenco))];
  vozesUnicas.forEach((voz, i) => {
    setTimeout(() => {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.voice = voz;
        u.volume = 0.01;
        u.rate = 2.0;
        synth.speak(u);
      } catch(e) {}
    }, i * 100);
  });
}

/* =====================================================
   INIT
   ===================================================== */
setStatus('Carregando vozes…');

carregarVozes(() => {
  const ptBR = vozesPtBR();
  if (ptBR.length === 0) {
    setStatus('Sem vozes pt-BR');
    mostrarBadge('⚠️ Nenhuma voz pt-BR');
    if (todasAsVozes.length > 0) {
      elenco = distribuirElenco(todasAsVozes);
      setStatus(`${todasAsVozes.length} vozes (não pt-BR)`);
    } else {
      setStatus('Nenhuma voz disponível');
    }
    atualizarBotoesNavegacao();
    return;
  }

  elenco = distribuirElenco(ptBR);
  const unicas = new Set(Object.values(elenco).map(v => v.name)).size;

  if (modoIOS) {
    setStatus(`📱 iOS · pitch/rate variados`);
  } else {
    setStatus(`${unicas} vozes pt-BR · toque ▶`);
  }

  atualizarBotoesNavegacao();
  atualizarDebug();
});

document.addEventListener('touchstart', preAquecerVozes, { once: true, passive: true });
document.addEventListener('mousedown', preAquecerVozes, { once: true });
