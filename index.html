<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sala de Aula — Gestão de Pessoas | RH</title>
<style>
  /* ═══════════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════════ */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html { -webkit-text-size-adjust: 100%; }

  :root {
    --bg: #0a0e1a;
    --bg-elev: #131a2b;
    --surface: rgba(148, 163, 184, .05);
    --surface-hover: rgba(148, 163, 184, .09);
    --border: rgba(148, 163, 184, .12);
    --border-strong: rgba(148, 163, 184, .22);
    --text: #cbd5e1;
    --text-dim: #94a3b8;
    --text-faint: #64748b;
    --accent: #8b5cf6;
    --accent-strong: #7c3aed;
    --accent-soft: rgba(139, 92, 246, .15);
    --accent-glow: rgba(139, 92, 246, .35);
    --page-bg: rgba(148, 163, 184, .04);
    --page-border: rgba(148, 163, 184, .14);
    --page-text: #cbd5e1;
    --page-text-strong: #e2e8f0;
    --enfase: #fbbf24;
    --shadow-lg: 0 12px 32px rgba(0,0,0,.35);
    --shadow-xl: 0 24px 64px rgba(0,0,0,.5);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;
    --font-tamanho: 1.02rem;
    --transition: cubic-bezier(.2, .8, .3, 1);
  }

  body[data-tema="claro"] {
    --bg: #f1f5f9;
    --bg-elev: #ffffff;
    --surface: rgba(15, 23, 42, .03);
    --surface-hover: rgba(15, 23, 42, .06);
    --border: rgba(15, 23, 42, .08);
    --border-strong: rgba(15, 23, 42, .15);
    --text: #334155;
    --text-dim: #64748b;
    --text-faint: #94a3b8;
    --accent: #7c3aed;
    --accent-soft: rgba(124, 58, 237, .12);
    --page-bg: #ffffff;
    --page-border: rgba(15, 23, 42, .06);
    --page-text: #1e293b;
    --page-text-strong: #0f172a;
    --enfase: #b45309;
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, .08);
    --shadow-xl: 0 24px 64px rgba(15, 23, 42, .12);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Georgia, serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    transition: background .4s var(--transition), color .4s var(--transition);
    padding-bottom: calc(env(safe-area-inset-bottom) + 140px);
    -webkit-font-smoothing: antialiased;
  }

  /* ═══════════════════════════════════════════════
     HEADER
     ═══════════════════════════════════════════════ */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: linear-gradient(180deg, var(--bg) 0%, transparent 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .app-titulo {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: .8;
  }

  .btn-menu {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s var(--transition), background .2s;
    touch-action: manipulation;
  }
  .btn-menu:hover { background: var(--surface-hover); }
  .btn-menu:active { transform: scale(.92); }

  /* ═══════════════════════════════════════════════
     CONTEÚDO / FOLHA
     ═══════════════════════════════════════════════ */
  .conteudo {
    flex: 1;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }

  .folha {
    background: var(--page-bg);
    border: 1px solid var(--page-border);
    border-radius: var(--radius-lg);
    padding: 22px 22px 26px;
    position: relative;
    box-shadow: var(--shadow-lg);
    transition: background .4s var(--transition), border-color .4s var(--transition), opacity .3s;
    font-family: Georgia, "Times New Roman", serif;
    font-size: var(--font-tamanho);
    line-height: 1.75;
    color: var(--page-text);
    text-align: justify;
    hyphens: auto;
    -webkit-hyphens: auto;
    animation: fadeInUp .5s var(--transition);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .folha::before {
    content: '';
    position: absolute;
    top: 0;
    left: 28px;
    right: 28px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #2563eb);
    border-radius: 0 0 3px 3px;
    opacity: .9;
  }

  .folha-header {
    text-align: center;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--page-border);
  }

  .folha-titulo {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .62rem;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 10px;
  }

  .folha-bolinhas {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .bolinha {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-strong);
    transition: background .3s var(--transition), transform .3s var(--transition);
  }
  .bolinha.ativa {
    background: var(--accent);
    transform: scale(1.5);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ═══════════════════════════════════════════════
     FALAS
     ═══════════════════════════════════════════════ */
  .fala {
    display: inline;
    margin: 0;
    padding: 0;
    transition: background .3s, color .3s;
    cursor: pointer;
    border-radius: 3px;
  }
  .fala::after { content: ' '; }

  .simbolo {
    font-weight: 700;
    margin-right: 3px;
    font-size: 1em;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    opacity: .9;
  }
  .fala.professor .simbolo { color: #a78bfa; font-size: 1.1em; letter-spacing: .04em; }
  .fala.aluno1 .simbolo   { color: #60a5fa; }
  .fala.aluno2 .simbolo   { color: #fbbf24; }
  .fala.aluno3 .simbolo   { color: #34d399; }
  .fala.aluno4 .simbolo   { color: #f472b6; }
  .fala.aluno5 .simbolo   { color: #22d3ee; }
  .fala.aluno6 .simbolo   { color: #fb923c; }
  .fala.aluno7 .simbolo   { color: #c084fc; }

  .fala.falando {
    background: var(--accent-soft);
    padding: 1px 4px;
    margin: 0 -4px;
    color: var(--page-text-strong);
    font-weight: 500;
  }
  .fala.falando .simbolo { opacity: 1; }

  .fala.falada { opacity: .35; }
  .fala.futura { opacity: .92; }
  .fala:hover { background: var(--accent-soft); }

  .enfase {
    color: var(--enfase);
    font-weight: 700;
    font-style: italic;
    letter-spacing: .01em;
  }

  .quebra { display: block; height: 14px; }

  /* ═══════════════════════════════════════════════
     MENU DRAWER
     ═══════════════════════════════════════════════ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s var(--transition);
    z-index: 9998;
  }
  .overlay.ativo {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(340px, 88vw);
    background: var(--bg-elev);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-xl);
    z-index: 9999;
    transform: translateX(100%);
    transition: transform .4s var(--transition);
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .drawer.ativo { transform: translateX(0); }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .drawer-titulo {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .btn-fechar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s, background .2s;
    touch-action: manipulation;
  }
  .btn-fechar:hover { background: var(--surface-hover); }
  .btn-fechar:active { transform: scale(.9); }

  .secao { margin-bottom: 26px; }
  .secao-titulo {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .58rem;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .toggle-linha {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background .2s, border-color .2s;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .toggle-linha:hover { background: var(--surface-hover); }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: .86rem;
    font-weight: 500;
    color: var(--text);
  }
  .toggle-label .emoji { font-size: 1.1rem; }

  .switch {
    position: relative;
    width: 44px;
    height: 26px;
    background: var(--border-strong);
    border-radius: 13px;
    transition: background .3s var(--transition);
    flex-shrink: 0;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform .3s var(--transition);
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch.ativo { background: var(--accent); }
  .switch.ativo::after { transform: translateX(18px); }

  .fonte-controle {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }

  .btn-fonte {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: .82rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, transform .15s, border-color .2s;
    touch-action: manipulation;
    flex-shrink: 0;
  }
  .btn-fonte:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .btn-fonte:active { transform: scale(.9); }
  .btn-fonte:disabled { opacity: .3; cursor: not-allowed; }

  .fonte-barra {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .fonte-barra-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    background: linear-gradient(90deg, var(--accent), #2563eb);
    border-radius: 2px;
    transition: width .3s var(--transition);
  }

  .blocos-lista {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bloco-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background .2s, border-color .2s, transform .15s;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: left;
    color: var(--text);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .bloco-item:hover { background: var(--surface-hover); }
  .bloco-item:active { transform: scale(.98); }

  .bloco-item.ativo {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .bloco-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .82rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: background .2s, color .2s;
  }
  .bloco-item.ativo .bloco-num {
    background: var(--accent);
    color: #fff;
  }

  .bloco-info { flex: 1; min-width: 0; }
  .bloco-nome {
    font-size: .86rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .bloco-item.ativo .bloco-nome { color: var(--accent); }
  .bloco-desc {
    font-size: .68rem;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bloco-check {
    color: var(--accent);
    font-size: 1rem;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .2s;
  }
  .bloco-item.ativo .bloco-check { opacity: 1; }

  /* ═══════════════════════════════════════════════
     PLAYER
     ═══════════════════════════════════════════════ */
  #player {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    left: 50%;
    transform: translateX(-50%);
    width: min(340px, calc(100vw - 32px));
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-xl);
    padding: 8px 8px 10px;
    z-index: 500;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    animation: fadeInUp .5s var(--transition);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .player-handle {
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    margin-bottom: 2px;
  }
  .player-handle::before {
    content: '';
    width: 32px;
    height: 3px;
    background: var(--border-strong);
    border-radius: 2px;
  }

  .player-controles {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 0 4px;
  }

  .btn-ctrl {
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    transition: background .2s, transform .15s, color .2s;
    touch-action: manipulation;
    font-family: inherit;
  }
  .btn-ctrl:hover:not(:disabled) { background: var(--surface-hover); }
  .btn-ctrl:active:not(:disabled) { transform: scale(.9); }
  .btn-ctrl:disabled { opacity: .25; cursor: not-allowed; }

  .btn-sec { width: 40px; height: 40px; }

  .btn-play {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: #fff;
    box-shadow: 0 6px 20px var(--accent-glow);
    transition: transform .2s var(--transition), background .3s, box-shadow .3s;
  }
  .btn-play:hover { transform: scale(1.05); }
  .btn-play:active { transform: scale(.95); }
  .btn-play.tocando {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 6px 20px rgba(220, 38, 38, .4);
  }

  .player-rodape {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px 0;
    gap: 8px;
  }

  .btn-vel {
    padding: 5px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .7rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
    touch-action: manipulation;
    letter-spacing: .02em;
  }
  .btn-vel:hover { background: var(--surface-hover); }
  .btn-vel.ativa {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .player-progresso {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .66rem;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: .05em;
  }

  /* ═══════════════════════════════════════════════
     TOAST
     ═══════════════════════════════════════════════ */
  .toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 120px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 99px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: .78rem;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s var(--transition), transform .3s var(--transition);
    z-index: 9997;
    white-space: nowrap;
    max-width: calc(100vw - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.ativo {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ═══════════════════════════════════════════════
     DEBUG
     ═══════════════════════════════════════════════ */
  #debugPanel {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    background: rgba(0, 0, 0, .95);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px;
    color: #cbd5e1;
    font-family: ui-monospace, Menlo, monospace;
    font-size: .68rem;
    line-height: 1.5;
    z-index: 10000;
    max-height: 70vh;
    overflow-y: auto;
    display: none;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #debugPanel.ativo { display: block; }
  #debugPanel h3 {
    font-size: .72rem;
    color: #fbbf24;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #debugPanel h3 button {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: .65rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: 700;
  }
  #debugPanel .linha {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid rgba(148, 163, 184, .1);
  }
  #debugPanel .linha.ativa { color: #fbbf24; font-weight: 700; }
  #debugPanel .voz { color: #93c5fd; }
  #debugPanel .info {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(148, 163, 184, .15);
    color: #94a3b8;
    font-size: .62rem;
  }
  #debugPanel .aviso {
    margin-top: 8px;
    padding: 8px;
    background: rgba(220, 38, 38, .15);
    border-radius: 6px;
    color: #fca5a5;
    font-size: .65rem;
  }
  #debugPanel .sucesso {
    margin-top: 8px;
    padding: 8px;
    background: rgba(34, 197, 94, .15);
    border-radius: 6px;
    color: #86efac;
    font-size: .65rem;
  }

  /* ═══════════════════════════════════════════════
     RESPONSIVO
     ═══════════════════════════════════════════════ */
  @media (max-width: 380px) {
    .folha { padding: 18px 16px 22px; font-size: .95rem; }
    .conteudo { padding: 0 14px; }
    #player { width: calc(100vw - 24px); }
    .btn-sec { width: 36px; height: 36px; }
    .btn-play { width: 50px; height: 50px; }
  }

<script>
/* ═══════════════════════════════════════════════════
   AMBIENTE
   ═══════════════════════════════════════════════════ */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ✅ CORREÇÃO #1: synth declarado AQUI (antes de qualquer uso)
const synth = window.speechSynthesis || null;

/* ═══════════════════════════════════════════════════
   SEGURANÇA — escape HTML (blindagem contra XSS)
   ═══════════════════════════════════════════════════ */
function escapeHTML(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ═══════════════════════════════════════════════════
   PREFERÊNCIAS
   ═══════════════════════════════════════════════════ */
const FONTES = [0.80, 0.88, 0.95, 1.02, 1.10, 1.20, 1.30, 1.45];

let prefTema = 'escuro';
let prefTamanho = 1.02;
let prefVelocidade = 1.0;

try {
  const t = localStorage.getItem('pref-tema');
  if (t === 'claro' || t === 'escuro') prefTema = t;

  const s = parseFloat(localStorage.getItem('pref-tamanho'));
  if (isFinite(s) && s >= 0.5 && s <= 2.0) prefTamanho = s;

  const v = parseFloat(localStorage.getItem('pref-velocidade'));
  if (isFinite(v) && v >= 0.5 && v <= 3.0) prefVelocidade = v;
} catch(e) {}

function salvarPrefs() {
  try {
    localStorage.setItem('pref-tema', prefTema);
    localStorage.setItem('pref-tamanho', String(prefTamanho));
    localStorage.setItem('pref-velocidade', String(prefVelocidade));
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════
   TEMA
   ═══════════════════════════════════════════════════ */
function aplicarTema() {
  document.body.setAttribute('data-tema', prefTema);
  const emoji = document.getElementById('temaEmoji');
  const label = document.getElementById('temaLabel');
  const sw = document.getElementById('temaSwitch');
  if (emoji) emoji.textContent = prefTema === 'claro' ? '☀️' : '🌙';
  if (label) label.textContent = prefTema === 'claro' ? 'Modo claro' : 'Modo escuro';
  if (sw) sw.classList.toggle('ativo', prefTema === 'claro');
}

function alternarTema() {
  prefTema = prefTema === 'claro' ? 'escuro' : 'claro';
  salvarPrefs();
  aplicarTema();
}

/* ═══════════════════════════════════════════════════
   FONTE
   ═══════════════════════════════════════════════════ */
function acharIndiceFonte() {
  let melhor = 0;
  let menorDist = Math.abs(FONTES[0] - prefTamanho);
  for (let i = 1; i < FONTES.length; i++) {
    const d = Math.abs(FONTES[i] - prefTamanho);
    if (d < menorDist) { menorDist = d; melhor = i; }
  }
  return melhor;
}

function aplicarFonte() {
  const tam = (isFinite(prefTamanho) && prefTamanho > 0.3 && prefTamanho < 2.5) ? prefTamanho : 1.02;
  document.documentElement.style.setProperty('--font-tamanho', tam + 'rem');

  const i = acharIndiceFonte();
  const pct = ((i + 1) / FONTES.length) * 100;
  const fill = document.getElementById('fonteBarraFill');
  if (fill) fill.style.width = pct + '%';

  const btnM = document.getElementById('btnFonteMenos');
  const btnP = document.getElementById('btnFonteMais');
  if (btnM) btnM.disabled = (i <= 0);
  if (btnP) btnP.disabled = (i >= FONTES.length - 1);
}

function ajustarFonte(direcao) {
  const i = acharIndiceFonte();
  const novo = Math.max(0, Math.min(FONTES.length - 1, i + direcao));
  if (novo === i) return;
  prefTamanho = FONTES[novo];
  salvarPrefs();
  aplicarFonte();
}

/* ═══════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════
   VOZES
   ═══════════════════════════════════════════════════ */
let todasAsVozes = [];
let elenco = null;
let felipeEncontrado = false;
let iosDesbloqueado = false;

function carregarVozes(callback) {
  if (!synth) { callback(); return; }
  let jaChamou = false;
  const finalizar = () => {
    if (jaChamou) return;
    jaChamou = true;
    callback();
  };

  try {
    let vozes = speechSynthesis.getVoices();
    if (vozes.length > 0) { todasAsVozes = vozes; finalizar(); return; }

    const handler = () => {
      try {
        vozes = speechSynthesis.getVoices();
        if (vozes.length > 0) {
          todasAsVozes = vozes;
          speechSynthesis.removeEventListener('voiceschanged', handler);
          finalizar();
        }
      } catch(e) { finalizar(); }
    };

    if (speechSynthesis.addEventListener) {
      speechSynthesis.addEventListener('voiceschanged', handler);
    } else {
      speechSynthesis.onvoiceschanged = handler;
    }

    let tentativas = 0;
    const poll = () => {
      try {
        tentativas++;
        vozes = speechSynthesis.getVoices();
        if (vozes.length > 0) { todasAsVozes = vozes; finalizar(); return; }
        if (tentativas < 30) setTimeout(poll, 200);
        else finalizar();
      } catch(e) { finalizar(); }
    };
    setTimeout(poll, 200);
  } catch(e) { finalizar(); }
}

function vozesPtBR() {
  return todasAsVozes.filter(v => {
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    return lang === 'pt-br' || lang.startsWith('pt-br');
  });
}

/* ═══════════════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════════════ */
let tocando = false;
let pausado = false;
let cancelar = false;
let indiceCapitulo = 0;
let indiceAtual = 0;
let velocidade = prefVelocidade;

function getAulaAtual() { return CAPITULOS[indiceCapitulo].aula; }
function getTotalCapitulos() { return CAPITULOS.length; }

/* ═══════════════════════════════════════════════════
   iOS UNLOCK — Reforçado (com guarda)
   ═══════════════════════════════════════════════════ */
function desbloquearAudioIOS() {
  if (!isIOS) return;
  if (iosDesbloqueado) return;
  if (!synth) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0.01;
    u.rate = 2.0;
    u.pitch = 1.0;
    if (elenco && elenco.professor) u.voice = elenco.professor;
    synth.speak(u);
    iosDesbloqueado = true;
  } catch(e) {}
}

function revalidarUnlockIOS() {
  if (!isIOS) return;
  if (!synth) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0.01;
    u.rate = 2.0;
    if (elenco && elenco.professor) u.voice = elenco.professor;
    synth.speak(u);
  } catch(e) {}
}

document.addEventListener('touchstart', desbloquearAudioIOS, { once: true, passive: true });
document.addEventListener('click', desbloquearAudioIOS, { once: true });

/* ═══════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════ */
function renderTextoLegivel(texto) {
  let t = String(texto).replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
  t = escapeHTML(t);
  t = t.replace(/\*([^*]+)\*/g, '<span class="enfase">$1</span>');
  return t;
}

function renderCapitulo() {
  const el = document.getElementById('folha');
  if (!el) return;
  el.style.opacity = 0;
  setTimeout(function() {
    el.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'folha-header';

    const titulo = document.createElement('div');
    titulo.className = 'folha-titulo';
    titulo.textContent = CAPITULOS[indiceCapitulo].subtitulo;
    header.appendChild(titulo);

    const bolinhas = document.createElement('div');
    bolinhas.className = 'folha-bolinhas';
    for (let p = 0; p < getTotalCapitulos(); p++) {
      const b = document.createElement('div');
      b.className = 'bolinha' + (p === indiceCapitulo ? ' ativa' : '');
      bolinhas.appendChild(b);
    }
    header.appendChild(bolinhas);
    el.appendChild(header);

    const aula = getAulaAtual();
    aula.forEach(function(fala, i) {
      if (fala.tipo === 'pausa') {
        const br = document.createElement('div');
        br.className = 'quebra';
        el.appendChild(br);
        return;
      }
      const div = document.createElement('div');
      div.className = 'fala ' + fala.papel + ' futura';
      div.id = 'fala-' + i;
      const simbolo = SIMBOLOS[fala.papel] || '·';
      div.innerHTML = '<span class="simbolo">' + simbolo + '</span>' + renderTextoLegivel(fala.texto);
      div.addEventListener('click', function() { irParaFala(i); });
      el.appendChild(div);
    });

    el.style.opacity = 1;
    atualizarProgresso();
    atualizarBotoesNavegacao();
  }, 150);
}

function irParaFala(idx) {
  const aula = getAulaAtual();
  if (idx < 0 || idx >= aula.length) return;
  if (aula[idx].tipo === 'pausa') return;

  const estavaTocando = tocando && !pausado;
  pararSilencioso();
  indiceAtual = idx;

  destacarFala(idx);
  atualizarBotoesNavegacao();

  if (estavaTocando) {
    setTimeout(function() { tocarDeOndeParou(); }, 80);
  } else {
    mostrarToast('📍 Fala ' + contarFalas(idx));
  }
}

function contarFalas(idx) {
  const aula = getAulaAtual();
  let n = 0;
  for (let k = 0; k <= idx && k < aula.length; k++) {
    if (aula[k].tipo !== 'pausa') n++;
  }
  const total = aula.filter(function(f) { return f.tipo !== 'pausa'; }).length;
  return n + ' / ' + total;
}

function destacarFala(idx) {
  document.querySelectorAll('.fala').forEach(function(el) {
    const numIdx = parseInt(el.id.replace('fala-', ''));
    el.classList.remove('falando', 'falada', 'futura');
    if (numIdx < idx) el.classList.add('falada');
    else if (numIdx === idx) el.classList.add('falando');
    else el.classList.add('futura');
  });
  const atual = document.getElementById('fala-' + idx);
  if (atual) {
    const rect = atual.getBoundingClientRect();
    if (rect.top < 100 || rect.bottom > window.innerHeight - 220) {
      atual.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function resetDestaques() {
  document.querySelectorAll('.fala').forEach(function(el) {
    el.classList.remove('falando', 'falada');
    el.classList.add('futura');
  });
}

/* ═══════════════════════════════════════════════════
   NAVEGAÇÃO DE CAPÍTULO
   ═══════════════════════════════════════════════════ */
function irParaCapitulo(novo) {
  if (novo < 0 || novo >= getTotalCapitulos()) return;
  if (novo === indiceCapitulo) return;

  const estavaTocando = tocando && !pausado;
  pararSilencioso();

  indiceCapitulo = novo;
  indiceAtual = 0;

  renderCapitulo();
  atualizarListaBlocos();
  mostrarToast('📖 ' + CAPITULOS[indiceCapitulo].subtitulo);

  if (estavaTocando) {
    setTimeout(function() { tocarDeOndeParou(); }, 400);
  }
}

function pularCapitulo(direcao) {
  irParaCapitulo(indiceCapitulo + direcao);
}

function atualizarProgresso() {
  const el = document.getElementById('playerProgresso');
  if (el) el.textContent = 'Bloco ' + (indiceCapitulo + 1) + ' / ' + getTotalCapitulos();
}

function atualizarListaBlocos() {
  const el = document.getElementById('blocosLista');
  if (!el) return;
  el.innerHTML = '';
  CAPITULOS.forEach(function(cap, i) {
    const item = document.createElement('button');
    item.className = 'bloco-item' + (i === indiceCapitulo ? ' ativo' : '');
    item.type = 'button';

    const num = document.createElement('div');
    num.className = 'bloco-num';
    num.textContent = String(i + 1);

    const info = document.createElement('div');
    info.className = 'bloco-info';

    const nome = document.createElement('div');
    nome.className = 'bloco-nome';
    nome.textContent = cap.titulo;

    const desc = document.createElement('div');
    desc.className = 'bloco-desc';
    desc.textContent = cap.subtitulo;

    info.appendChild(nome);
    info.appendChild(desc);

    const check = document.createElement('div');
    check.className = 'bloco-check';
    check.textContent = '✓';

    item.appendChild(num);
    item.appendChild(info);
    item.appendChild(check);

    item.addEventListener('click', function() {
      if (i === indiceCapitulo) return;
      irParaCapitulo(i);
      setTimeout(fecharMenu, 200);
    });
    el.appendChild(item);
  });
}

/* ═══════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════ */
function setBtnEstado(playing) {
  const btn = document.getElementById('btnPlay');
  const icone = document.getElementById('iconePlay');
  if (!btn || !icone) return;
  if (playing) {
    btn.classList.add('tocando');
    icone.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    btn.classList.remove('tocando');
    icone.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function atualizarBotoesNavegacao() {
  const aula = getAulaAtual();
  const btnA = document.getElementById('btnAnterior');
  const btnP = document.getElementById('btnProximo');
  const btnCA = document.getElementById('btnCapAnterior');
  const btnCP = document.getElementById('btnCapProximo');

  const ehPrimeiroCap = (indiceCapitulo === 0);
  const ehUltimoCap = (indiceCapitulo === getTotalCapitulos() - 1);

  if (btnA && btnP) {
    const temAnterior = aula.slice(0, indiceAtual).some(function(f) { return f.tipo !== 'pausa'; });
    const temProximo  = aula.slice(indiceAtual + 1).some(function(f) { return f.tipo !== 'pausa'; });

    btnA.disabled = !temAnterior && ehPrimeiroCap;
    btnP.disabled = !temProximo && ehUltimoCap;

    if (!temProximo && !ehUltimoCap) btnP.disabled = false;
    if (!temAnterior && !ehPrimeiroCap) btnA.disabled = false;
  }
  if (btnCA) btnCA.disabled = ehPrimeiroCap;
  if (btnCP) btnCP.disabled = ehUltimoCap;
}

/* ═══════════════════════════════════════════════════
   VELOCIDADE
   ═══════════════════════════════════════════════════ */
const VELOCIDADES = [0.75, 1.0, 1.25, 1.5, 2.0];

function atualizarBtnVel() {
  const btn = document.getElementById('btnVel');
  if (!btn) return;
  btn.textContent = velocidade.toFixed(2).replace(/0$/, '') + '×';
  btn.classList.toggle('ativa', velocidade !== 1.0);
}

function ciclarVelocidade() {
  const i = VELOCIDADES.indexOf(velocidade);
  velocidade = VELOCIDADES[(i + 1) % VELOCIDADES.length];
  prefVelocidade = velocidade;
  salvarPrefs();
  atualizarBtnVel();
  mostrarToast('⚡ ' + velocidade.toFixed(2).replace(/0$/, '') + '×');
  if (tocando && !pausado) {
    const idx = indiceAtual;
    pararSilencioso();
    setTimeout(function() { indiceAtual = idx; tocarDeOndeParou(); }, 100);
  }
}

/* ═══════════════════════════════════════════════════
   PLAY / PAUSE / PULAR
   ═══════════════════════════════════════════════════ */
function togglePlay() {
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    mostrarToast('⚠️ Áudio não compatível com este navegador');
    return;
  }
  desbloquearAudioIOS();
  if (isIOS) revalidarUnlockIOS();

  if (tocando && !pausado) {
    pausado = true;
    cancelar = true;
    try { synth.cancel(); } catch(e) {}
    setBtnEstado(false);
    return;
  }
  if (tocando && pausado) {
    pausado = false;
    setTimeout(function() { tocarDeOndeParou(); }, isIOS ? 150 : 60);
    return;
  }
  indiceAtual = 0;
  setTimeout(function() { tocarDeOndeParou(); }, isIOS ? 180 : 80);
}

function pararSilencioso() {
  cancelar = true;
  if (synth) { try { synth.cancel(); } catch(e) {} }
  tocando = false;
  pausado = false;
  setBtnEstado(false);
}

function pularFrase(direcao) {
  const aula = getAulaAtual();
  let novo = indiceAtual + direcao;
  while (novo >= 0 && novo < aula.length && aula[novo].tipo === 'pausa') novo += direcao;

  if (novo < 0) {
    if (indiceCapitulo > 0) {
      irParaCapitulo(indiceCapitulo - 1);
      const anterior = getAulaAtual();
      for (let i = anterior.length - 1; i >= 0; i--) {
        if (anterior[i].tipo !== 'pausa') { indiceAtual = i; break; }
      }
      destacarFala(indiceAtual);
      atualizarBotoesNavegacao();
    }
    return;
  }
  if (novo >= aula.length) {
    if (indiceCapitulo < getTotalCapitulos() - 1) {
      pularCapitulo(1);
    } else {
      mostrarToast('✅ Fim do conteúdo');
    }
    return;
  }

  const estavaTocando = tocando && !pausado;
  pararSilencioso();
  indiceAtual = novo;

  destacarFala(indiceAtual);
  atualizarBotoesNavegacao();

  if (estavaTocando) {
    setTimeout(function() { tocarDeOndeParou(); }, 80);
  }
}

/* ═══════════════════════════════════════════════════
   FALA
   ═══════════════════════════════════════════════════ */
function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach(function(parte, iLonga) {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach(function(p, iCurta) {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) {
        const comEnfase = p.split(/(\*[^*]+\*)/g);
        comEnfase.forEach(function(frag) {
          if (!frag) return;
          if (frag.startsWith('*') && frag.endsWith('*')) {
            segmentos.push({ tipo:'enfase', texto: frag.slice(1, -1).trim() });
          } else if (frag.trim()) {
            segmentos.push({ tipo:'fala', texto: frag.trim() });
          }
        });
      }
    });
  });
  return segmentos;
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(function(resolve) {
    let resolvido = false;
    const finalizar = function() {
      if (!resolvido) { resolvido = true; resolve(); }
    };

    if (!synth) { finalizar(); return; }

    const u = new SpeechSynthesisUtterance(texto);
    u.lang = (voz && voz.lang) || 'pt-BR';
    u.rate = Math.max(0.1, Math.min(2.0, rate * velocidade));
    u.pitch = Math.max(0, Math.min(2.0, pitch));
    u.volume = (volume == null) ? 1.0 : volume;
    if (voz) u.voice = voz;
    u.onend = finalizar;
    u.onerror = finalizar;

    try { synth.speak(u); } catch(e) { finalizar(); return; }

    const estimativa = Math.max(3000, texto.length * 130 / u.rate);
    setTimeout(finalizar, estimativa);
  });
}

async function falarComMicroPausas(textoOriginal, perfil, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (let i = 0; i < segmentos.length; i++) {
    const seg = segmentos[i];
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(perfil.microCurta / velocidade);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(perfil.microLonga / velocidade);
    } else if (seg.tipo === 'enfase') {
      await falar(seg.texto, perfil.rateEnfase, perfil.pitchEnfase, perfil.volume, voz);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, perfil.rate, perfil.pitch, perfil.volume, voz);
    }
  }
}

function esperar(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

/* ═══════════════════════════════════════════════════
   LOOP PRINCIPAL
   ═══════════════════════════════════════════════════ */
async function tocarDeOndeParou() {
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    mostrarToast('⚠️ Áudio não compatível com este navegador');
    return;
  }
  if (!elenco || !elenco.professor) {
    mostrarToast('⚠️ Sem vozes pt-BR');
    return;
  }

  const aula = getAulaAtual();
  cancelar = false;
  tocando = true;
  pausado = false;
  setBtnEstado(true);

  const indiceInicial = indiceAtual;

  for (let i = indiceAtual; i < aula.length; i++) {
    if (cancelar) return;
    indiceAtual = i;
    const fala = aula[i];

    if (fala.tipo === 'pausa') {
      await esperar(PERFIS.professor.pausas.pausa / velocidade);
      continue;
    }

    const voz = elenco[fala.papel];
    const perfil = PERFIS[fala.papel];

    const pausaAntes = perfil.pausas[fala.tipo] || 0;
    const ehPrimeiraFalaDoPlay = (i === indiceInicial);
    if (pausaAntes > 0 && !(isIOS && ehPrimeiraFalaDoPlay)) {
      await esperar(pausaAntes / velocidade);
    }

    destacarFala(i);
    atualizarBotoesNavegacao();

    await falarComMicroPausas(fala.texto, perfil, voz);
    if (cancelar) return;
  }

  if (!cancelar) {
    resetDestaques();
    setBtnEstado(false);
    tocando = false;
    pausado = false;
    atualizarBotoesNavegacao();

    if (indiceCapitulo < getTotalCapitulos() - 1) {
      mostrarToast('✅ Fim do Bloco ' + (indiceCapitulo + 1) + ' — toque em ⇥');
    } else {
      mostrarToast('✅ Fim do conteúdo');
    }
  }
}

/* ═══════════════════════════════════════════════════
   PLAYER ARRASTÁVEL
   ═══════════════════════════════════════════════════ */
const player = document.getElementById('player');
const handle = document.getElementById('handle');
let arrastando = false;
let startX = 0, startY = 0, startLeft = 0, startTop = 0;
let moveu = false;

function iniciarArraste(e) {
  if (e.target !== handle && !handle.contains(e.target)) return;
  arrastando = true;
  moveu = false;
  const rect = player.getBoundingClientRect();
  startLeft = rect.left;
  startTop = rect.top;
  const ponto = e.touches ? e.touches[0] : e;
  startX = ponto.clientX;
  startY = ponto.clientY;
  player.style.left = startLeft + 'px';
  player.style.top = startTop + 'px';
  player.style.transform = 'none';
  player.style.bottom = 'auto';
  e.preventDefault();
}

function moverArraste(e) {
  if (!arrastando) return;
  const ponto = e.touches ? e.touches[0] : e;
  const dx = ponto.clientX - startX;
  const dy = ponto.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moveu = true;
  const novoLeft = Math.max(8, Math.min(window.innerWidth - player.offsetWidth - 8, startLeft + dx));
  const novoTop  = Math.max(8, Math.min(window.innerHeight - player.offsetHeight - 8, startTop + dy));
  player.style.left = novoLeft + 'px';
  player.style.top  = novoTop + 'px';
}

function soltarArraste(e) {
  if (!arrastando) return;
  arrastando = false;
  if (e && e.preventDefault) e.preventDefault();
}

handle.addEventListener('mousedown', iniciarArraste);
document.addEventListener('mousemove', moverArraste);
document.addEventListener('mouseup', soltarArraste);
handle.addEventListener('touchstart', iniciarArraste, { passive: false });
document.addEventListener('touchmove', moverArraste, { passive: false });
document.addEventListener('touchend', soltarArraste);

/* ═══════════════════════════════════════════════════

  const el = document.getElementById('debugElenco');
  if (!el) return;

  const linhas = Object.entries(elenco).map(function(par) {

    const ativo = (getAulaAtual()[indiceAtual] && getAulaAtual()[indiceAtual].papel === papel) ? ' ativa' : '';
    const perfil = PERFIS[papel];

    return '<div class="linha' + ativo + '">' +

  }).join('');

  const unicas = new Set(Object.values(elenco).map(function(v) { return v.name; })).size;
  const ptBR = vozesPtBR().length;

  let aviso = '';
  if (isIOS && !felipeEncontrado) {
    aviso = '<div class="aviso">📱 iPhone sem Felipe! Baixe em: Ajustes → Acessibilidade → Conteúdo Falado → Vozes → Português (Brasil) → Felipe.</div>';
  } else if (isIOS && felipeEncontrado) {
    aviso = '<div class="sucesso">✅ iPhone com Felipe!</div>';
  } else if (unicas < 3) {
    aviso = '<div class="aviso">⚠️ Só ' + unicas + ' vozes distintas. Instale mais em Ajustes.</div>';
  }

  el.innerHTML = linhas +
    '<div class="info">' +
      'Vozes únicas: ' + unicas + ' · pt-BR disponíveis: ' + ptBR + '<br>' +
      'Total exposto: ' + todasAsVozes.length + '<br>' +
      'Modo: ' + (isIOS ? 'iPhone/Safari' : 'Desktop/Microsoft') + '<br>' +
      'Felipe detectado: ' + (felipeEncontrado ? '✅ sim' : '❌ não') + '<br>' +
      'iOS desbloqueado: ' + (iosDesbloqueado ? '✅ sim' : '⏳ aguardando gesto') +
    '</div>' + aviso;
}

/* ═══════════════════════════════════════════════════
   ELENCO
   ═══════════════════════════════════════════════════ */
function embaralhar(lista) {
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const PRIORIDADE_PROFESSOR = [
  /felipe/i, /daniel/i, /antonio|antônio/i, /ricardo/i,
  /lucas/i, /thiago/i, /paulo/i,
  /microsoft.*(daniel|antonio|ricardo|felipe)/i,
  /google.*português/i
];

const PRIORIDADE_ALUNAS = [
  /maria/i, /francisca/i, /thalita|talita/i,
  /luciana/i, /fernanda/i, /camila/i, /joana/i
];

function escolherVozProfessor(vozes) {
  for (let i = 0; i < PRIORIDADE_PROFESSOR.length; i++) {
    const regex = PRIORIDADE_PROFESSOR[i];
    const v = vozes.find(function(v) { return regex.test(v.name); });
    if (v) {
      felipeEncontrado = /felipe/i.test(v.name);
      return v;
    }
  }
  const masc = vozes.filter(function(v) {
    return /daniel|felipe|ricardo|lucas|joão|joao|carlos|pedro|paulo|thiago|mateus|gustavo|arthur|antonio|antônio|male|homem/i.test(v.name);
  });
  if (masc.length) return embaralhar(masc)[0];
  return embaralhar(vozes)[0];
}

function escolherVozAluna(vozes, usadas) {
  for (let i = 0; i < PRIORIDADE_ALUNAS.length; i++) {
    const regex = PRIORIDADE_ALUNAS[i];
    const v = vozes.find(function(v) { return regex.test(v.name) && !usadas.has(v); });
    if (v) return v;
  }
  const fem = vozes.filter(function(v) {
    return /maria|francisca|thalita|talita|luciana|fernanda|camila|joana|helena|mariana|ana|beatriz|carolina|female|mulher/i.test(v.name) && !usadas.has(v);
  });
  if (fem.length) return embaralhar(fem)[0];
  return null;
}

function distribuirElenco(vozes) {
  if (!vozes.length) return null;

  const professor = escolherVozProfessor(vozes);
  const usadas = new Set([professor]);
  const e = { professor: professor };

  const alunasFem = ['aluno1','aluno3','aluno5','aluno6'];
  alunasFem.forEach(function(papel) {
    const v = escolherVozAluna(vozes, usadas);
    if (v) { e[papel] = v; usadas.add(v); }
  });

  const restantes = embaralhar(vozes.filter(function(v) { return !usadas.has(v); }));
  const papeisRestantes = PAPEIS_ALUNO.filter(function(p) { return !e[p]; });
  papeisRestantes.forEach(function(papel, i) {
    if (restantes.length) {
      e[papel] = restantes[i % restantes.length];
    } else {
      e[papel] = embaralhar(vozes)[i % vozes.length];
    }
  });

  return e;
}

function ajustarPerfilProfessor() {
  if (!isIOS) return;
  if (!felipeEncontrado) {
    PERFIS.professor = {
      rate: 0.85, pitch: 0.70, volume: 1.0,
      microCurta: 200, microLonga: 350,
      rateEnfase: 0.79, pitchEnfase: 0.68,
      pausas: { abertura:950, definicao:490, pergunta:320, confirmacao:420, guarde:1120, conclusao:860, pausa:670 }
    };
  } else {
    PERFIS.professor.rate = 0.88;
    PERFIS.professor.pitch = 0.78;
    PERFIS.professor.rateEnfase = 0.82;
    PERFIS.professor.pitchEnfase = 0.75;
  }
}
