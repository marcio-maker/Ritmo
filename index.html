<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diagnóstico de Vozes</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 20px;
    line-height: 1.6; font-size: 14px;
  }
  h1 { font-size: 1rem; color: #93c5fd; margin-bottom: 12px; }
  h2 { font-size: .85rem; color: #fbbf24; margin: 16px 0 8px; }
  .voz {
    background: #1e293b; border-radius: 8px; padding: 10px;
    margin-bottom: 6px; font-size: .8rem;
  }
  .voz b { color: #22d3ee; }
  .voz small { color: #64748b; display: block; margin-top: 2px; }
  .aviso { color: #f87171; font-weight: 700; }
  .ok { color: #22d3ee; font-weight: 700; }
  button {
    width: 100%; padding: 14px; margin-top: 16px; border: none;
    border-radius: 10px; background: #2563eb; color: #fff;
    font-size: 1rem; font-weight: 700; font-family: inherit;
  }
</style>
</head>
<body>
<h1>🔍 Diagnóstico de Vozes — Safari iOS</h1>
<p>Este arquivo só lista as vozes. Não toca nada.</p>
<div id="saida">Carregando...</div>
<button onclick="location.reload()">🔄 Recarregar</button>

<script>
let tentativas = 0;

function listar() {
  const todas = window.speechSynthesis.getVoices();
  const pt = todas.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR' || v.lang.startsWith('pt'));
  const saida = document.getElementById('saida');

  let html = '';
  html += `<h2>Total de vozes no iPhone: ${todas.length}</h2>`;
  html += `<h2>Vozes pt-BR / pt: ${pt.length}</h2>`;

  if (pt.length === 0) {
    html += `<p class="aviso">⚠️ Nenhuma voz pt-BR encontrada ainda. Tentativa ${tentativas}. Aguardando voiceschanged...</p>`;
  } else {
    pt.forEach(v => {
      const aprimorada = v.name.includes('Aprimorada') ? ' <span class="ok">✓ APRIMORADA</span>' : '';
      html += `
        <div class="voz">
          <b>${v.name}</b>${aprimorada}
          <small>lang: ${v.lang} | local: ${v.localService} | default: ${v.default}</small>
        </div>
      `;
    });
  }

  // Procura especificamente as 3 que queremos
  html += `<h2>Busca específica</h2>`;
  ['Felipe (Aprimorada)', 'Felipe', 'Fernanda (Aprimorada)', 'Fernanda', 'Luciana (Aprimorada)', 'Luciana'].forEach(nome => {
    const achou = todas.find(v => v.name === nome);
    html += `<div class="voz">${achou ? '✓' : '✗'} <b>${nome}</b> ${achou ? '<span class="ok">ENCONTRADA</span>' : '<span class="aviso">NÃO ENCONTRADA</span>'}</div>`;
  });

  saida.innerHTML = html;
}

function tentar() {
  tentativas++;
  listar();
  if (tentativas < 20) setTimeout(tentar, 300);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { tentar(); };
  tentar();
} else {
  document.getElementById('saida').innerHTML = '<p class="aviso">speechSynthesis não disponível neste navegador.</p>';
}
</script>
</body>
</html>
