<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loop 2 Vozes — Felipe e Fernanda</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  header { padding: 14px 18px 0; text-align: center; }
  header h1 {
    font-size: .68rem; font-weight: 700; letter-spacing: .08em;
    color: #64748b; text-transform: uppercase; margin-bottom: 4px;
  }
  header p { font-size: 1rem; font-weight: 700; color: #f1f5f9; }

  .diagnostico {
    margin: 10px 18px 0;
    background: #1e293b;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .72rem;
    line-height: 1.5;
    color: #94a3b8;
  }
  .diagnostico b { color: #22d3ee; }
  .diagnostico .ok { color: #22d3ee; }
  .diagnostico .aviso { color: #f87171; }

  .tabs {
    display: flex; gap: 6px; padding: 12px 18px 0; overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: 68px; padding: 9px 5px;
    border: none; border-radius: 9px;
    font-size: .72rem; font-weight: 700; font-family: inherit;
    cursor: pointer; background: #1e293b; color: #64748b;
    transition: background .15s, color .15s; white-space: nowrap;
  }
  .tab.ativa { background: #1e3a8a; color: #fff; }

  .paineis { flex: 1; padding: 12px 18px 0; overflow: hidden; position: relative; }
  .painel { display: none; flex-direction: column; gap: 8px; height: 100%; }
  .painel.ativo { display: flex; }

  .label-versao {
    font-size: .66rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: #475569; padding-left: 2px;
  }
  .voz-info {
    font-size: .68rem; color: #fbbf24; padding-left: 2px; line-height: 1.4;
    font-weight: 600;
  }
  .voz-info.tocando { color: #22d3ee; }
  .voz-info.erro { color: #f87171; }

  .texto-bloco {
    background: #1e293b; border-radius: 12px; padding: 12px;
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .frase {
    font-size: .9rem; line-height: 1.55; color: #cbd5e1;
    padding: 4px 7px; border-radius: 6px; margin-bottom: 1px;
    transition: background .15s, color .15s, transform .15s;
  }
  .frase.falando { background: rgba(59,130,246,.2); color: #fff; transform: translateX(2px); }
  .frase.falada { color: #475569; }
  .quebra { height: 8px; }

  .player { padding: 10px 0 0; }
  .btn-play {
    width: 100%; min-height: 50px; border: none; border-radius: 12px;
    font-size: .92rem; font-weight: 800; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: opacity .15s, transform .1s;
  }
  .btn-play:active { opacity: .8; transform: scale(.97); }
  .btn-play.parado  { background: #2563eb; color: #fff; }
  .btn-play.tocando { background: #dc2626; color: #fff; }

  .progresso-wrap {
    margin-top: 7px; height: 4px; background: #1e293b;
    border-radius: 2px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: #2563eb; border-radius: 2px;
    width: 0%; transition: width .3s;
  }
</style>
</head>
<body>

<header>
  <h1>👥 RH · Loop 2 Vozes</h1>
  <p>Felipe ↔ Fernanda <span id="statusLoop" style="display:inline-flex;align-items:center;gap:4px;background:#0f3460;color:#93c5fd;font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;">iniciando...</span></p>
</header>

<div class="diagnostico" id="diagnostico">🔍 Carregando vozes do iPhone...</div>

<div class="tabs">
  <button class="tab ativa" data-v="b1" onclick="trocarTab('b1')">Bloco 1</button>
  <button class="tab" data-v="b2" onclick="trocarTab('b2')">Bloco 2</button>
  <button class="tab" data-v="b3" onclick="trocarTab('b3')">Bloco 3</button>
  <button class="tab" data-v="b4" onclick="trocarTab('b4')">Bloco 4</button>
</div>

<div class="paineis" id="paineis"></div>

<script>
/* =====================================================
   CONEXÃO COM AS VOZES DO iPHONE
   ===================================================== */
let todasAsVozes = [];
let vozesResolvidas = [];
let vozesCarregadas = false;

function carregarVozesComRetry(callback) {
  let tentativas = 0;
  const MAX_TENTATIVAS = 50;

  function tentar() {
    tentativas++;
    const vozes = window.speechSynthesis.getVoices();
    if (vozes.length > 0) {
      todasAsVozes = vozes;
      vozesCarregadas = true;
      callback();
      return;
    }
    if (tentativas < MAX_TENTATIVAS) {
      setTimeout(tentar, 100);
    } else {
      callback();
    }
  }

  if (window.speechSynthesis.addEventListener) {
    try {
      window.speechSynthesis.addEventListener('voiceschanged', tentar);
    } catch (e) {
      window.speechSynthesis.onvoiceschanged = tentar;
    }
  } else {
    window.speechSynthesis.onvoiceschanged = tentar;
  }
  tentar();
}

function buscarVoz(nome) {
  return todasAsVozes.find(v => v.name === `${nome} (Aprimorada)`)
      || todasAsVozes.find(v => v.name === `${nome} (Enhanced)`)
      || todasAsVozes.find(v => v.name === nome)
      || todasAsVozes.find(v => v.name.includes(nome))
      || null;
}

function resolverVozes() {
  // APENAS Felipe e Fernanda. Luciana foi removida.
  const felipe = buscarVoz('Felipe');
  const fernanda = buscarVoz('Fernanda');

  vozesResolvidas = [
    { nome: 'Felipe',   voz: felipe },
    { nome: 'Fernanda', voz: fernanda }
  ];

  const diag = document.getElementById('diagnostico');
  let html = `<b>🔍 Diagnóstico:</b> ${todasAsVozes.length} vozes no iPhone · `;
  const ptBR = todasAsVozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
  html += `${ptBR.length} em pt-BR<br>`;

  vozesResolvidas.forEach(r => {
    if (r.voz) {
      const aprimorada = r.voz.name.includes('Aprimorada') || r.voz.name.includes('Enhanced');
      html += `<span class="ok">✓ ${r.nome}: ${r.voz.name}${aprimorada ? ' (Aprimorada)' : ''}</span><br>`;
    } else {
      html += `<span class="aviso">✗ ${r.nome}: NÃO ENCONTRADA</span><br>`;
    }
  });

  diag.innerHTML = html;

  const status = document.getElementById('statusLoop');
  const encontradas = vozesResolvidas.filter(r => r.voz).length;
  if (encontradas === 2) {
    status.textContent = '2/2 vozes ✓';
    status.style.background = '#14532d';
    status.style.color = '#86efac';
  } else if (encontradas === 1) {
    status.textContent = '1/2 vozes';
    status.style.background = '#78350f';
    status.style.color = '#fcd34d';
  } else {
    status.textContent = '0/2 vozes';
    status.style.background = '#7f1d1d';
    status.style.color = '#fca5a5';
  }

  return vozesResolvidas;
}

/* =====================================================
   CONTEÚDO — 4 Blocos de RH
   ===================================================== */
const BLOCOS = [
  {
    id: "b1", titulo: "Bloco 1", heading: "O que é gestão de pessoas",
    vozIndex: 0, // Felipe
    unidades: [
      { tipo:"abertura",  texto:"Gestão de pessoas é a área responsável pelo ser humano no trabalho." },
      { tipo:"definicao", texto:"Ela atrai, desenvolve, motiva | e mantém as pessoas na empresa." },
      { tipo:"pausa" },
      { tipo:"definicao", texto:"Durante muito tempo, essa área foi vista apenas como operacional." },
      { tipo:"definicao", texto:"Cuidava de folha de pagamento, ponto, férias e documentação. || Era o setor que resolvia papelada." },
      { tipo:"pausa" },
      { tipo:"definicao", texto:"Hoje o cenário mudou. || A gestão de pessoas passou a ser estratégica." },
      { tipo:"guarde",    texto:"Guarde isto." },
      { tipo:"guarde",    texto:"Gestão de pessoas é a área que cuida do ser humano no trabalho." }
    ]
  },
  {
    id: "b2", titulo: "Bloco 2", heading: "Gestão estratégica de pessoas",
    vozIndex: 1, // Fernanda
    unidades: [
      { tipo:"abertura",  texto:"A gestão estratégica de pessoas é quando a área de recursos humanos deixa de agir só no operacional | e passa a participar do planejamento da organização." },
      { tipo:"pausa" },
      { tipo:"definicao", texto:"Na prática, significa alinhar as políticas de pessoas aos objetivos do negócio." },
      { tipo:"definicao", texto:"Se a empresa quer crescer, o setor de pessoas precisa preparar a equipe para esse crescimento." },
      { tipo:"definicao", texto:"Se a empresa quer inovar, precisa contratar e desenvolver pessoas com esse perfil." },
      { tipo:"guarde",    texto:"Guarde isto." },
      { tipo:"guarde",    texto:"Gestão estratégica de pessoas é alinhar gente e negócio." }
    ]
  },
  {
    id: "b3", titulo: "Bloco 3", heading: "Recrutamento",
    vozIndex: 0, // Felipe de novo (ciclo de 2)
    unidades: [
      { tipo:"abertura",  texto:"Recrutamento é o processo de atrair candidatos para uma vaga." },
      { tipo:"definicao", texto:"É a etapa em que a empresa vai ao mercado buscar pessoas com potencial para ocupar determinada função." },
      { tipo:"pausa" },
      { tipo:"definicao", texto:"Recrutamento não é a mesma coisa que seleção. || Muita gente confunde." },
      { tipo:"definicao", texto:"Recrutamento atrai. Seleção escolhe. || São duas etapas diferentes, uma depois da outra." },
      { tipo:"guarde",    texto:"Guarde isto." },
      { tipo:"guarde",    texto:"Recrutamento é atrair." }
    ]
  },
  {
    id: "b4", titulo: "Bloco 4", heading: "Seleção de pessoas",
    vozIndex: 1, // Fernanda de novo (ciclo de 2)
    unidades: [
      { tipo:"abertura",  texto:"Seleção é o processo de escolher, entre os candidatos recrutados, aquele que tem mais chance de dar certo na vaga." },
      { tipo:"pausa" },
      { tipo:"definicao", texto:"Se o recrutamento atrai, a seleção filtra." },
      { tipo:"definicao", texto:"Ela compara o perfil de cada candidato com o que a vaga exige. | E escolhe o mais adequado." },
      { tipo:"definicao", texto:"Existem várias técnicas de seleção. || As principais são a entrevista, as provas de conhecimento, os testes psicológicos, as dinâmicas de grupo e a análise curricular." },
      { tipo:"guarde",    texto:"Guarde isto." },
      { tipo:"guarde",    texto:"Recrutamento atrai, seleção escolhe." }
    ]
  }
];

/* =====================================================
   PERFIL V6b — Palestrante inspirador
   ===================================================== */
const V6B = {
  base: { rate: 0.88, pitch: 0.96, volume: 1.0 },
  pausas: {
    abertura:700, definicao:400, lista:180, exemplo:220,
    conclusao:500, guarde:800, pausa:650
  },
  ratePorTipo: {
    abertura:0.86, definicao:0.90, lista:0.92,
    exemplo:0.90, conclusao:0.84, guarde:0.80
  },
  pitchPorTipo: {
    abertura:0.98, definicao:0.96, lista:0.96,
    exemplo:0.98, conclusao:0.92, guarde:0.90
  },
  volumePorTipo: {
    abertura:1.0, definicao:1.0, lista:0.98,
    exemplo:0.96, conclusao:1.0, guarde:0.90
  },
  microCurta: 120, microLonga: 220
};

let synth = window.speechSynthesis;
let tocando = null;
let cancelar = false;

/* ── Render ── */
const paineisEl = document.getElementById('paineis');

function renderTextoLegivel(texto) {
  return texto.replace(/\s*\|\|\s*/g, ' ').replace(/\s*\|\s*/g, ' ');
}

function renderTodos() {
  paineisEl.innerHTML = '';
  BLOCOS.forEach((bloco, idx) => {
    const painel = document.createElement('div');
    painel.className = 'painel' + (idx === 0 ? ' ativo' : '');
    painel.id = 'painel-' + bloco.id;

    const label = document.createElement('div');
    label.className = 'label-versao';
    label.textContent = `${bloco.titulo} — ${bloco.heading}`;
    painel.appendChild(label);

    const vozInfo = document.createElement('div');
    vozInfo.className = 'voz-info';
    vozInfo.id = 'vozinfo-' + bloco.id;
    vozInfo.textContent = '🎙 Aguardando vozes...';
    painel.appendChild(vozInfo);

    const texto = document.createElement('div');
    texto.className = 'texto-bloco';
    texto.id = 'texto-' + bloco.id;
    bloco.unidades.forEach((u, i) => {
      if (u.tipo === 'pausa') {
        const br = document.createElement('div');
        br.className = 'quebra';
        br.dataset.idx = i;
        texto.appendChild(br);
      } else {
        const el = document.createElement('div');
        el.className = 'frase';
        el.id = bloco.id + '-f-' + i;
        el.textContent = renderTextoLegivel(u.texto);
        texto.appendChild(el);
      }
    });
    painel.appendChild(texto);

    const player = document.createElement('div');
    player.className = 'player';
    player.innerHTML = `
      <button class="btn-play parado" id="btn-${bloco.id}" onclick="togglePlay('${bloco.id}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Ouvir ${bloco.titulo}
      </button>
      <div class="progresso-wrap"><div class="progresso-fill" id="prog-${bloco.id}"></div></div>
    `;
    painel.appendChild(player);

    paineisEl.appendChild(painel);
  });
}
renderTodos();

function atualizarInfoVozes() {
  BLOCOS.forEach(bloco => {
    const r = vozesResolvidas[bloco.vozIndex];
    const el = document.getElementById('vozinfo-' + bloco.id);
    if (!el) return;
    if (r && r.voz) {
      el.textContent = `🎙 ${r.nome}: ${r.voz.name}`;
      el.className = 'voz-info';
    } else if (r) {
      el.textContent = `⚠️ ${r.nome} não encontrada`;
      el.className = 'voz-info erro';
    }
  });
}

/* ── Tabs ── */
function trocarTab(v) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('ativa', t.dataset.v === v));
  document.querySelectorAll('.painel').forEach(p => p.classList.toggle('ativo', p.id === 'painel-' + v));
  if (tocando && tocando !== v) pararTudo();
}

/* ── Player ── */
function togglePlay(id) {
  if (tocando === id) { pararTudo(); return; }
  if (tocando) pararTudo();
  tocarBloco(id);
}

function pararTudo() {
  cancelar = true;
  synth.cancel();
  if (tocando) {
    setBtnEstado(tocando, false);
    resetHighlights(tocando);
    setProgresso(tocando, 0);
  }
  tocando = null;
}

function setBtnEstado(id, playing) {
  const btn = document.getElementById('btn-' + id);
  const bloco = BLOCOS.find(b => b.id === id);
  if (!btn || !bloco) return;
  if (playing) {
    btn.className = 'btn-play tocando';
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Parar`;
  } else {
    btn.className = 'btn-play parado';
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/></svg> Ouvir ${bloco.titulo}`;
  }
}

function setProgresso(id, pct) {
  const el = document.getElementById('prog-' + id);
  if (el) el.style.width = pct + '%';
}

function resetHighlights(id) {
  document.querySelectorAll('#texto-' + id + ' .frase').forEach(el => {
    el.classList.remove('falando', 'falada');
  });
}

function highlightFrase(id, idx) {
  document.querySelectorAll('#texto-' + id + ' .frase').forEach(el => {
    el.classList.remove('falando');
    if (parseInt(el.id.split('-f-')[1]) < idx) el.classList.add('falada');
  });
  const el = document.getElementById(id + '-f-' + idx);
  if (el) {
    el.classList.add('falando');
    el.classList.remove('falada');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function dividirComMicroPausas(texto) {
  const partesLongas = texto.split(/\s*\|\|\s*/);
  const segmentos = [];
  partesLongas.forEach((parte, iLonga) => {
    if (iLonga > 0) segmentos.push({ tipo:'pausaLonga' });
    const partesCurtas = parte.split(/\s*\|\s*/);
    partesCurtas.forEach((p, iCurta) => {
      if (iCurta > 0) segmentos.push({ tipo:'pausaCurta' });
      if (p.trim()) segmentos.push({ tipo:'fala', texto:p.trim() });
    });
  });
  return segmentos;
}

/* ── Workaround do iOS 26: força a troca de voz ──
   1. Cancela tudo
   2. Fala um espaço vazio com a voz nova (o iOS "grava" a voz)
   3. Espera 250ms
   4. Depois fala de verdade
*/
async function prepararVoz(voz) {
  return new Promise(resolve => {
    synth.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'pt-BR';
      u.volume = 0;      // inaudível
      u.rate = 2.0;      // rápido para não atrasar
      if (voz) u.voice = voz;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      synth.speak(u);
      // fallback caso onend não dispare
      setTimeout(resolve, 300);
    }, 100);
  });
}

async function falarComMicroPausas(textoOriginal, rate, pitch, volume, voz) {
  const segmentos = dividirComMicroPausas(textoOriginal);
  for (const seg of segmentos) {
    if (cancelar) return;
    if (seg.tipo === 'pausaCurta') {
      await esperar(V6B.microCurta);
    } else if (seg.tipo === 'pausaLonga') {
      await esperar(V6B.microLonga);
    } else if (seg.tipo === 'fala') {
      await falar(seg.texto, rate, pitch, volume, voz);
    }
  }
}

function falar(texto, rate, pitch, volume, voz) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume ?? 1.0;
    if (voz) u.voice = voz;
    u.onend = resolve;
    u.onerror = resolve;
    synth.speak(u);
  });
}

async function tocarBloco(id) {
  const bloco = BLOCOS.find(b => b.id === id);
  if (!bloco) return;

  if (!vozesCarregadas) {
    carregarVozesComRetry(() => {
      resolverVozes();
      atualizarInfoVozes();
      tocarBloco(id);
    });
    return;
  }

  const r = vozesResolvidas[bloco.vozIndex];
  const voz = r ? r.voz : null;

  cancelar = false;
  tocando = id;
  setBtnEstado(id, true);
  resetHighlights(id);

  const infoEl = document.getElementById('vozinfo-' + id);
  if (infoEl && voz) {
    infoEl.textContent = `🎙 Tocando agora: ${voz.name}`;
    infoEl.className = 'voz-info tocando';
  }

  // WORKAROUND iOS 26: força a voz antes de falar
  await prepararVoz(voz);
  if (cancelar) return;

  const total = bloco.unidades.filter(u => u.tipo !== 'pausa').length;
  let faladas = 0;

  for (let i = 0; i < bloco.unidades.length; i++) {
    if (cancelar) break;
    const u = bloco.unidades[i];

    if (u.tipo === 'pausa') {
      await esperar(V6B.pausas.pausa);
      continue;
    }

    const pausaAntes = V6B.pausas[u.tipo] || 0;
    if (pausaAntes > 0) await esperar(pausaAntes);

    const rate   = V6B.ratePorTipo[u.tipo]   ?? V6B.base.rate;
    const pitch  = V6B.pitchPorTipo[u.tipo]  ?? V6B.base.pitch;
    const volume = V6B.volumePorTipo[u.tipo] ?? V6B.base.volume;

    highlightFrase(id, i);
    faladas++;
    setProgresso(id, Math.round((faladas / total) * 100));

    await falarComMicroPausas(u.texto, rate, pitch, volume, voz);
    if (cancelar) break;
  }

  if (!cancelar) {
    resetHighlights(id);
    setProgresso(id, 100);
    setTimeout(() => {
      setBtnEstado(id, false);
      setProgresso(id, 0);
      if (tocando === id) tocando = null;
      atualizarInfoVozes();
    }, 700);
  }
}

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* Inicialização */
carregarVozesComRetry(() => {
  resolverVozes();
  atualizarInfoVozes();
});
</script>
</body>
</html>
